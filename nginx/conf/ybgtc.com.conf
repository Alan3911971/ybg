# ============================================================================
# ybgtc.com 反向代理配置样例（Nginx）
# 部署时把本文件复制到 Nginx conf.d，替换证书路径后 nginx -s reload
# ============================================================================
server {
    listen 80;
    server_name ybgtc.com www.ybgtc.com;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ybgtc.com www.ybgtc.com;

    ssl_certificate     /etc/nginx/certs/ybgtc.com.pem;
    ssl_certificate_key /etc/nginx/certs/ybgtc.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # 后端 API（同源，页面 JS 用相对路径 /api）
    location /api/ {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
    }

    # 静态 H5（顾客/商家/平台）与二维码入口
    location /h5/ {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
    }

    location /qr {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
    }

    # ========== 商家后台 ==========
    location /merchant/ {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== 平台后台 ==========
    location /admin/ {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== 物业模块 ==========
    # 物业后台（PC端）
    location /property/admin/ {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 业主H5（移动端）
    location /property/customer/ {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 微信分账回调（无需鉴权，微信服务器直接调用）
    location = /api/pay/wx/split-notify {
        proxy_pass http://ibigou-app:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    location / {
        return 302 /h5/customer/index.html;
    }
}
