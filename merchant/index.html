<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;}
.header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:24px 20px;}
.header h1{font-size:20px;font-weight:700;}
.header p{opacity:0.9;font-size:13px;margin-top:4px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
.card{background:#fff;border-radius:12px;padding:20px;text-decoration:none;color:inherit;display:block;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.card .icon{font-size:32px;margin-bottom:8px;}
.card .title{font-size:16px;font-weight:600;}
.card .desc{font-size:12px;color:#64748b;margin-top:4px;}
</style>
</head>
<body>
<div class="header">
  <h1>商家后台</h1>
  <p>宜必购商家管理中心</p>
</div>

<div class="grid">
  <a class="card" href="queue.html">
    <div class="icon">📺</div>
    <div class="title">排队叫号</div>
    <div class="desc">叫号面板 / 过号 / 统计</div>
  </a>
  <a class="card" href="queue-config.html">
    <div class="icon">⚙️</div>
    <div class="title">排队配置</div>
    <div class="desc">窗口数 / 桌型 / 前缀</div>
  </a>
  <a class="card" href="ads.html">
    <div class="icon">📢</div>
    <div class="title">广告管理</div>
    <div class="desc">上传素材 / 轮播设置</div>
  </a>
  <a class="card" href="../tv.html">
    <div class="icon">🖥️</div>
    <div class="title">电视大屏</div>
    <div class="desc">预览叫号 + 广告轮播</div>
  </a>
</div>

<script>
var merchantNo = localStorage.getItem('ibigou_merchant_no') || 'M001';
// 所有链接加 merchantNo 参数
document.querySelectorAll('a').forEach(function(a){
  var href = a.getAttribute('href');
  if(href && !href.includes('?')){
    a.setAttribute('href', href + '?merchantNo=' + merchantNo);
  }
});
</script>
</body>
</html>
