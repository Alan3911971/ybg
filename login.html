<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff5b3e">
<title>登录 · 宜必购</title>
<style>
:root{--c-primary:#ff5b3e;--c-text:#1a1d29;--c-text-2:#5f6478;--c-text-3:#9095a8;--c-bg:#f7f8fb;--c-border:#eceef3;--c-success:#16a34a;--c-warning:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--c-text);background:var(--c-bg);font-size:15px;}
body{min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom));}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-bottom:1px solid var(--c-border);}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;}
.brand-dot{width:22px;height:22px;border-radius:7px;background:var(--c-primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
.input{width:100%;height:48px;padding:0 14px;border:1px solid var(--c-border);border-radius:10px;background:#fff;font-size:15px;color:var(--c-text);transition:border-color .15s;}
.input:focus{outline:none;border-color:var(--c-primary);}
.input::placeholder{color:var(--c-text-3);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 16px;border-radius:10px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:opacity .12s,transform .12s;}
.btn:active{transform:scale(.98);}
.btn--primary{background:var(--c-primary);color:#fff;}
.btn--primary[disabled]{opacity:.5;}
.btn--block{width:100%;}
.toast-host{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{padding:9px 14px;border-radius:8px;background:rgba(0,0,0,.84);color:#fff;font-size:13px;opacity:0;transform:translateY(-6px);transition:all .2s;}
.toast.show{opacity:1;transform:none;}
.toast.success{background:var(--c-success);}
.toast.warning{background:var(--c-warning);}
.code-row{display:flex;gap:10px;align-items:flex-start;}
.code-row .input{flex:1;}
.code-row .btn{width:auto;white-space:nowrap;padding:0 14px;flex-shrink:0;}
.tip{font-size:12px;color:var(--c-text-3);margin-top:8px;}
</style>
</head>
<body>
<div class="toast-host" id="toastHost"></div>
<div class="topbar"><div class="brand"><span class="brand-dot">盲</span>宜必购</div></div>
<main style="padding:32px 20px 24px;max-width:480px;margin:0 auto;">
  <div style="text-align:center;padding:24px 0 36px;">
    <div style="font-size:48px;line-height:1;margin-bottom:14px;">🎁</div>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:8px;">欢迎来到宜必购</h1>
    <p style="font-size:13px;color:var(--c-text-3);">登录后即可参与盲盒抽奖</p>
  </div>
  <div style="background:#fff;border:1px solid var(--c-border);border-radius:14px;padding:24px 18px;">
    <div style="margin-bottom:14px;">
      <label style="display:block;font-size:13px;color:var(--c-text-2);margin-bottom:8px;">手机号</label>
      <input id="phone" class="input" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" value="13800138000">
    </div>
    <div style="margin-bottom:14px;">
      <label style="display:block;font-size:13px;color:var(--c-text-2);margin-bottom:8px;">验证码</label>
      <div class="code-row">
        <input id="code" class="input" inputmode="numeric" maxlength="6" placeholder="请输入 6 位验证码" value="123456">
        <button id="btnSendCode" class="btn btn--primary">获取验证码</button>
      </div>
      <div class="tip">测试环境验证码固定为 <b style="color:var(--c-text-2);">123456</b></div>
    </div>
    <button id="btnLogin" class="btn btn--primary btn--block">登录</button>
  </div>
</main>
<script>
const q = id => document.getElementById(id);
function toast(msg, type){
  const host = q('toastHost'); if (!host) return;
  const t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg;
  host.appendChild(t); requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 220); }, 2600);
}
function validPhone(v){ return /^1[3-9]\d{9}$/.test(v); }
q('btnSendCode').addEventListener('click', function(){
  var v = (q('phone').value || '').trim();
  if (!validPhone(v)) { toast('请输入正确的 11 位手机号', 'warning'); return; }
  toast('验证码已发送（测试：123456）', 'success');
  q('btnSendCode').disabled = true; q('btnSendCode').textContent = '已发送';
});
q('btnLogin').addEventListener('click', function(){
  var p2 = (q('phone').value || '').trim();
  if (!validPhone(p2)) { toast('请输入正确的手机号', 'warning'); q('phone').focus(); return; }
  localStorage.setItem('ibigou_user_token', 'preview-token-' + Date.now());
  localStorage.setItem('ibigou_phone', p2);
  toast('登录成功', 'success');
  setTimeout(function(){ location.href = 'choose.html'; }, 400);
});
</script>
</body>
</html>
