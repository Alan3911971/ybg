<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码取号</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;min-height:100vh;}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:40px 24px;text-align:center;}
.hero h1{font-size:24px;font-weight:700;margin-bottom:8px;}
.hero p{opacity:0.9;font-size:14px;}
.card{margin:20px;padding:24px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.05);}
.card h2{font-size:18px;font-weight:700;margin-bottom:16px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:14px;color:#64748b;margin-bottom:8px;}
.form-group input,.form-group select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:16px;}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;}
.btn:active{opacity:0.8;}
.result{text-align:center;padding:20px 0;}
.result .ticket{font-size:72px;font-weight:900;color:#4f46e5;line-height:1;margin:20px 0;}
.result .info{font-size:16px;color:#64748b;line-height:1.8;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="hero">
  <h1 id="merchantName">排队取号</h1>
  <p>扫码取号，坐等叫号</p>
</div>

<div class="card" id="stepForm">
  <h2>填写取号信息</h2>
  <div class="form-group" id="seatGroup">
    <label>就餐人数</label>
    <select id="seats" onchange="matchSeat()">
      <option value="" selected>请选择人数</option>
      <option value="1">1人</option>
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4">4人</option>
      <option value="5">5人</option>
      <option value="6">6人</option>
      <option value="7">7人</option>
      <option value="8">8人</option>
      <option value="9">9人</option>
      <option value="10">10人</option>
      <option value="11">11人</option>
      <option value="12">12人</option>
    </select>
  </div>
  <div class="form-group" id="seatMatch" style="display:none;">
    <label>匹配桌型</label>
    <div id="seatMatchTip" style="font-size:16px;color:#0ea5e9;font-weight:600;line-height:44px;"></div>
  </div>
  <div class="form-group" id="windowGroup" style="display:none;">
    <label>窗口号</label>
    <select id="windowNo"></select>
  </div>
  <button class="btn" id="takeBtn" onclick="take()">取号</button>
</div>

<div class="card hidden" id="stepResult">
  <div class="result">
    <h2>取号成功</h2>
    <div class="ticket" id="ticketNo">A001</div>
    <div class="info" id="ticketInfo"></div>
    <button class="btn" style="margin-top:20px;" onclick="refresh()">刷新进度</button>
  </div>
</div>

<script>
var merchantNo = new URLSearchParams(location.search).get('merchantNo') || 'M001';
var openid = new URLSearchParams(location.search).get('openid');
var cfgEstWait = 10;
// 不需要手机号：取号时自动生成唯一虚拟号（后端 phone 必填，前端隐藏）
var vphone = null;

// 微信 OAuth 授权
function wxAuth(){
  var redirect = location.origin + '/h5/queue.html?merchantNo=' + merchantNo;
  fetch('/api/pay/wx/oauth-url?redirect=' + encodeURIComponent(redirect))
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.code === 0 && res.data.url){
        location.href = res.data.url;
      }
    });
}

// 微信 OAuth：保留函数但不再强制跳转——扫码直接进入取号页（openid 非必填，取号不依赖微信授权）
// if(isWeChat() && !openid){ wxAuth(); }

function api(path){return fetch(path).then(function(r){return r.json();});}
function apiPost(path){return fetch(path, {method:'POST'}).then(function(r){return r.json();});}

// 自动匹配桌型（商家桌型容量：2/4/6/10/12）
function matchSeatType(n){
  if(n <= 2) return 2;
  if(n <= 4) return 4;
  if(n <= 6) return 6;
  if(n <= 10) return 10;
  return 12;
}
function matchSeat(){
  var n = parseInt(document.getElementById('seats').value);
  if(!n){ document.getElementById('seatMatch').style.display = 'none'; return; }
  var t = matchSeatType(n);
  var pf = seatPrefix(t);
  document.getElementById('seatMatch').style.display = '';
  document.getElementById('seatMatchTip').textContent = '已自动匹配 ' + t + ' 人桌（' + pf + ' 号段）';
}

// 桌型容量 → 号段字母（与后端一致：2人桌=A、4人桌=B、6人桌=C、10人桌=D、12人桌=E）
function seatPrefix(t){
  if(t <= 2) return 'A';
  if(t <= 4) return 'B';
  if(t <= 6) return 'C';
  if(t <= 10) return 'D';
  return 'E';
}

// 加载配置
api('/api/tv/'+merchantNo+'/screen').then(function(res){
  if(res.code!==0) return;
  var d = res.data;
  document.getElementById('merchantName').textContent = d.merchantName || '排队取号';
  var cfg = d.config;
  if(cfg){
    cfgEstWait = cfg.estWaitMin || 10;
    if(cfg.windowCount > 1){
      document.getElementById('windowGroup').style.display = '';
      var sel = document.getElementById('windowNo');
      for(var i=1;i<=cfg.windowCount;i++){
        var opt = document.createElement('option');
        opt.value = i; opt.text = i + '号窗口';
        sel.appendChild(opt);
      }
    }
  }
});

var taking = false;
function take(){
  // 防重复提交：请求中禁用按钮，避免双击产生双数据
  if(taking){ return; }
  // 人数必选（1-12 人自由选择）
  var seatsVal = document.getElementById('seats').value;
  if(!seatsVal){alert('请选择就餐人数');return;}
  // 自动匹配到对应桌型容量提交（后端按桌型排队显示）
  var seats = matchSeatType(parseInt(seatsVal));
  // 生成唯一虚拟号（隐藏手机号，后端接口 phone 必填）
  vphone = '1' + String(Date.now()).slice(-10);
  var win = document.getElementById('windowGroup').style.display !== 'none' ? document.getElementById('windowNo').value : null;
  var url = '/api/tv/'+merchantNo+'/take?phone='+vphone+'&seats='+seats;
  if(win) url += '&windowNo='+win;
  if(openid) url += '&openid='+encodeURIComponent(openid);
  taking = true;
  var btn = document.getElementById('takeBtn');
  btn.disabled = true; btn.textContent = '取号中…';
  apiPost(url).then(function(res){
    if(res.code!==0){
      alert(res.msg||'取号失败');
      taking = false; btn.disabled = false; btn.textContent = '取号';
      return;
    }
    showResult(res.data);
  }).catch(function(e){
    taking = false; btn.disabled = false; btn.textContent = '取号';
    alert('网络异常，请重试');
  });
}

function refresh(){
  if(!vphone) return;
  api('/api/tv/'+merchantNo+'/my?phone='+vphone).then(function(res){
    if(res.code!==0) return;
    showResult(res.data);
  });
}

function showResult(d){
  document.getElementById('stepForm').classList.add('hidden');
  document.getElementById('stepResult').classList.remove('hidden');
  document.getElementById('ticketNo').textContent = d.ticketNo;
  var info = '前面还有 ' + (d.ahead||0) + ' 人';
  if(d.estWaitMin) info += ' · 预计等待约 ' + d.estWaitMin + ' 分钟';
  document.getElementById('ticketInfo').textContent = info;
  // 自动刷新进度
  clearTimeout(window._refreshTimer);
  window._refreshTimer = setInterval(function(){
    if(!vphone) return;
    api('/api/tv/'+merchantNo+'/my?phone='+vphone).then(function(res){
      if(res.code!==0) return;
      var dd = res.data;
      document.getElementById('ticketNo').textContent = dd.ticketNo;
      var info = '前面还有 ' + (dd.ahead||0) + ' 人';
      if(dd.ahead > 0 && cfgEstWait) info += ' · 预计约 ' + (dd.ahead * cfgEstWait) + ' 分钟';
      if(dd.status === 1){
        info = '🎉 已叫到您，请尽快到店';
        document.getElementById('ticketInfo').style.color = '#10b981';
        document.getElementById('ticketInfo').style.fontWeight = '600';
      } else if(dd.status === 2){
        info = '✅ 已完成，感谢您的光临';
        document.getElementById('ticketInfo').style.color = '#10b981';
        document.getElementById('ticketInfo').style.fontWeight = '600';
        clearInterval(window._refreshTimer);
      } else if(dd.status === 3){
        info = '⚠️ 您已过号，请重新取号';
        document.getElementById('ticketInfo').style.color = '#f59e0b';
        document.getElementById('ticketInfo').style.fontWeight = '600';
        clearInterval(window._refreshTimer);
      } else {
        document.getElementById('ticketInfo').style.color = '#64748b';
        document.getElementById('ticketInfo').style.fontWeight = '400';
      }
      document.getElementById('ticketInfo').textContent = info;
    });
  }, 5000);
}
</script>
</body>
</html>
