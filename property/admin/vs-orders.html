<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>增值服务订单 · 物业后台 · 宜必购</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<style>
:root{
  --pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5,#7c3aed);
  --dark:#0f172a;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
  --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--divider:#f1f5f9;
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--sidebar-w:272px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;height:100%;}
a{color:inherit;text-decoration:none;}
input,select,button{font-size:16px;font-family:inherit;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

.layout{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s var(--ease);}
.sidebar .brand{padding:24px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar .brand .logo{width:40px;height:40px;border-radius:var(--r-md);background:var(--pri-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:700;}
.sidebar .brand h1{font-size:16px;font-weight:700;line-height:1.3;color:#fff;}
.sidebar .brand h1 span{font-size:11px;color:rgba(255,255,255,.5);font-weight:400;display:block;margin-top:2px;}
.sidebar nav{flex:1;overflow-y:auto;padding:16px 12px;}
.nav-section{margin-bottom:8px;}
.nav-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);padding:8px 12px 6px;user-select:none;}
.sidebar nav a{height:44px;padding:0 16px;border-radius:10px;font-size:14px;color:rgba(255,255,255,.55);font-weight:500;transition:all .2s;margin-bottom:2px;display:flex;align-items:center;gap:12px;border-left:none;}
.sidebar nav a:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);}
.sidebar nav a.active{color:#fff;background:rgba(79,70,229,.15);font-weight:600;border-left:3px solid #818cf8;border-radius:0 10px 10px 0;}
.sidebar nav a .icon{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
.sidebar .logout-area{padding:12px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar .logout-area a{color:rgba(255,255,255,.5);justify-content:center;border-radius:var(--r-sm);border-left:none;}
.sidebar .logout-area a:hover{background:rgba(239,68,68,.15);color:var(--danger);}

.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(255,255,255,.85);}
.page-header h2{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.2;}
.page-header .sub{font-size:14px;color:var(--text-2);margin-top:6px;}
.topbar .page-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1.2;}
.topbar .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text-2);}
.main{margin-left:var(--sidebar-w);flex:1;padding:32px 40px;max-width:1280px;margin:0 auto;animation:fadeInUp .5s var(--ease) both;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:35;backdrop-filter:blur(2px);}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main{margin-left:0;}
  .topbar .menu-toggle{display:block;}
  .content{padding:16px;}
}

/* Cards */
.card{background:var(--surface);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-card);border:none;}
.sec{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 16px;font-size:15px;color:var(--text);}
.sec .ic{width:30px;height:30px;border-radius:var(--r-sm);background:linear-gradient(135deg,rgba(79,70,229,.1) 0%,rgba(124,58,237,.1) 100%);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 30px;}

/* Inputs */
.input,.select{height:42px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--text);background:var(--surface);transition:border-color .2s var(--ease),box-shadow .2s var(--ease);-webkit-appearance:none;appearance:none;}
.input:focus,.select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.12);}

/* Buttons */

.filter-bar{display:flex;gap:12px;margin-bottom:0;flex-wrap:wrap;align-items:center;}
.filter-bar .select{min-width:160px;}

/* Table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1000px;}
th{text-align:left;padding:12px 16px;background:var(--bg);color:var(--text-2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 16px;border-bottom:1px solid var(--divider);color:var(--text);white-space:nowrap;}
tbody tr:nth-child(even) td{background:rgba(248,250,252,.5);}
tbody tr:hover td{background:rgba(79,70,229,.04);}
tbody tr:last-child td{border-bottom:none;}

/* Badges */
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;}
.badge-blue{background:rgba(79,70,229,.1);color:#4f46e5;}
.badge-purple{background:rgba(124,58,237,.1);color:#7c3aed;}
.badge-success{background:rgba(16,185,129,.1);color:#059669;}
.badge-warning{background:rgba(245,158,11,.1);color:#d97706;}
.badge-danger{background:rgba(239,68,68,.1);color:#dc2626;}
.badge-gray{background:rgba(148,163,184,.12);color:var(--text-2);}

.empty{padding:40px 16px;text-align:center;color:var(--text-3);font-size:14px;}
.action-btns{display:flex;gap:8px;flex-wrap:wrap;}

/* Toast */
.toast-host{position:fixed;top:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.toast{padding:12px 20px;border-radius:var(--r-md);background:var(--dark);color:#fff;font-size:14px;font-weight:500;opacity:0;transform:translateX(40px);transition:opacity .3s var(--ease),transform .3s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.15);pointer-events:auto;}
.toast.show{opacity:1;transform:translateX(0);}
.toast.success{background:linear-gradient(135deg,#10b981 0%,#059669 100%);}
.toast.danger{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);}

/* Modal with backdrop blur */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:28px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:fadeInUp .3s var(--ease);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.row-actions{display:flex;gap:6px;}

/* ===== 窄屏防变形（统一注入）===== */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main,.main-content{margin-left:0 !important;padding:20px 14px !important;min-width:0 !important;max-width:100% !important;}
  .topbar .menu-toggle{display:block !important;}
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0 !important;}
  .topbar{padding:14px 14px;}
  .tabs{min-width:0 !important;}
}
@media(max-width:480px){
  .main{padding:14px 10px !important;}
  .card{padding:16px 12px;}
  .sec{font-size:14px;}
  .page-title{font-size:22px !important;}
}
</style>
</head>
<body>
<div class="toast-host" id="toastHost"></div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">宜</div><h1>宜必购物业<span>Property Management</span></h1></div>
    <nav>
      <div class="nav-section">概览</div>
      <a href="dashboard.html"><span class="icon">📊</span>工作台</a>
      <a href="index.html"><span class="icon">🏠</span>首页看板</a>
      <div class="nav-section">业务管理</div>
      <a href="owners.html"><span class="icon">👥</span>业主管理</a>
      <a href="buildings.html"><span class="icon">🏢</span>楼栋房间</a>
      <a href="bills.html"><span class="icon">🧾</span>账单管理</a>
      <a href="splits.html"><span class="icon">💰</span>分账流水</a>
      <a href="merchant-bindings.html"><span class="icon">🔗</span>商家绑定</a>
      <a href="activity-audit.html"><span class="icon">✅</span>活动审核</a>
      <a href="facilities.html"><span class="icon">🏟️</span>场地预约</a>
      <div class="nav-section">安防通行</div>
      <a href="access.html"><span class="icon">🚪</span>门禁管理</a>
      <a href="vehicles.html"><span class="icon">🚗</span>车辆管理</a>
      <a href="devices.html"><span class="icon">📡</span>IoT设备</a>
    </nav>
    <div class="logout-area"><a href="#" id="logoutBtn"><span class="icon">🚪</span>退出登录</a></div>
  </div>
  <div class="sidebar-overlay" id="overlay"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="page-title">增值服务订单</div>
      <div></div>
    </div>
    <div class="content">
      <div class="card">
        <div class="sec"><span class="ic">🔍</span>筛选条件</div>
        <div class="filter-bar">
          <select class="select" id="companyId"><option value="">全部物业公司</option></select>
          <select class="select" id="filterStatus">
            <option value="">全部状态</option>
            <option value="0">待支付</option>
            <option value="1">已支付</option>
            <option value="2">服务中</option>
            <option value="3">已完成</option>
            <option value="4">已取消</option>
            <option value="5">已退款</option>
          </select>
          <button class="btn-md btn-primary" id="btnFilter">查询</button>
          <button class="btn-sm btn-secondary" id="btnRefresh">刷新</button>
        </div>
      </div>
      <div class="card">
        <div class="sec"><span class="ic">🛎️</span>订单列表</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>订单编号</th><th>服务项目</th><th>业主</th><th>数量</th><th>单价</th><th>总额</th><th>抵扣额</th><th>支付渠道</th><th>状态</th><th>下单时间</th><th>操作</th></tr></thead>
            <tbody id="orderTable"><tr><td colspan="11" class="empty">加载中...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var token = localStorage.getItem('property_admin_token');
  if (!token) { location.href = 'login.html'; return; }

  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');
  document.getElementById('menuToggle').onclick = function(){ sidebar.classList.add('open'); overlay.classList.add('show'); };
  overlay.onclick = function(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); };
  document.getElementById('logoutBtn').onclick = function(e){ e.preventDefault(); localStorage.removeItem('property_admin_token'); location.href = 'login.html'; };

  function showToast(msg, type){
    var host = document.getElementById('toastHost');
    var el = document.createElement('div');
    el.className = 'toast ' + (type||'');
    el.textContent = msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 200); }, 2500);
  }

  var statusMap = { 0:'待支付', 1:'已支付', 2:'服务中', 3:'已完成', 4:'已取消', 5:'已退款' };
  var statusBadgeMap = { 0:'badge-warning', 1:'badge-blue', 2:'badge-warning', 3:'badge-success', 4:'badge-gray', 5:'badge-danger' };

  function statusBadge(s){
    var label = statusMap[s] != null ? statusMap[s] : (s||'--');
    var cls = statusBadgeMap[s] != null ? statusBadgeMap[s] : 'badge-gray';
    return '<span class="badge ' + cls + '">' + label + '</span>';
  }

  function actionButtons(o){
    var s = o.status;
    var btns = '';
    if (s === 1 || s === 2) {
      btns += '<button class="btn-sm btn-success" onclick="doConfirmComplete(' + o.id + ')">确认完成</button>';
    }
    if (s === 1 || s === 2 || s === 3) {
      btns += '<button class="btn-sm btn-danger" onclick="doRefund(' + o.id + ')">退款</button>';
    }
    return btns ? '<div class="action-btns">' + btns + '</div>' : '--';
  }

  function loadOrders(){
    var params = [];
    var cid = document.getElementById('companyId').value;
    var st = document.getElementById('filterStatus').value;
    if (cid) params.push('company_id=' + encodeURIComponent(cid));
    if (st !== '') params.push('status=' + encodeURIComponent(st));
    var url = '/api/property/admin/p1/vs-orders' + (params.length ? '?' + params.join('&') : '');

    fetch(url, { headers: { 'X-Property-Token': token } })
      .then(function(r){ return r.json(); })
      .then(function(res){
        var tbody = document.getElementById('orderTable');
        if (res.code !== 0 || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="11" class="empty">暂无数据</td></tr>';
          return;
        }
        var html = '';
        res.data.forEach(function(o){
          html += '<tr>' +
            '<td>' + (o.order_no || o.id) + '</td>' +
            '<td>' + (o.service_name || '--') + '</td>' +
            '<td>' + (o.owner_name || '--') + '</td>' +
            '<td>' + (o.quantity != null ? o.quantity : '--') + '</td>' +
            '<td>¥' + Number(o.unit_price || 0).toFixed(2) + '</td>' +
            '<td>¥' + Number(o.total_amount || 0).toFixed(2) + '</td>' +
            '<td>¥' + Number(o.deduct_amount || 0).toFixed(2) + '</td>' +
            '<td>' + (o.pay_channel || '--') + '</td>' +
            '<td>' + statusBadge(o.status) + '</td>' +
            '<td>' + (o.created_at || '--') + '</td>' +
            '<td>' + actionButtons(o) + '</td></tr>';
        });
        tbody.innerHTML = html;
      })
      .catch(function(){ document.getElementById('orderTable').innerHTML = '<tr><td colspan="11" class="empty">加载失败</td></tr>'; });
  }

  // Load companies
  fetch('/api/property/admin/companies', { headers: { 'X-Property-Token': token } })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.code === 0 && res.data) {
        var sel = document.getElementById('companyId');
        res.data.forEach(function(c){
          var opt = document.createElement('option');
          opt.value = c.companyId;
          opt.textContent = c.companyName;
          sel.appendChild(opt);
        });
      }
    }).catch(function(){});

  window.doConfirmComplete = function(id){
    if (!confirm('确认该订单已完成？')) return;
    fetch('/api/property/admin/p1/vs-orders/' + id + '/complete', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }).then(function(res){
      if (res.code === 0) { showToast('已确认完成', 'success'); loadOrders(); }
      else showToast(res.msg || '操作失败', 'danger');
    }).catch(function(){ showToast('网络异常', 'danger'); });
  };

  window.doRefund = function(id){
    if (!confirm('确认退款？此操作不可撤销。')) return;
    fetch('/api/property/admin/p1/vs-orders/' + id + '/refund', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }).then(function(res){
      if (res.code === 0) { showToast('退款成功', 'success'); loadOrders(); }
      else showToast(res.msg || '退款失败', 'danger');
    }).catch(function(){ showToast('网络异常', 'danger'); });
  };

  document.getElementById('btnFilter').onclick = loadOrders;
  document.getElementById('btnRefresh').onclick = function(){
    document.getElementById('companyId').value = '';
    document.getElementById('filterStatus').value = '';
    loadOrders();
  };
  loadOrders();
})();
</script>
</body>
</html>
