<style>
/* ===== V3 设计系统（_redesign_v3/tokens.css 后台基底，就地内联） ===== */
:root{--bg:#f6f7f9;--surface:#ffffff;--surface-2:#fbfcfd;--ink:#0f1728;--ink-2:#475467;--ink-3:#98a2b3;
--line:#ebedf0;--line-2:#e4e7ec;
--brand:#0e7a6b;--brand-deep:#0a5f54;--brand-soft:#e9f5f2;--brand-softer:#f3faf8;
--success:#079455;--success-soft:#e8f7ef;--danger:#d92d20;--danger-soft:#fdeceb;
--info:#2e90fa;--info-soft:#eaf3ff;--violet:#5b5bd6;--violet-soft:#eeeefb;
--pop-coral:#ff6b5e;--pop-coral-soft:#ffe9e6;--pop-sun:#ffc53d;--pop-sun-soft:#fff6df;
--pop-mint:#36c2a0;--pop-mint-soft:#e2f8f1;--pop-violet:#8b7bf7;--pop-violet-soft:#efecfe;
--sh-1:0 1px 2px rgba(16,24,40,.04);--sh-2:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
--r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:22px;--r-pill:999px;
--font:"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
--ease:cubic-bezier(.2,.7,.3,1);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

/* ===== 布局骨架（.desk / .side / .main，与 V3 后台稿同源） ===== */
.desk{display:flex;min-height:100vh;}
.side{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--line);
padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;
display:flex;flex-direction:column;z-index:40;transition:transform .25s var(--ease);}
.side .brand{display:flex;align-items:center;gap:9px;padding:0 8px 18px;}
.side .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;
font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
.side .brand .nm{font-size:14.5px;font-weight:650;letter-spacing:-.1px;}
.side nav{flex:1;}
.side .group{font-size:11px;font-weight:600;color:var(--ink-3);padding:14px 10px 6px;letter-spacing:.4px;}
.side nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:2px;
border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;font-weight:500;transition:background .15s var(--ease);}
.side nav a svg{width:17px;height:17px;stroke-width:1.7;color:var(--ink-3);flex:none;}
.side nav a:hover{background:var(--surface-2);}
.side nav a.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600;}
.side nav a.on svg{color:var(--brand);}
.side .logout-area{padding:10px 8px 0;border-top:1px solid var(--line);margin-top:10px;}
.side .logout-area a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);
color:var(--danger);font-size:13.5px;font-weight:500;}
.side .logout-area a svg{width:17px;height:17px;stroke-width:1.7;flex:none;}
.side .logout-area a:hover{background:var(--danger-soft);}

.main{flex:1;min-width:0;padding:22px 28px 40px;max-width:1280px;margin:0 auto;width:100%;animation:fadeInUp .4s var(--ease);}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;}
.topbar .crumb{font-size:12.5px;color:var(--ink-3);}
.topbar h1{font-size:21px;font-weight:650;letter-spacing:-.2px;margin-top:2px;}
.topbar .tools{display:flex;align-items:center;gap:10px;}
.topbar .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--ink-2);}
.avatar-sm{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);
display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:none;}

/* ===== KPI（V3 .kpis/.kpi，保留线上 4 个数据挂点） ===== */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px;}
@media(min-width:768px){.kpis{grid-template-columns:repeat(4,1fr);}}
.kpi{background:var(--surface);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-1);border:1px solid var(--line);}
.kpi .lab{font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px;}
.kpi .lab .ic{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
.kpi .val{font-size:25px;font-weight:650;letter-spacing:-.5px;margin-top:6px;}
.ic-brand{background:var(--brand-soft);color:var(--brand);}
.ic-coral{background:var(--pop-coral-soft);color:var(--pop-coral);}
.ic-sun{background:var(--pop-sun-soft);color:#c08a16;}
.ic-mint{background:var(--pop-mint-soft);color:var(--pop-mint);}

/* ===== 卡片 / 快捷入口 ===== */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:18px;margin-bottom:14px;}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-h .t{font-size:15px;font-weight:600;}
.qlinks{display:flex;gap:10px;flex-wrap:wrap;}
.qlink{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:var(--r-md);
background:var(--brand-soft);color:var(--brand-deep);font-size:13.5px;font-weight:600;transition:all .18s var(--ease);}
.qlink:hover{background:var(--brand);color:#fff;transform:translateY(-1px);}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(16,24,40,.5);backdrop-filter:blur(4px);z-index:35;}

/* ===== 窄屏（保留线上抽屉交互：IDs 不变） ===== */
@media(max-width:900px){
  .side{position:fixed;top:0;left:0;transform:translateX(-100%);}
  .side.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main{padding:20px 14px 32px;}
  .topbar .menu-toggle{display:block;}
}
@media(max-width:480px){
  .main{padding:14px 10px 28px;}
  .kpi{padding:14px;}
  .kpi .val{font-size:22px;}
  .card{padding:14px 12px;}
}
</style>
</head>

<script>
(function(){
  var token = localStorage.getItem('property_admin_token');
  if (!token) { location.href = 'login.html'; return; }
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');
  var toggle = document.getElementById('menuToggle');
  function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  toggle.onclick = openSidebar;
  overlay.onclick = closeSidebar;
  document.getElementById('logoutBtn').onclick = function(e){
    e.preventDefault();
    localStorage.removeItem('property_admin_token');
    location.href = 'login.html';
  };
  fetch('/api/property/admin/dashboard', { headers: { 'X-Property-Token': token } })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.code !== 0) { location.href = 'login.html'; return; }
      var d = res.data || {};
      document.getElementById('dashSettle').textContent = d.todaySplitAmount != null ? '¥' + Number(d.todaySplitAmount).toFixed(2) : '--';
      document.getElementById('dashDeduct').textContent = d.todayDeductAmount != null ? '¥' + Number(d.todayDeductAmount).toFixed(2) : '--';
      document.getElementById('dashPending').textContent = d.pendingAudits != null ? d.pendingAudits : '--';
      document.getElementById('dashOwners').textContent = d.totalOwners != null ? d.totalOwners : '--';
    })
    .catch(function(){ /* keep -- placeholders */ });
})();
</script>
