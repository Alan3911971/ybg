<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>巡检管理 · 物业后台 · 宜必购</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<style>
:root{
  --pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5,#7c3aed);--success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --dark:#0f172a;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
  --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--divider:#f1f5f9;
  --shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--sidebar-w:272px;--ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;height:100%;}
a{color:inherit;text-decoration:none;}
input,select,button{font-size:16px;font-family:inherit;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}

.layout{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s var(--ease);}
.sidebar .brand{padding:24px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar .brand .logo{width:40px;height:40px;border-radius:var(--r-md);background:var(--pri-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:700;}
.sidebar .brand h1{font-size:16px;font-weight:700;line-height:1.3;color:#fff;}
.sidebar .brand h1 span{font-size:11px;color:rgba(255,255,255,.5);font-weight:400;display:block;margin-top:2px;}
.sidebar nav{flex:1;overflow-y:auto;padding:16px 12px;}
.sidebar .nav-section{margin-bottom:8px;}
.sidebar .nav-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.3);padding:8px 12px 6px;user-select:none;}
.sidebar nav a{height:44px;padding:0 16px;border-radius:10px;font-size:14px;color:rgba(255,255,255,.55);font-weight:500;transition:all .2s;margin-bottom:2px;display:flex;align-items:center;gap:12px;border-left:none;}
.sidebar nav a:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);}
.sidebar nav a.active{color:#fff;background:rgba(79,70,229,.15);font-weight:600;border-left:3px solid #818cf8;border-radius:0 10px 10px 0;}
.sidebar nav a .icon{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
.sidebar .logout-area{padding:12px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar .logout-area a{color:rgba(255,255,255,.5);justify-content:center;border-radius:var(--r-sm);}
.sidebar .logout-area a:hover{background:rgba(239,68,68,.15);color:var(--danger);}

.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(255,255,255,.85);}
.page-header h2{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.2;}
.page-header .sub{font-size:14px;color:var(--text-2);margin-top:6px;}
.topbar .page-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1.2;}
.topbar .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text-2);}
.main{margin-left:var(--sidebar-w);flex:1;padding:32px 40px;max-width:1200px;margin:0 auto;animation:fadeInUp .5s var(--ease) both;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:35;backdrop-filter:blur(2px);}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main{margin-left:0;}
  .topbar .menu-toggle{display:block;}
  .content{padding:16px;}
}

.card{background:var(--surface);border-radius:var(--r-lg);padding:24px;margin-bottom:16px;box-shadow:var(--shadow-card);border:none;}
.sec{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 16px;font-size:16px;color:var(--text);}
.sec .ic{width:32px;height:32px;border-radius:var(--r-sm);background:linear-gradient(135deg,rgba(79,70,229,.1) 0%,rgba(124,58,237,.1) 100%);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 32px;}

.input,.select{height:44px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--text);background:var(--surface);transition:border-color .2s var(--ease),box-shadow .2s var(--ease);-webkit-appearance:none;appearance:none;}
.input:focus,.select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.12);}

.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-bar .select{min-width:150px;}
.filter-bar .input{min-width:140px;}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md);border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:750px;}
th{text-align:left;padding:14px 16px;background:var(--bg);color:var(--text-2);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.8px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:14px 16px;border-bottom:1px solid var(--divider);color:var(--text);white-space:nowrap;}
tbody tr:nth-child(even){background:rgba(248,250,252,.5);}
tbody tr:hover td{background:rgba(79,70,229,.04);}

.badge-blue{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px;background:rgba(79,70,229,.1);color:var(--pri);}
.badge-purple{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px;background:rgba(124,58,237,.1);color:#7c3aed;}
.badge-success{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px;background:rgba(16,185,129,.1);color:#059669;}
.badge-warning{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px;background:rgba(245,158,11,.1);color:#d97706;}
.badge-danger{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px;background:rgba(239,68,68,.1);color:#dc2626;}
.empty{padding:32px 16px;text-align:center;color:var(--text-3);font-size:14px;}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;}
.tab-btn{padding:12px 24px;font-size:14px;font-weight:600;color:var(--text-2);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .2s var(--ease),border-color .2s var(--ease);}
.tab-btn:hover{color:var(--pri);}
.tab-btn.active{color:var(--pri);border-bottom-color:var(--pri);}
.tab-panel{display:none;}
.tab-panel.active{display:block;animation:fadeInUp .35s var(--ease) both;}

/* Toggle switch */
.toggle{position:relative;display:inline-block;width:44px;height:24px;vertical-align:middle;}
.toggle input{opacity:0;width:0;height:0;}
.toggle .slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:24px;transition:.25s var(--ease);}
.toggle .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.toggle input:checked + .slider{background:var(--success);}
.toggle input:checked + .slider:before{transform:translateX(20px);}

/* Stat cards */
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:24px;}
@media(min-width:768px){.stat-row{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--surface);border:none;border-radius:var(--r-lg);padding:24px;text-align:center;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--pri-grad);}
.stat-card .num{font-size:32px;font-weight:800;color:var(--pri);margin-bottom:8px;letter-spacing:-.5px;}
.stat-card .lab{font-size:13px;color:var(--text-3);font-weight:500;}
.stat-card.accent::before{background:linear-gradient(135deg,#06b6d4 0%,#0891b2 100%);}
.stat-card.accent .num{color:#0891b2;}
.stat-card.success::before{background:linear-gradient(135deg,#10b981 0%,#059669 100%);}
.stat-card.success .num{color:#059669;}
.stat-card.warning::before{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);}
.stat-card.warning .num{color:#d97706;}

/* Modal */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-mask.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:28px;width:90%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:modalIn .3s var(--ease) both;}
.modal h3{font-size:18px;font-weight:700;margin-bottom:20px;color:var(--text);}
.modal .form-group{margin-bottom:16px;}
.modal label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
.modal .input,.modal .select{width:100%;}
.modal .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}

.toast-host{position:fixed;top:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{padding:12px 20px;border-radius:var(--r-md);background:var(--dark);color:#fff;font-size:14px;font-weight:500;opacity:0;transform:translateX(40px);transition:opacity .25s var(--ease),transform .25s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.15);pointer-events:auto;}
.toast.show{opacity:1;transform:translateX(0);}
.toast.success{background:linear-gradient(135deg,#10b981 0%,#059669 100%);}
.toast.danger{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.row-actions{display:flex;gap:6px;}

/* ===== 窄屏防变形（统一注入）===== */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main,.main-content{margin-left:0 !important;padding:20px 14px !important;min-width:0 !important;max-width:100% !important;}
  .topbar .menu-toggle{display:block !important;}
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0 !important;}
  .topbar{padding:14px 14px;}
  .tabs{min-width:0 !important;}
}
@media(max-width:480px){
  .main{padding:14px 10px !important;}
  .card{padding:16px 12px;}
  .sec{font-size:14px;}
  .page-title{font-size:22px !important;}
}
</style>
</head>
<body>
<div class="toast-host" id="toastHost"></div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">宜</div><h1>宜必购物业<span>智慧物业管理平台</span></h1></div>
    <nav>
      <div class="nav-section">概览</div>
      <a href="dashboard.html"><span class="icon">📊</span>工作台</a>
      <a href="index.html"><span class="icon">🏠</span>首页看板</a>
      <div class="nav-section">业务管理</div>
      <a href="owners.html"><span class="icon">👥</span>业主管理</a>
      <a href="buildings.html"><span class="icon">🏢</span>楼栋房间</a>
      <a href="bills.html"><span class="icon">🧾</span>账单管理</a>
      <a href="splits.html"><span class="icon">💰</span>分账流水</a>
      <a href="merchant-bindings.html"><span class="icon">🔗</span>商家绑定</a>
      <a href="activity-audit.html"><span class="icon">✅</span>活动审核</a>
      <a href="facilities.html"><span class="icon">🏟️</span>场地预约</a>
      <div class="nav-section">安防通行</div>
      <a href="access.html"><span class="icon">🚪</span>门禁管理</a>
      <a href="vehicles.html"><span class="icon">🚗</span>车辆管理</a>
      <a href="devices.html"><span class="icon">📡</span>IoT设备</a>
    </nav>
    <div class="logout-area"><a href="#" id="logoutBtn"><span class="icon">🚪</span>退出登录</a></div>
  </div>
  <div class="sidebar-overlay" id="overlay"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="page-title">巡检管理</div>
      <div></div>
    </div>
    <div class="content">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="plans">巡检计划</button>
        <button class="tab-btn" data-tab="records">巡检记录</button>
        <button class="tab-btn" data-tab="stats">统计看板</button>
      </div>

      <!-- Plans Tab -->
      <div class="tab-panel active" id="tab-plans">
        <div class="card">
          <div class="sec"><span class="ic">📅</span>巡检计划<span style="flex:1;"></span><button class="btn-sm btn-primary" id="btnNewPlan">新建计划</button></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>计划名称</th><th>频次</th><th>执行时间</th><th>执行人</th><th>状态</th></tr></thead>
              <tbody id="planTable"><tr><td colspan="5" class="empty">加载中...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Records Tab -->
      <div class="tab-panel" id="tab-records">
        <div class="card">
          <div class="sec"><span class="ic">📝</span>巡检记录</div>
          <div class="filter-bar">
            <input class="input" type="date" id="recDateStart">
            <span style="color:var(--text-3);line-height:44px;">至</span>
            <input class="input" type="date" id="recDateEnd">
            <button class="btn-md btn-primary" id="btnRecFilter">查询</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>巡检日期</th><th>巡检人</th><th>巡检点</th><th>结果</th><th>异常描述</th><th>关联工单</th></tr></thead>
              <tbody id="recTable"><tr><td colspan="6" class="empty">加载中...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Stats Tab -->
      <div class="tab-panel" id="tab-stats">
        <div class="stat-row">
          <div class="stat-card"><div class="num" id="statTotal">--</div><div class="lab">总计划数</div></div>
          <div class="stat-card accent"><div class="num" id="statTodayDone">--</div><div class="lab">今日完成</div></div>
          <div class="stat-card warning"><div class="num" id="statTodayAbnormal">--</div><div class="lab">今日异常</div></div>
          <div class="stat-card success"><div class="num" id="statRate">--</div><div class="lab">完成率</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New Plan Modal -->
<div class="modal-mask" id="planModal">
  <div class="modal">
    <h3>新建巡检计划</h3>
    <div class="form-group">
      <label>计划名称</label>
      <input class="input" id="planName" placeholder="请输入计划名称">
    </div>
    <div class="form-group">
      <label>频次</label>
      <select class="select" id="planFreq">
        <option value="daily">每日</option>
        <option value="weekly">每周</option>
        <option value="monthly">每月</option>
      </select>
    </div>
    <div class="form-group">
      <label>执行时间</label>
      <input class="input" id="planTime" type="time">
    </div>
    <div class="form-group">
      <label>执行人</label>
      <input class="input" id="planExecutor" placeholder="请输入执行人">
    </div>
    <div class="modal-footer">
      <button class="btn-md btn-secondary" id="btnCancelPlan">取消</button>
      <button class="btn-md btn-primary" id="btnSavePlan">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  var token = localStorage.getItem('property_admin_token');
  if (!token) { location.href = 'login.html'; return; }

  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');
  document.getElementById('menuToggle').onclick = function(){ sidebar.classList.add('open'); overlay.classList.add('show'); };
  overlay.onclick = function(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); };
  document.getElementById('logoutBtn').onclick = function(e){ e.preventDefault(); localStorage.removeItem('property_admin_token'); location.href = 'login.html'; };

  function showToast(msg, type){
    var host = document.getElementById('toastHost');
    var el = document.createElement('div');
    el.className = 'toast ' + (type||'');
    el.textContent = msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 200); }, 2500);
  }

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.onclick = function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
      this.classList.add('active');
      document.getElementById('tab-' + this.getAttribute('data-tab')).classList.add('active');
      if (this.getAttribute('data-tab') === 'stats') loadStats();
    };
  });

  // Load plans
  function loadPlans(){
    fetch('/api/property/admin/p1/inspection/plans', { headers: { 'X-Property-Token': token } })
      .then(function(r){ return r.json(); })
      .then(function(res){
        var tbody = document.getElementById('planTable');
        if (res.code !== 0 || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无数据</td></tr>';
          return;
        }
        var html = '';
        res.data.forEach(function(p){
          var isActive = p.status === 1 || p.status === 'active';
          html += '<tr>' +
            '<td>' + (p.name || '--') + '</td>' +
            '<td>' + ({daily:'每日',weekly:'每周',monthly:'每月'}[p.frequency] || p.frequency || '--') + '</td>' +
            '<td>' + (p.exec_time || '--') + '</td>' +
            '<td>' + (p.executor || '--') + '</td>' +
            '<td><label class="toggle"><input type="checkbox" data-id="' + p.id + '"' + (isActive ? ' checked' : '') + '><span class="slider"></span></label></td></tr>';
        });
        tbody.innerHTML = html;
        tbody.querySelectorAll('.toggle input').forEach(function(inp){
          inp.onchange = function(){
            var id = this.getAttribute('data-id');
            var newStatus = this.checked ? 1 : 0;
            this.disabled = true;
            fetch('/api/property/admin/p1/inspection/plans/' + id + '/status', {
              method: 'PUT',
              headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: newStatus })
            }).then(function(r){ return r.json(); }).then(function(res){
              if (res.code === 0) showToast(newStatus ? '已启用' : '已停用', 'success');
              else { showToast(res.msg || '操作失败', 'danger'); inp.checked = !inp.checked; }
            }).catch(function(){ showToast('网络异常', 'danger'); inp.checked = !inp.checked; })
            .finally(function(){ inp.disabled = false; });
          };
        });
      })
      .catch(function(){ document.getElementById('planTable').innerHTML = '<tr><td colspan="5" class="empty">加载失败</td></tr>'; });
  }

  // Load records
  function loadRecords(){
    var params = [];
    var ds = document.getElementById('recDateStart').value;
    var de = document.getElementById('recDateEnd').value;
    if (ds) params.push('start_date=' + encodeURIComponent(ds));
    if (de) params.push('end_date=' + encodeURIComponent(de));
    var url = '/api/property/admin/p1/inspection/records' + (params.length ? '?' + params.join('&') : '');
    fetch(url, { headers: { 'X-Property-Token': token } })
      .then(function(r){ return r.json(); })
      .then(function(res){
        var tbody = document.getElementById('recTable');
        if (res.code !== 0 || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
          return;
        }
        var html = '';
        res.data.forEach(function(r){
          var resultBadge = r.result === 'normal' ? '<span class="badge-success">正常</span>' : '<span class="badge-danger">异常</span>';
          var woLink = r.workorder_id ? '<a href="workorders.html" style="color:var(--pri);text-decoration:underline;">#' + r.workorder_id + '</a>' : '--';
          html += '<tr>' +
            '<td>' + (r.inspect_date || '--') + '</td>' +
            '<td>' + (r.inspector || '--') + '</td>' +
            '<td>' + (r.point || '--') + '</td>' +
            '<td>' + resultBadge + '</td>' +
            '<td>' + (r.abnormal_desc || '--') + '</td>' +
            '<td>' + woLink + '</td></tr>';
        });
        tbody.innerHTML = html;
      })
      .catch(function(){ document.getElementById('recTable').innerHTML = '<tr><td colspan="6" class="empty">加载失败</td></tr>'; });
  }

  // Load stats
  function loadStats(){
    fetch('/api/property/admin/p1/inspection/stats', { headers: { 'X-Property-Token': token } })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (res.code !== 0) return;
        var d = res.data || {};
        document.getElementById('statTotal').textContent = d.total_plans != null ? d.total_plans : '--';
        document.getElementById('statTodayDone').textContent = d.today_completed != null ? d.today_completed : '--';
        document.getElementById('statTodayAbnormal').textContent = d.today_abnormal != null ? d.today_abnormal : '--';
        document.getElementById('statRate').textContent = d.completion_rate != null ? d.completion_rate + '%' : '--';
      })
      .catch(function(){});
  }

  // Modal
  var modal = document.getElementById('planModal');
  document.getElementById('btnNewPlan').onclick = function(){ modal.classList.add('show'); };
  document.getElementById('btnCancelPlan').onclick = function(){ modal.classList.remove('show'); };
  modal.onclick = function(e){ if (e.target === modal) modal.classList.remove('show'); };

  document.getElementById('btnSavePlan').onclick = function(){
    var name = document.getElementById('planName').value.trim();
    if (!name) { showToast('请输入计划名称', 'danger'); return; }
    fetch('/api/property/admin/p1/inspection/plans', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: name,
        frequency: document.getElementById('planFreq').value,
        exec_time: document.getElementById('planTime').value,
        executor: document.getElementById('planExecutor').value.trim()
      })
    }).then(function(r){ return r.json(); }).then(function(res){
      if (res.code === 0) { showToast('创建成功', 'success'); modal.classList.remove('show'); loadPlans(); }
      else showToast(res.msg || '创建失败', 'danger');
    }).catch(function(){ showToast('网络异常', 'danger'); });
  };

  document.getElementById('btnRecFilter').onclick = loadRecords;
  loadPlans();
  loadRecords();
})();
</script>
</body>
</html>
