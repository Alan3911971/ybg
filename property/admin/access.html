<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>门禁管理 · 物业后台 · 宜必购物业</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --pri:#4f46e5; --pri-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
    --success:#10b981; --danger:#ef4444; --warning:#f59e0b;
    --dark:#0f172a; --text:#1e293b; --text-2:#64748b; --text-3:#94a3b8;
    --bg:#f8fafc; --surface:#ffffff; --border:#e2e8f0; --divider:#f1f5f9;
    --shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --sidebar-w:272px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;height:100%;}
  a{color:inherit;text-decoration:none;}
  input,select,button{font-size:16px;font-family:inherit;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

  .layout{display:flex;min-height:100vh;}
  .sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .25s ease;}
  .sidebar .brand{padding:24px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar .brand .logo{width:40px;height:40px;border-radius:var(--r-md);background:var(--pri-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:700;}
  .sidebar .brand h1{font-size:16px;font-weight:700;line-height:1.3;color:#fff;}
  .sidebar .brand h1 span{font-size:11px;color:rgba(255,255,255,.5);font-weight:400;display:block;margin-top:2px;}
  .sidebar nav{flex:1;overflow-y:auto;padding:16px 12px;}
  .nav-section{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.35);padding:16px 12px 6px;margin-top:4px;}
  .nav-section:first-child{margin-top:0;padding-top:8px;}
  .sidebar nav a{height:44px;padding:0 16px;border-radius:10px;font-size:14px;color:rgba(255,255,255,.55);font-weight:500;transition:all .2s;margin-bottom:2px;display:flex;align-items:center;gap:12px;border-left:none;}
  .sidebar nav a:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);}
  .sidebar nav a.active{color:#fff;background:rgba(79,70,229,.15);font-weight:600;border-left:3px solid #818cf8;border-radius:0 10px 10px 0;}
  .sidebar nav a .icon{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
  .sidebar .logout-area{padding:16px 12px;border-top:1px solid rgba(255,255,255,.08);}
  .sidebar .logout-area a{color:rgba(255,255,255,.5);justify-content:center;border-radius:var(--r-sm);padding:11px 14px;border-left:none;}
  .sidebar .logout-area a:hover{color:var(--danger);background:rgba(239,68,68,.1);}

  .main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(255,255,255,.85);}
  .page-header h2{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.2;}
.page-header .sub{font-size:14px;color:var(--text-2);margin-top:6px;}
.topbar .page-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1.2;}
  .topbar .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text-2);}
  .main{margin-left:var(--sidebar-w);flex:1;padding:32px 40px;max-width:1200px;margin:0 auto;animation:fadeInUp .5s ease both;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:35;backdrop-filter:blur(2px);}

  @media(max-width:768px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay.show{display:block;}
    .main{margin-left:0;}
    .topbar .menu-toggle{display:block;}
  }

  .card{background:var(--surface);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-card);border:none;}
  .sec{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 16px;font-size:15px;color:var(--text);}
  .sec .ic{width:32px;height:32px;border-radius:var(--r-sm);background:linear-gradient(135deg,rgba(79,70,229,.1) 0%,rgba(124,58,237,.1) 100%);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 32px;}

  .input,.select{height:44px;padding:0 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;color:var(--text);background:#fff;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none;}
  .input:focus,.select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
            
  .filter-bar{display:flex;gap:12px;margin-bottom:0;flex-wrap:wrap;align-items:center;}
  .filter-bar .select{min-width:160px;}
  .filter-bar .input{min-width:150px;}

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;}
  th{text-align:left;padding:12px 16px;background:var(--bg);color:var(--text-2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:12px 16px;border-bottom:1px solid var(--divider);color:var(--text);white-space:nowrap;}
  tr:nth-child(even) td{background:var(--bg);}
  tr:hover td{background:rgba(79,70,229,.04);}
  .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;}
  .badge.green{background:rgba(16,185,129,.1);color:#059669;}
  .badge.blue{background:rgba(79,70,229,.08);color:#4f46e5;}
  .badge.orange{background:rgba(245,158,11,.1);color:#d97706;}
  .empty{padding:32px 16px;text-align:center;color:var(--text-3);font-size:13px;}

  .toast-host{position:fixed;top:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
  .toast{padding:12px 20px;border-radius:var(--r-sm);background:var(--dark);color:#fff;font-size:14px;font-weight:500;opacity:0;transform:translateX(40px);transition:opacity .25s ease,transform .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.15);}
  .toast.show{opacity:1;transform:translateX(0);}
  .toast.success{background:var(--success);} .toast.danger{background:var(--danger);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.row-actions{display:flex;gap:6px;}

/* ===== 窄屏防变形（统一注入）===== */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main,.main-content{margin-left:0 !important;padding:20px 14px !important;min-width:0 !important;max-width:100% !important;}
  .topbar .menu-toggle{display:block !important;}
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0 !important;}
  .topbar{padding:14px 14px;}
  .tabs{min-width:0 !important;}
}
@media(max-width:480px){
  .main{padding:14px 10px !important;}
  .card{padding:16px 12px;}
  .sec{font-size:14px;}
  .page-title{font-size:22px !important;}
}
</style>
</head>
<body>
<div class="toast-host" id="toastHost"></div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">🏢</div><h1>宜必购物业<span>Property Admin</span></h1></div>
    <nav>
      <div class="nav-section">概览</div>
      <a href="dashboard.html"><span class="icon">📊</span>工作台</a>
      <a href="index.html"><span class="icon">🏠</span>首页看板</a>
      <div class="nav-section">业务管理</div>
      <a href="owners.html"><span class="icon">👥</span>业主管理</a>
      <a href="buildings.html"><span class="icon">🏢</span>楼栋房间</a>
      <a href="bills.html"><span class="icon">🧾</span>账单管理</a>
      <a href="splits.html"><span class="icon">💰</span>分账流水</a>
      <a href="merchant-bindings.html"><span class="icon">🔗</span>商家绑定</a>
      <a href="activity-audit.html"><span class="icon">✅</span>活动审核</a>
      <a href="facilities.html"><span class="icon">🏟️</span>场地预约</a>
      <div class="nav-section">安防通行</div>
      <a href="access.html" class="active"><span class="icon">🚪</span>门禁管理</a>
      <a href="vehicles.html"><span class="icon">🚗</span>车辆管理</a>
      <a href="devices.html"><span class="icon">📡</span>IoT设备</a>
    </nav>
    <div class="logout-area"><a href="#" id="logoutBtn"><span class="icon">🚪</span>退出登录</a></div>
  </div>
  <div class="sidebar-overlay" id="overlay"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="page-title">门禁管理</div>
      <div></div>
    </div>
    <div class="content">
      <div class="card">
        <div class="sec"><span class="ic">🔍</span>筛选条件</div>
        <div class="filter-bar">
          <input class="input" type="date" id="dateFrom" title="开始日期">
          <span style="color:var(--text-3);line-height:44px;">至</span>
          <input class="input" type="date" id="dateTo" title="结束日期">
          <select class="select" id="communitySel"><option value="">全部小区</option></select>
          <button class="btn-md btn-primary" id="btnFilter">查询</button>
          <button class="btn-sm btn-primary" id="btnRefresh">刷新</button>
        </div>
      </div>
      <div class="card">
        <div class="sec"><span class="ic">🚪</span>通行记录<span style="flex:1;"></span><button class="btn-sm btn-success" id="btnRemoteOpen">远程开门</button></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>通行时间</th><th>小区</th><th>设备</th><th>方式</th><th>方向</th><th>手机号</th></tr></thead>
            <tbody id="accessTable"><tr><td colspan="6" class="empty">加载中...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var token = localStorage.getItem('property_admin_token');
  if (!token) { location.href = 'login.html'; return; }

  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');
  document.getElementById('menuToggle').onclick = function(){ sidebar.classList.add('open'); overlay.classList.add('show'); };
  overlay.onclick = function(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); };
  document.getElementById('logoutBtn').onclick = function(e){ e.preventDefault(); localStorage.removeItem('property_admin_token'); location.href = 'login.html'; };

  function showToast(msg, type){
    var host = document.getElementById('toastHost');
    var el = document.createElement('div');
    el.className = 'toast ' + (type||'');
    el.textContent = msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 200); }, 2500);
  }

  function methodBadge(m){
    var map = {
      'qrcode': '<span class="badge blue">二维码</span>',
      'visitor': '<span class="badge orange">访客码</span>',
      'remote': '<span class="badge green">远程</span>'
    };
    return map[m] || '<span class="badge blue">' + (m||'--') + '</span>';
  }

  function dirBadge(d){
    return d === 'in' ? '<span class="badge green">进</span>' : '<span class="badge orange">出</span>';
  }

  function loadLogs(){
    var params = [];
    var from = document.getElementById('dateFrom').value;
    var to = document.getElementById('dateTo').value;
    var comm = document.getElementById('communitySel').value;
    if (from) params.push('date_from=' + encodeURIComponent(from));
    if (to) params.push('date_to=' + encodeURIComponent(to));
    if (comm) params.push('community_id=' + encodeURIComponent(comm));
    var url = '/api/property/admin/access/logs' + (params.length ? '?' + params.join('&') : '');

    fetch(url, { headers: { 'X-Property-Token': token } })
      .then(function(r){ return r.json(); })
      .then(function(res){
        var tbody = document.getElementById('accessTable');
        if (res.code !== 0 || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
          return;
        }
        var html = '';
        res.data.forEach(function(l){
          html += '<tr>' +
            '<td>' + (l.time || '--') + '</td>' +
            '<td>' + (l.community_name || '--') + '</td>' +
            '<td>' + (l.device_name || '--') + '</td>' +
            '<td>' + methodBadge(l.method) + '</td>' +
            '<td>' + dirBadge(l.direction) + '</td>' +
            '<td>' + (l.phone_masked || '--') + '</td></tr>';
        });
        tbody.innerHTML = html;
      })
      .catch(function(){ document.getElementById('accessTable').innerHTML = '<tr><td colspan="6" class="empty">加载失败</td></tr>'; });
  }

  // Load communities
  fetch('/api/property/admin/communities', { headers: { 'X-Property-Token': token } })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.code === 0 && res.data) {
        var sel = document.getElementById('communitySel');
        res.data.forEach(function(c){
          var opt = document.createElement('option');
          opt.value = c.companyId;
          opt.textContent = c.companyName;
          sel.appendChild(opt);
        });
      }
    })
    .catch(function(){});

  // Remote open
  document.getElementById('btnRemoteOpen').onclick = function(){
    if (!confirm('确认执行远程开门？')) return;
    this.disabled = true;
    fetch('/api/property/admin/access/remote-open', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.code === 0) { showToast('远程开门成功', 'success'); }
      else { showToast(res.msg || '操作失败', 'danger'); }
    })
    .catch(function(){ showToast('网络异常', 'danger'); })
    .finally(function(){ document.getElementById('btnRemoteOpen').disabled = false; });
  };

  document.getElementById('btnFilter').onclick = loadLogs;
  document.getElementById('btnRefresh').onclick = function(){
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    document.getElementById('communitySel').value = '';
    loadLogs();
  };
  loadLogs();
})();
</script>
</body>
</html>
