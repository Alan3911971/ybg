<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>工单管理 · 物业后台 · 宜必购物业</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
    --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
    --dark:#0f172a;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
    --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--divider:#f1f5f9;
    --shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
    --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
    --sidebar-w:272px;--ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;height:100%;}
  a{color:inherit;text-decoration:none;}
  input,select,button{font-size:16px;font-family:inherit;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}

  .layout{display:flex;min-height:100vh;}
  .sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s var(--ease);}
  .sidebar .brand{padding:24px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar .brand .logo{width:42px;height:42px;border-radius:var(--r-md);background:var(--pri-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 4px 12px rgba(79,70,229,.4);}
  .sidebar .brand h1{font-size:16px;font-weight:700;line-height:1.3;color:#fff;}
  .sidebar nav{flex:1;overflow-y:auto;padding:16px 12px;}
  .nav-section{margin-bottom:8px;}
  .nav-section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.35);padding:8px 12px 6px;margin-top:8px;}
  .sidebar nav a{height:44px;padding:0 16px;border-radius:10px;font-size:14px;color:rgba(255,255,255,.55);font-weight:500;transition:all .2s;margin-bottom:2px;display:flex;align-items:center;gap:12px;border-left:none;}
  .sidebar nav a:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);}
  .sidebar nav a.active{color:#fff;background:rgba(79,70,229,.15);font-weight:600;border-left:3px solid #818cf8;border-radius:0 10px 10px 0;}
  .sidebar nav a .icon{font-size:16px;width:24px;text-align:center;flex-shrink:0;}
  .sidebar .logout-area{padding:16px;border-top:1px solid rgba(255,255,255,.08);}
  .sidebar .logout-area a{color:rgba(255,255,255,.5);justify-content:center;border-radius:var(--r-md);padding:10px;}
  .sidebar .logout-area a:hover{background:rgba(239,68,68,.15);color:var(--danger);}

  .main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(255,255,255,.85);}
  .page-header h2{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.2;}
.page-header .sub{font-size:14px;color:var(--text-2);margin-top:6px;}
.topbar .page-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1.2;}
  .topbar .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text-2);}
  .main{margin-left:var(--sidebar-w);flex:1;padding:32px 40px;max-width:1280px;margin:0 auto;animation:fadeInUp .5s var(--ease);}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:35;backdrop-filter:blur(4px);}

  @media(max-width:768px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay.show{display:block;}
    .main{margin-left:0;}
    .topbar .menu-toggle{display:block;}
  }

  .card{background:var(--surface);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-card);border:none;}
  .sec{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 16px;font-size:15px;color:var(--text);}
  .sec .ic{width:32px;height:32px;border-radius:var(--r-sm);background:var(--pri-grad);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 32px;box-shadow:0 2px 8px rgba(79,70,229,.25);}

  .input,.select{height:44px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:14px;color:var(--text);background:var(--surface);transition:border-color .2s var(--ease),box-shadow .2s var(--ease);-webkit-appearance:none;appearance:none;}
  .input:focus,.select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.12);}
    .btn.orange:hover{box-shadow:0 4px 16px rgba(245,158,11,.35);}
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none !important;}

  .filter-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filter-bar .select{min-width:160px;}

  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md);border:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px;}
  th{text-align:left;padding:14px 16px;background:var(--bg);color:var(--text-2);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:14px 16px;border-bottom:1px solid var(--divider);color:var(--text);white-space:nowrap;}
  tr.row-main{cursor:pointer;transition:background .15s var(--ease);}
  tr.row-main:nth-child(4n+1) td{background:var(--surface);}
  tr.row-main:nth-child(4n+3) td{background:var(--bg);}
  tr.row-main:hover td{background:rgba(79,70,229,.06) !important;}
  .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;}
  .badge.green{background:rgba(16,185,129,.12);color:#059669;}
  .badge.yellow{background:rgba(245,158,11,.12);color:#b45309;}
  .badge.red{background:rgba(239,68,68,.12);color:#dc2626;}
  .badge.blue{background:rgba(79,70,229,.1);color:#4f46e5;}
  .badge.orange{background:rgba(245,158,11,.12);color:#b45309;}
  .badge.gray{background:rgba(148,163,184,.12);color:var(--text-2);}
  .badge.purple{background:rgba(124,58,237,.1);color:#7c3aed;}
  .empty{padding:40px 16px;text-align:center;color:var(--text-3);font-size:14px;}

  /* Expand row */
  .expand-row td{padding:0;border-bottom:1px solid var(--divider);}
  .expand-content{padding:20px 24px;background:var(--bg);display:none;border-radius:0 0 var(--r-md) var(--r-md);}
  .expand-content.show{display:block;animation:fadeInUp .3s var(--ease);}
  .expand-section{margin-bottom:14px;}
  .expand-section:last-child{margin-bottom:0;}
  .expand-section h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:8px;}
  .expand-section p{font-size:14px;color:var(--text);line-height:1.7;}
  .img-thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .img-thumbs img{width:72px;height:72px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--border);transition:transform .2s var(--ease);}
  .img-thumbs img:hover{transform:scale(1.05);}
  .timeline{position:relative;padding-left:20px;margin-top:8px;}
  .timeline::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border);border-radius:1px;}
  .timeline-item{position:relative;margin-bottom:12px;font-size:13px;color:var(--text-2);line-height:1.5;}
  .timeline-item:last-child{margin-bottom:0;}
  .timeline-item::before{content:'';position:absolute;left:-17px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri);border:2px solid var(--surface);box-shadow:0 0 0 2px rgba(79,70,229,.2);}
  .timeline-item .time{color:var(--text-3);margin-right:10px;font-size:12px;font-weight:500;}
  .action-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .log-loading{font-size:13px;color:var(--text-3);padding:12px 0;}

  /* Log Modal */
  .modal-mask{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.5);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--surface);border-radius:var(--r-xl);width:100%;max-width:600px;max-height:80vh;overflow-y:auto;padding:28px;box-shadow:0 24px 48px rgba(0,0,0,.12);animation:modalIn .3s var(--ease);}
  .modal .modal-title{font-size:18px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;color:var(--text);}
  .modal .modal-close{font-size:20px;color:var(--text-3);cursor:pointer;padding:6px 10px;background:none;border:none;border-radius:var(--r-sm);transition:all .15s var(--ease);}
  .modal .modal-close:hover{background:var(--bg);color:var(--text);}

  .toast-host{position:fixed;top:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
  .toast{padding:12px 20px;border-radius:var(--r-md);background:var(--dark);color:#fff;font-size:14px;font-weight:500;opacity:0;transform:translateX(40px);transition:opacity .25s var(--ease),transform .25s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.15);}
  .toast.show{opacity:1;transform:translateX(0);}
  .toast.success{background:linear-gradient(135deg,#10b981 0%,#059669 100%);}
  .toast.danger{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.row-actions{display:flex;gap:6px;}

/* ===== 窄屏防变形（统一注入）===== */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main,.main-content{margin-left:0 !important;padding:20px 14px !important;min-width:0 !important;max-width:100% !important;}
  .topbar .menu-toggle{display:block !important;}
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0 !important;}
  .topbar{padding:14px 14px;}
  .tabs{min-width:0 !important;}
}
@media(max-width:480px){
  .main{padding:14px 10px !important;}
  .card{padding:16px 12px;}
  .sec{font-size:14px;}
  .page-title{font-size:22px !important;}
}
</style>
</head>
<body>
<div class="toast-host" id="toastHost"></div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">🏢</div><h1>宜必购物业<br><span style="font-size:11px;color:rgba(255,255,255,.5);font-weight:400;">Property Management</span></h1></div>
    <nav>
      <div class="nav-section">概览</div>
      <a href="dashboard.html"><span class="icon">📊</span>工作台</a>
      <a href="index.html"><span class="icon">🏠</span>首页看板</a>
      <div class="nav-section">业务管理</div>
      <a href="owners.html"><span class="icon">👥</span>业主管理</a>
      <a href="buildings.html"><span class="icon">🏢</span>楼栋房间</a>
      <a href="bills.html"><span class="icon">🧾</span>账单管理</a>
      <a href="splits.html"><span class="icon">💰</span>分账流水</a>
      <a href="merchant-bindings.html"><span class="icon">🔗</span>商家绑定</a>
      <a href="activity-audit.html"><span class="icon">✅</span>活动审核</a>
      <a href="facilities.html"><span class="icon">🏟️</span>场地预约</a>
      <div class="nav-section">安防通行</div>
      <a href="access.html"><span class="icon">🚪</span>门禁管理</a>
      <a href="vehicles.html"><span class="icon">🚗</span>车辆管理</a>
      <a href="devices.html"><span class="icon">📡</span>IoT设备</a>
    </nav>
    <div class="logout-area"><a href="#" id="logoutBtn"><span class="icon">🚪</span>退出登录</a></div>
  </div>
  <div class="sidebar-overlay" id="overlay"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="page-title">工单管理</div>
      <div></div>
    </div>
    <div class="content">
      <div class="card">
        <div class="sec"><span class="ic">🔍</span>筛选条件</div>
        <div class="filter-bar">
          <select class="select" id="filterStatus">
            <option value="">全部状态</option>
            <option value="0">待接单</option>
            <option value="1">处理中</option>
            <option value="2">待验收</option>
            <option value="3">已完成</option>
            <option value="4">已关闭</option>
          </select>
          <select class="select" id="filterType">
            <option value="">全部类型</option>
            <option value="repair">报修</option>
            <option value="complaint">投诉</option>
            <option value="suggestion">建议</option>
            <option value="consult">咨询</option>
          </select>
          <button class="btn-md btn-primary" id="btnFilter">查询</button>
          <button class="btn-sm btn-primary" id="btnRefresh">刷新</button>
        </div>
      </div>
      <div class="card">
        <div class="sec"><span class="ic">📋</span>工单列表</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>工单编号</th><th>类型</th><th>标题</th><th>提交人</th><th>紧急程度</th><th>处理人</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="woTable"><tr><td colspan="9" class="empty">加载中...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Log Modal -->
<div class="modal-mask" id="logModal">
  <div class="modal">
    <div class="modal-title">
      <span>📝 工单日志 <span id="logModalId" style="font-size:12px;color:var(--text-3);font-weight:400;"></span></span>
      <button class="modal-close" id="logModalClose">✕</button>
    </div>
    <div id="logModalContent"><div class="log-loading">加载中...</div></div>
  </div>
</div>

<script>
(function(){
  var token = localStorage.getItem('property_admin_token');
  if (!token) { location.href = 'login.html'; return; }

  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');
  document.getElementById('menuToggle').onclick = function(){ sidebar.classList.add('open'); overlay.classList.add('show'); };
  overlay.onclick = function(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); };
  document.getElementById('logoutBtn').onclick = function(e){ e.preventDefault(); localStorage.removeItem('property_admin_token'); location.href = 'login.html'; };

  function showToast(msg, type){
    var host = document.getElementById('toastHost');
    var el = document.createElement('div');
    el.className = 'toast ' + (type||'');
    el.textContent = msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 200); }, 2500);
  }

  var typeMap = { repair:'报修', complaint:'投诉', suggestion:'建议', consult:'咨询' };
  var typeBadgeMap = { repair:'blue', complaint:'red', suggestion:'purple', consult:'orange' };
  var statusMap = { 0:'待接单', 1:'处理中', 2:'待验收', 3:'已完成', 4:'已关闭' };
  var statusBadgeMap = { 0:'yellow', 1:'blue', 2:'orange', 3:'green', 4:'gray' };
  var urgencyMap = { 0:'普通', 1:'紧急', 2:'非常紧急' };
  var urgencyBadgeMap = { 0:'gray', 1:'orange', 2:'red' };

  var expandedId = null;

  function typeBadge(t){
    var label = typeMap[t] || t || '--';
    var cls = typeBadgeMap[t] || 'gray';
    return '<span class="badge ' + cls + '">' + label + '</span>';
  }
  function statusBadge(s){
    var label = statusMap[s] != null ? statusMap[s] : (s||'--');
    var cls = statusBadgeMap[s] != null ? statusBadgeMap[s] : 'gray';
    return '<span class="badge ' + cls + '">' + label + '</span>';
  }
  function urgencyBadge(u){
    var label = urgencyMap[u] != null ? urgencyMap[u] : (u||'--');
    var cls = urgencyBadgeMap[u] != null ? urgencyBadgeMap[u] : 'gray';
    return '<span class="badge ' + cls + '">' + label + '</span>';
  }

  function actionButtons(wo){
    var s = wo.status;
    var btns = '';
    if (s === 0) {
      btns += '<button class="btn-sm btn-primary" onclick="doAssign(' + wo.id + ')">派单</button>';
    }
    if (s === 1) {
      btns += '<button class="btn-sm btn-warning" onclick="doTransfer(' + wo.id + ')">转派</button>';
      btns += '<button class="btn-sm btn-success" onclick="doComplete(' + wo.id + ')">完工</button>';
    }
    btns += '<button class="btn-sm btn-primary" onclick="viewLogs(' + wo.id + ')">📝日志</button>';
    btns += '<button class="btn-sm btn-danger" onclick="doClose(' + wo.id + ')">关闭</button>';
    return '<div class="action-btns">' + btns + '</div>';
  }

  // Fetch logs from dedicated endpoint
  window.viewLogs = function(id){
    var modal = document.getElementById('logModal');
    var content = document.getElementById('logModalContent');
    document.getElementById('logModalId').textContent = '#' + id;
    content.innerHTML = '<div class="log-loading">加载日志中...</div>';
    modal.classList.add('show');

    fetch('/api/property/admin/p1/workorders/' + id + '/logs', {
      headers: { 'X-Property-Token': token }
    }).then(function(r){ return r.json(); }).then(function(res){
      if (res.code === 0 && res.data && res.data.length) {
        var html = '<div class="timeline">';
        res.data.forEach(function(log){
          html += '<div class="timeline-item"><span class="time">' + (log.time || log.created_at || log.createTime || '') + '</span>' + (log.content || log.action || log.description || '--') + '</div>';
        });
        html += '</div>';
        content.innerHTML = html;
      } else {
        content.innerHTML = '<p style="color:var(--c-text-3);font-size:13px;">暂无操作日志</p>';
      }
    }).catch(function(){
      content.innerHTML = '<p style="color:var(--c-danger);font-size:13px;">加载失败，请重试</p>';
    });
  };

  document.getElementById('logModalClose').onclick = function(){
    document.getElementById('logModal').classList.remove('show');
  };
  document.getElementById('logModal').onclick = function(e){
    if (e.target === this) this.classList.remove('show');
  };

  function loadWorkorders(){
    var params = [];
    var st = document.getElementById('filterStatus').value;
    var tp = document.getElementById('filterType').value;
    if (st !== '') params.push('status=' + encodeURIComponent(st));
    if (tp) params.push('type=' + encodeURIComponent(tp));
    var url = '/api/property/admin/p1/workorders' + (params.length ? '?' + params.join('&') : '');

    fetch(url, { headers: { 'X-Property-Token': token } })
      .then(function(r){ return r.json(); })
      .then(function(res){
        var tbody = document.getElementById('woTable');
        if (res.code !== 0 || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
          return;
        }
        var html = '';
        res.data.forEach(function(wo){
          html += '<tr class="row-main" data-id="' + wo.id + '">' +
            '<td>' + (wo.order_no || wo.id) + '</td>' +
            '<td>' + typeBadge(wo.type) + '</td>' +
            '<td>' + (wo.title || '--') + '</td>' +
            '<td>' + (wo.submitter || '--') + '</td>' +
            '<td>' + urgencyBadge(wo.urgency) + '</td>' +
            '<td>' + (wo.handler || '--') + '</td>' +
            '<td>' + statusBadge(wo.status) + '</td>' +
            '<td>' + (wo.created_at || wo.createTime || '--') + '</td>' +
            '<td>' + actionButtons(wo) + '</td></tr>';
          // Expand row with inline detail
          var imgs = '';
          if (wo.images && wo.images.length) {
            wo.images.forEach(function(img){
              imgs += '<img src="' + img + '" alt="工单图片">';
            });
          }
          html += '<tr class="expand-row" data-expand="' + wo.id + '"><td colspan="9"><div class="expand-content" id="expand-' + wo.id + '">' +
            '<div class="expand-section"><h4>描述</h4><p>' + (wo.description || '无') + '</p></div>' +
            (imgs ? '<div class="expand-section"><h4>图片</h4><div class="img-thumbs">' + imgs + '</div></div>' : '') +
            '<div class="expand-section"><h4>操作日志</h4><p style="color:var(--c-text-3)">点击「📝日志」按钮查看完整日志</p></div>' +
            '</div></td></tr>';
        });
        tbody.innerHTML = html;

        // Bind row click to expand
        tbody.querySelectorAll('.row-main').forEach(function(row){
          row.onclick = function(e){
            if (e.target.closest('.btn')) return;
            var id = this.getAttribute('data-id');
            var content = document.getElementById('expand-' + id);
            if (!content) return;
            if (expandedId === id) {
              content.classList.remove('show');
              expandedId = null;
            } else {
              if (expandedId) {
                var prev = document.getElementById('expand-' + expandedId);
                if (prev) prev.classList.remove('show');
              }
              content.classList.add('show');
              expandedId = id;
            }
          };
        });
      })
      .catch(function(){ document.getElementById('woTable').innerHTML = '<tr><td colspan="9" class="empty">加载失败</td></tr>'; });
  }

  // Actions
  window.doAssign = function(id){
    var handler = prompt('请输入处理人姓名：');
    if (!handler) return;
    fetch('/api/property/admin/p1/workorders/' + id + '/assign', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ handler: handler })
    }).then(function(r){ return r.json(); }).then(function(res){
      if (res.code === 0) { showToast('派单成功', 'success'); loadWorkorders(); }
      else showToast(res.msg || '派单失败', 'danger');
    }).catch(function(){ showToast('网络异常', 'danger'); });
  };

  window.doTransfer = function(id){
    var handler = prompt('请输入新处理人姓名：');
    if (!handler) return;
    fetch('/api/property/admin/p1/workorders/' + id + '/transfer', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ handler: handler })
    }).then(function(r){ return r.json(); }).then(function(res){
      if (res.code === 0) { showToast('转派成功', 'success'); loadWorkorders(); }
      else showToast(res.msg || '转派失败', 'danger');
    }).catch(function(){ showToast('网络异常', 'danger'); });
  };

  window.doComplete = function(id){
    if (!confirm('确认完工？')) return;
    fetch('/api/property/admin/p1/workorders/' + id + '/complete', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }).then(function(res){
      if (res.code === 0) { showToast('完工成功', 'success'); loadWorkorders(); }
      else showToast(res.msg || '操作失败', 'danger');
    }).catch(function(){ showToast('网络异常', 'danger'); });
  };

  window.doClose = function(id){
    if (!confirm('确认关闭此工单？')) return;
    fetch('/api/property/admin/p1/workorders/' + id + '/close', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }).then(function(res){
      if (res.code === 0) { showToast('已关闭', 'success'); loadWorkorders(); }
      else showToast(res.msg || '操作失败', 'danger');
    }).catch(function(){ showToast('网络异常', 'danger'); });
  };

  document.getElementById('btnFilter').onclick = loadWorkorders;
  document.getElementById('btnRefresh').onclick = function(){
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterType').value = '';
    loadWorkorders();
  };
  loadWorkorders();
})();
</script>
</body>
</html>
