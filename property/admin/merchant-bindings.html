<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e7a6b">
<title>商家绑定管理 · 物业后台 · 宜必购</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --pri:#0e7a6b;--pri-grad:linear-gradient(135deg,#0e7a6b,#0d9488);--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--dark:#0f172a;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--divider:#f1f5f9;--shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);--r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:22px;--sidebar-w:272px;--ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;height:100%;}
  a{color:inherit;text-decoration:none;}
  input,select,button{font-size:16px;font-family:inherit;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:none;}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:none;}}

  .layout{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .3s var(--ease);}
  .sidebar .brand{padding:24px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar .brand .logo{width:40px;height:40px;border-radius:var(--r-md);background:var(--pri-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 4px 12px rgba(14,122,107,.4);}
  .sidebar .brand h1{font-size:16px;font-weight:700;line-height:1.3;color:#fff;}
  .sidebar .brand h1 span{font-size:11px;color:rgba(255,255,255,.5);font-weight:400;display:block;margin-top:2px;}
  .sidebar nav{flex:1;overflow-y:auto;padding:16px 12px;}
  .nav-section{margin-bottom:20px;}
  .nav-section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.35);padding:0 12px;margin-bottom:8px;}
  .sidebar nav a{height:44px;padding:0 16px;border-radius:10px;font-size:14px;color:rgba(255,255,255,.55);font-weight:500;transition:all .2s;margin-bottom:2px;display:flex;align-items:center;gap:12px;border-left:none;}
  .sidebar nav a:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.06);}
  .sidebar nav a.active{color:#fff;background:rgba(14,122,107,.15);font-weight:600;border-left:3px solid #14b8a6;border-radius:0 10px 10px 0;}
  .sidebar nav a .icon{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
  .sidebar .logout-area{padding:16px 12px;border-top:1px solid rgba(255,255,255,.08);}
  .sidebar .logout-area a{color:rgba(255,255,255,.5);justify-content:center;border-radius:var(--r-md);}
  .sidebar .logout-area a:hover{background:rgba(239,68,68,.15);color:var(--danger);}

  .main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(255,255,255,.85);}
  .page-header h2{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.2;}
.page-header .sub{font-size:14px;color:var(--text-2);margin-top:6px;}
.topbar .page-title{font-size:28px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1.2;}
  .topbar .menu-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text-2);}
  .main{margin-left:var(--sidebar-w);flex:1;padding:32px 40px;max-width:1280px;margin-right:auto;animation:fadeInUp .5s var(--ease);}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:35;backdrop-filter:blur(2px);}

  @media(max-width:768px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay.show{display:block;}
    .main{margin-left:0;}
    .topbar .menu-toggle{display:block;}
  }

  /* Cards */
  .card{background:var(--surface);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-card);border:none;}
  .sec{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 16px;font-size:16px;color:var(--text);}
  .sec .ic{width:32px;height:32px;border-radius:var(--r-sm);background:linear-gradient(135deg,rgba(14,122,107,.1) 0%,rgba(13,148,136,.1) 100%);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 32px;}

  /* Inputs */
  .input,.select{height:44px;padding:0 14px;border:1px solid var(--border);border-radius:var(--r-md);font-size:14px;color:var(--text);background:var(--surface);transition:all .2s var(--ease);-webkit-appearance:none;appearance:none;}
  .input:focus,.select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(14,122,107,.12);}
  .input::placeholder{color:var(--text-3);}

  /* Buttons */
                  
  /* Filter bar */
  .filter-bar{display:flex;gap:12px;margin-bottom:0;flex-wrap:wrap;align-items:center;}
  .filter-bar .select{min-width:160px;}
  .filter-bar .input{min-width:150px;}

  /* Table */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md);border:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px;}
  th{text-align:left;padding:14px 16px;background:var(--bg);color:var(--text-2);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:14px 16px;border-bottom:1px solid var(--divider);color:var(--text);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even){background:rgba(248,250,252,.5);}
  tbody tr:hover td{background:rgba(14,122,107,.04);}
  .empty{padding:40px 16px;text-align:center;color:var(--text-3);font-size:14px;}

  /* Badges */
  .badge-blue{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;background:rgba(14,122,107,.1);color:#0a5f54;}
  .badge-purple{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;background:rgba(13,148,136,.1);color:#0d9488;}
  .badge-success{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;background:rgba(16,185,129,.1);color:#059669;}
  .badge-warning{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;background:rgba(245,158,11,.1);color:#d97706;}
  .badge-danger{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;background:rgba(239,68,68,.1);color:#dc2626;}
  .badge-gray{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;background:var(--bg);color:var(--text-2);}

  /* Toggle switch */
  .toggle{position:relative;display:inline-block;width:44px;height:24px;vertical-align:middle;}
  .toggle input{opacity:0;width:0;height:0;}
  .toggle .slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:24px;transition:.25s var(--ease);}
  .toggle .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .toggle input:checked+.slider{background:var(--success);}
  .toggle input:checked+.slider:before{transform:translateX(20px);}

  /* Modal */
  .modal-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  .modal-mask.show{display:flex;}
  .modal{background:var(--surface);border-radius:var(--r-xl);padding:32px;width:90%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:modalIn .3s var(--ease);}
  .modal h3{font-size:18px;font-weight:700;margin-bottom:24px;color:var(--text);}
  .modal .form-row{margin-bottom:18px;}
  .modal .form-row label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .modal .form-row .input,.modal .form-row .select{width:100%;}
  .modal .radio-group{display:flex;gap:12px;margin-top:6px;}
  .modal .radio-group label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer;font-weight:500;padding:10px 16px;border:1px solid var(--border);border-radius:var(--r-md);transition:all .2s var(--ease);text-transform:none;letter-spacing:0;}
  .modal .radio-group label:has(input:checked){border-color:var(--pri);background:rgba(14,122,107,.05);color:var(--pri);}
  .modal .radio-group input[type="radio"]{accent-color:var(--pri);width:16px;height:16px;}
  .modal .modal-footer{display:flex;gap:12px;justify-content:flex-end;margin-top:28px;padding-top:20px;border-top:1px solid var(--divider);}

  /* Toast */
  .toast-host{position:fixed;top:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
  .toast{padding:14px 20px;border-radius:var(--r-md);background:var(--dark);color:#fff;font-size:14px;font-weight:500;opacity:0;transform:translateX(40px);transition:all .3s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.15);pointer-events:auto;}
  .toast.show{opacity:1;transform:none;}
  .toast.success{background:var(--success);}
  .toast.danger{background:var(--danger);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#0e7a6b 0%,#0d9488 100%);color:#fff;box-shadow:0 2px 8px rgba(14,122,107,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.row-actions{display:flex;gap:6px;}

/* ===== 窄屏防变形（统一注入）===== */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main,.main-content{margin-left:0 !important;padding:20px 14px !important;min-width:0 !important;max-width:100% !important;}
  .topbar .menu-toggle{display:block !important;}
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0 !important;}
  .topbar{padding:14px 14px;}
  .tabs{min-width:0 !important;}
}
@media(max-width:480px){
  .main{padding:14px 10px !important;}
  .card{padding:16px 12px;}
  .sec{font-size:14px;}
  .page-title{font-size:22px !important;}
}

/* ===== V3 换壳覆盖层（批量注入 2026-10-27）===== */
:root{
  --sidebar-w:220px;
  --font:"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --ink:#0f1728;--ink-2:#475467;--ink-3:#98a2b3;--line:#ebedf0;--line-2:#e4e7ec;
  --brand:#0e7a6b;--brand-deep:#0a5f54;--brand-soft:#e9f5f2;--brand-softer:#f3faf8;
  --sh-1:0 1px 2px rgba(16,24,40,.04);--sh-2:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  --ease:cubic-bezier(.2,.7,.3,1);
  --crumb:'宜必购物业';
}
body{font-family:var(--font);}
/* 侧栏（浅色，V3） */
.sidebar{background:var(--surface);border-right:1px solid var(--line);box-shadow:none;}
.sidebar .brand{padding:18px 8px;display:flex;align-items:center;gap:9px;border-bottom:none;}
.sidebar .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:none;}
.sidebar .brand .nm{font-size:14.5px;font-weight:650;letter-spacing:-.1px;color:var(--ink);}
.sidebar .brand h1{font-size:14.5px;font-weight:650;color:var(--ink);}
.sidebar nav{padding:0;}
.sidebar .group{font-size:11px;font-weight:600;color:var(--ink-3);padding:14px 10px 6px;letter-spacing:.4px;text-transform:none;}
.sidebar nav a{display:flex;align-items:center;gap:10px;height:auto;padding:9px 10px;margin-bottom:2px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;font-weight:500;border-left:none;background:none;text-decoration:none;transition:background .15s var(--ease);}
.sidebar nav a svg{width:17px;height:17px;stroke-width:1.7;color:var(--ink-3);flex:none;}
.sidebar nav a:hover{color:var(--ink);background:var(--surface-2);}
.sidebar nav a.on,.sidebar nav a.active{color:var(--brand-deep);background:var(--brand-soft);font-weight:600;border-left:none;}
.sidebar nav a.on svg,.sidebar nav a.active svg{color:var(--brand);}
.sidebar .logout-area{padding:10px 8px 0;border-top:1px solid var(--line);margin-top:10px;}
.sidebar .logout-area a{display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--danger);font-size:13.5px;font-weight:500;text-decoration:none;}
.sidebar .logout-area a svg{width:17px;height:17px;stroke-width:1.7;flex:none;}
.sidebar .logout-area a:hover{background:var(--danger-soft);}
.sidebar-overlay,.overlay{background:rgba(16,24,40,.5);}
/* 顶栏（透明页头，V3） */
.topbar{background:transparent;border-bottom:none;box-shadow:none;padding:12px 0 18px;}
.topbar > :last-child{margin-left:auto;}
.topbar .page-title,.page-header .page-title{font-size:21px;font-weight:650;letter-spacing:-.2px;line-height:1.25;}
.topbar .page-title::before,.page-header .page-title::before{content:var(--crumb);display:block;font-size:12.5px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-bottom:2px;}
/* KPI 卡（V3：去顶部色条，描边卡） */
.stat-card{border:1px solid var(--line);box-shadow:var(--sh-1);}
.stat-card::before{display:none;}
.stat-card .num{font-size:25px;font-weight:650;}
/* 卡片圆角/阴影走全局 remap 后的 token，无需逐条覆盖 */
/* 修存量 bug：旧 .main 的 margin:0 auto 在宽屏下把内容居中、左半截压进固定侧栏
   （旧版探针实测 margin-left=60.5px）。桌面端强制对齐侧栏；≤900px 仍走旧抽屉规则。 */
@media(min-width:901px){
  .main{margin-left:var(--sidebar-w);margin-right:0;max-width:none;}
}
</style>
</head>

  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="page-title">商家-物业绑定管理</div>
      <div></div>
    </div>
    <div class="content">
      <div class="card">
        <div class="sec"><span class="ic">🔍</span>筛选条件<span style="flex:1;"></span><button class="btn-sm btn-primary" id="btnCreate">＋ 新建绑定</button></div>
        <div class="filter-bar">
          <select class="select" id="companyId"><option value="">全部物业公司</option></select>
          <select class="select" id="splitModeFilter">
            <option value="">全部分账模式</option>
            <option value="1">商家→物业</option>
            <option value="2">平台→物业</option>
          </select>
          <button class="btn-md btn-primary" id="btnFilter">查询</button>
          <button class="btn-sm btn-secondary" id="btnRefresh">刷新</button>
        </div>
      </div>
      <div class="card">
        <div class="sec"><span class="ic">🔗</span>绑定列表</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>商家编号</th><th>物业公司ID</th><th>分账模式</th><th>自定义比例</th><th>状态</th><th>备注</th><th>操作</th></tr></thead>
            <tbody id="bindingTable"><tr><td colspan="7" class="empty">加载中...</td></tr></tbody>
          </table>
        </div>
      </div>

<!-- Create Binding Modal -->
<div class="modal-mask" id="createModal">
  <div class="modal">
    <h3>新建商家-物业绑定</h3>
    <div class="form-row">
      <label>商家编号</label>
      <input class="input" id="formMerchantNo" placeholder="请输入商家编号">
    </div>
    <div class="form-row">
      <label>物业公司ID</label>
      <select class="select" id="formCompanyId"><option value="">请选择物业公司</option></select>
    </div>
    <div class="form-row">
      <label>分账模式</label>
      <div class="radio-group">
        <label><input type="radio" name="formSplitMode" value="1" checked>商家→物业</label>
        <label><input type="radio" name="formSplitMode" value="2">平台→物业</label>
      </div>
    </div>
    <div class="form-row">
      <label>自定义比例（%）</label>
      <input class="input" id="formRatio" type="number" min="0" max="100" step="0.01" placeholder="如 85.5">
    </div>
    <div class="form-row">
      <label>备注</label>
      <input class="input" id="formRemark" placeholder="可选备注">
    </div>
    <div class="modal-footer">
      <button class="btn-md btn-secondary" id="btnCancelCreate">取消</button>
      <button class="btn-md btn-primary" id="btnSubmitCreate">确认创建</button>
    </div>
  </div>
</div>

<script>
(function(){
  var token = localStorage.getItem('property_admin_token');
  if (!token) { location.href = 'login.html'; return; }

  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('overlay');
  document.getElementById('menuToggle').onclick = function(){ sidebar.classList.add('open'); overlay.classList.add('show'); };
  overlay.onclick = function(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); };
  document.getElementById('logoutBtn').onclick = function(e){ e.preventDefault(); localStorage.removeItem('property_admin_token'); location.href = 'login.html'; };

  function showToast(msg, type){
    var host = document.getElementById('toastHost');
    var el = document.createElement('div');
    el.className = 'toast ' + (type||'');
    el.textContent = msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('show'); });
    setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 200); }, 2500);
  }

  function splitModeBadge(mode){
    if (mode === 1 || mode === '1') return '<span class="badge-blue">商家→物业</span>';
    if (mode === 2 || mode === '2') return '<span class="badge-purple">平台→物业</span>';
    return '<span class="badge-gray">' + (mode || '--') + '</span>';
  }

  // Load companies for both filter and modal form
  var companiesData = [];
  fetch('/api/property/admin/companies', { headers: { 'X-Property-Token': token } })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.code === 0 && res.data) {
        companiesData = res.data;
        var selFilter = document.getElementById('companyId');
        var selForm = document.getElementById('formCompanyId');
        res.data.forEach(function(c){
          var opt1 = document.createElement('option');
          opt1.value = c.id;
          opt1.textContent = c.name;
          selFilter.appendChild(opt1);
          var opt2 = document.createElement('option');
          opt2.value = c.id;
          opt2.textContent = c.name;
          selForm.appendChild(opt2);
        });
      }
    })
    .catch(function(){});

  function loadBindings(){
    var params = [];
    var cid = document.getElementById('companyId').value;
    var mode = document.getElementById('splitModeFilter').value;
    if (cid) params.push('company_id=' + encodeURIComponent(cid));
    if (mode) params.push('splitMode=' + encodeURIComponent(mode));
    var url = '/api/property/admin/p1/merchant-bindings' + (params.length ? '?' + params.join('&') : '');

    fetch(url, { headers: { 'X-Property-Token': token } })
      .then(function(r){ return r.json(); })
      .then(function(res){
        var tbody = document.getElementById('bindingTable');
        if (res.code !== 0 || !res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
          return;
        }
        var html = '';
        res.data.forEach(function(b){
          var statusChecked = b.status === 'active' || b.status === 1 ? 'checked' : '';
          var ratioText = b.custom_split_ratio != null ? b.custom_split_ratio + '%' : '--';
          html += '<tr>' +
            '<td>' + (b.merchant_no || '--') + '</td>' +
            '<td>' + (b.company_id || '--') + '</td>' +
            '<td>' + splitModeBadge(b.split_mode) + '</td>' +
            '<td>' + ratioText + '</td>' +
            '<td><label class="toggle"><input type="checkbox" ' + statusChecked + ' data-id="' + b.id + '" class="status-toggle"><span class="slider"></span></label></td>' +
            '<td>' + (b.remark || '--') + '</td>' +
            '<td><button class="btn-sm btn-danger" data-id="' + b.id + '">停用</button></td></tr>';
        });
        tbody.innerHTML = html;

        // Bind toggle events
        var toggles = tbody.querySelectorAll('.status-toggle');
        for (var i = 0; i < toggles.length; i++) {
          toggles[i].onchange = function(){
            var id = this.getAttribute('data-id');
            var enabled = this.checked;
            if (!enabled && !confirm('确认停用此绑定？')) { this.checked = true; return; }
            disableBinding(id);
          };
        }

        // Bind disable button events
        var disableBtns = tbody.querySelectorAll('.btn-disable');
        for (var j = 0; j < disableBtns.length; j++) {
          disableBtns[j].onclick = function(){
            var id = this.getAttribute('data-id');
            if (!confirm('确认停用此绑定？')) return;
            disableBinding(id);
          };
        }
      })
      .catch(function(){ document.getElementById('bindingTable').innerHTML = '<tr><td colspan="7" class="empty">加载失败</td></tr>'; });
  }

  function disableBinding(id){
    fetch('/api/merchant/property/bindings/' + encodeURIComponent(id) + '/disable', {
      method: 'PUT',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' }
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.code === 0) { showToast('已停用', 'success'); loadBindings(); }
      else { showToast(res.msg || '操作失败', 'danger'); }
    })
    .catch(function(){ showToast('网络异常', 'danger'); });
  }

  // Modal controls
  var modal = document.getElementById('createModal');
  document.getElementById('btnCreate').onclick = function(){ modal.classList.add('show'); };
  document.getElementById('btnCancelCreate').onclick = function(){ modal.classList.remove('show'); };
  modal.onclick = function(e){ if (e.target === modal) modal.classList.remove('show'); };

  document.getElementById('btnSubmitCreate').onclick = function(){
    var merchantNo = document.getElementById('formMerchantNo').value.trim();
    var companyId = document.getElementById('formCompanyId').value;
    var modeRadios = document.getElementsByName('formSplitMode');
    var splitMode = '1';
    for (var i = 0; i < modeRadios.length; i++) {
      if (modeRadios[i].checked) { splitMode = modeRadios[i].value; break; }
    }
    var ratio = document.getElementById('formRatio').value;
    var remark = document.getElementById('formRemark').value.trim();

    if (!merchantNo) { showToast('请输入商家编号', 'danger'); return; }
    if (!companyId) { showToast('请选择物业公司', 'danger'); return; }

    var body = {
      merchant_no: merchantNo,
      company_id: companyId,
      split_mode: parseInt(splitMode, 10)
    };
    if (ratio !== '') body.custom_split_ratio = parseFloat(ratio);
    if (remark) body.remark = remark;

    var btn = document.getElementById('btnSubmitCreate');
    btn.disabled = true;
    btn.textContent = '提交中...';

    fetch('/api/merchant/property/bindings', {
      method: 'POST',
      headers: { 'X-Property-Token': token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.code === 0) {
        showToast('绑定创建成功', 'success');
        modal.classList.remove('show');
        // Reset form
        document.getElementById('formMerchantNo').value = '';
        document.getElementById('formCompanyId').value = '';
        modeRadios[0].checked = true;
        document.getElementById('formRatio').value = '';
        document.getElementById('formRemark').value = '';
        loadBindings();
      } else {
        showToast(res.msg || '创建失败', 'danger');
      }
    })
    .catch(function(){ showToast('网络异常', 'danger'); })
    .finally(function(){ btn.disabled = false; btn.textContent = '确认创建'; });
  };

  document.getElementById('btnFilter').onclick = loadBindings;
  document.getElementById('btnRefresh').onclick = function(){
    document.getElementById('companyId').value = '';
    document.getElementById('splitModeFilter').value = '';
    loadBindings();
  };
  loadBindings();
})();
</script>
</body>
