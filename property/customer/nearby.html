<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>哪家有 · 我的物业</title>
<style>
:root{--pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5,#7c3aed);--pri-bg:#eef2ff;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;--bg:#f8fafc;--border:#e2e8f0;--shadow-card:0 2px 12px rgba(0,0,0,.04);--r-md:14px;--r-lg:20px;--r-full:999px;--safe-bottom:env(safe-area-inset-bottom,0px);--success:#16a34a;--success-bg:#ecfdf5;--warning:#f59e0b;--warning-bg:#fffbeb;--danger:#dc2626;--danger-bg:#fef2f2;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;}
body{min-height:100vh;padding-bottom:calc(74px + var(--safe-bottom));max-width:480px;margin:0 auto;}
a{color:inherit;text-decoration:none;}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.hd{background:var(--pri-grad);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 20px;border-radius:0 0 var(--r-lg) var(--r-lg);position:relative;overflow:hidden;}
.hd::after{content:"";position:absolute;top:-60px;right:-40px;width:170px;height:170px;background:rgba(255,255,255,.08);border-radius:50%;}
.hd .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.hd .back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:17px;}
.hd h1{font-size:18px;font-weight:700;flex:1;}
.hd .meta{font-size:11.5px;opacity:.85;margin-top:7px;position:relative;z-index:1;}
.bubble{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-card);font-size:13px;line-height:1.65;margin:12px 16px 0;border-top-left-radius:4px;}
.bubble .who{font-size:11px;color:var(--text-3);margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.bubble .who i{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;}
.bubble b{color:var(--pri);font-weight:600;}
.wrap{padding:0 16px;}
.mcard{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-card);margin-top:12px;padding:14px;}
.mcard .top{display:flex;align-items:center;gap:10px;}
.mcard .nm{font-size:15px;font-weight:700;flex:1;}
.mcard .hit{font-size:11.5px;color:var(--success);background:var(--success-bg);padding:3px 9px;border-radius:var(--r-full);font-weight:600;}
.mcard .hit.no{color:var(--text-3);background:#f1f5f9;}
.mcard .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.mcard .tags span{font-size:10.5px;color:var(--text-2);background:#f1f5f9;padding:3px 8px;border-radius:var(--r-full);}
.mcard .gl{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
.mcard .gi{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);padding:3px 0;}
.mcard .gi b{color:var(--pri);font-weight:700;}
.mcard .acts{display:flex;gap:8px;margin-top:12px;}
.mcard .acts button{flex:1;height:36px;border-radius:var(--r-full);font-size:12.5px;font-weight:600;background:var(--pri-bg);color:var(--pri);}
.mcard .acts button.pri{background:var(--pri-grad);color:#fff;}
.empty{text-align:center;padding:44px 20px;color:var(--text-3);font-size:13px;line-height:1.7;}
.empty .big{font-size:34px;margin-bottom:10px;}
.ask{margin:12px 16px 0;display:flex;gap:8px;align-items:center;background:#fff;border-radius:var(--r-full);box-shadow:var(--shadow-card);padding:6px 6px 6px 16px;}
.ask input{flex:1;border:none;outline:none;font-size:13.5px;background:transparent;height:34px;}
.ask button{height:34px;padding:0 16px;border-radius:var(--r-full);background:var(--pri-grad);color:#fff;font-size:13px;font-weight:600;}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;padding:7px 0 calc(7px + var(--safe-bottom));z-index:50;}
.tabbar a{flex:1;text-align:center;font-size:11px;color:var(--text-3);}
.tabbar a .ic{font-size:19px;display:block;margin-bottom:2px;}
.tabbar a.on{color:var(--pri);font-weight:600;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:rgba(17,24,39,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:var(--r-full);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:78%;text-align:center;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="hd">
  <div class="row"><a class="back" href="index.html">‹</a><h1>AI 管家 · 帮我找哪家有</h1></div>
  <div class="meta" id="meta">本小区商户 · 在售状态实时</div>
</div>

<div class="bubble">
  <div class="who"><i></i>AI 管家 · 按「有货 → 近 → 能抵物业费」排的</div>
  <div id="aiSay">说出你要买的东西，我查本小区哪些店有货。</div>
</div>

<div class="wrap" id="list"><div class="empty">加载中…</div></div>

<div class="wrap"><div class="mcard" style="margin-top:12px;">
  <div style="font-size:12.5px;color:var(--text-2);line-height:1.7;">
    <b style="color:var(--text);">买之前提醒两句：</b>距离与步行时间目前没有接入（商户表无坐标），
    这里的排序只按「命中件数」；导航与拨号也要等商户地址、电话字段补全后才能用，
    现在先不显示假数据。
  </div>
</div></div>

<div class="ask">
  <input id="q" placeholder="比如：软管、生料带、草莓…">
  <button onclick="go()">查</button>
</div>

<div class="tabbar">
  <a href="index.html"><span class="ic">🏠</span>首页</a>
  <a href="mall.html"><span class="ic">🛒</span>商城</a>
  <a href="group.html"><span class="ic">💬</span>消息</a>
  <a href="orders.html"><span class="ic">📋</span>订单</a>
</div>
<div class="toast" id="toast"></div>

<script>
var $=function(id){return document.getElementById(id);};
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200);}
var TOKEN=localStorage.getItem("property_owner_token")||"";
var Q=new URLSearchParams(location.search);
var KW=Q.get("q")||"";
if(KW){$("q").value=KW;$("aiSay").textContent="你要找「"+KW+"」，我查了下本小区这些店。";}
function money(v){return "￥"+(Number(v||0)).toFixed(2);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function load(){
  if(!TOKEN){toast("请先登录");setTimeout(function(){location.href="login.html"},900);return;}
  fetch("/api/property/mall/nearby?q="+encodeURIComponent(KW),{headers:{"X-Owner-Token":TOKEN}})
    .then(function(r){return r.json();})
    .then(function(r){
      if(r.code!==0){$("list").innerHTML='<div class="empty">'+(r.msg||"加载失败")+'</div>';return;}
      var d=r.data,l=d.list||[];
      var hit=l.filter(function(x){return x.hitCount>0;});
      $("meta").textContent="本小区 "+l.length+" 家商户 · 命中 "+hit.length+" 家";
      if(!l.length){$("list").innerHTML='<div class="empty"><div class="big">🏪</div>本小区还没有已入驻商户<br>业主邀一家店入驻后这里就有货了</div>';return;}
      var h="";
      l.forEach(function(m){
        var has=m.hitCount>0;
        h+='<div class="mcard"><div class="top"><div class="nm">'+esc(m.merchantName)+'</div>'
          +'<div class="hit'+(has?"":" no")+'">'+(has?("在售 "+m.hitCount+" 件"):"没找到")+'</div></div>'
          +'<div class="tags"><span>本小区商户</span><span>消费可抵物业费</span>'+(m.open?"":"<span>待物业开通</span>")+'</div>';
        if(has){
          h+='<div class="gl">';
          (m.goods||[]).slice(0,5).forEach(function(g){
            h+='<div class="gi"><span>'+esc(g.goodsName)+'</span><b>'+money(g.price)+'</b></div>';
          });
          h+='</div>';
        }
        h+='<div class="acts"><button onclick="toast(\'下单与导航待商户地址/库存接入后开放\')">线上下单</button>'
          +'<button class="pri" onclick="toast(\'去商城看看这家\');location.href=\'mall.html\'">去商城看看</button></div></div>';
      });
      $("list").innerHTML=h;
    }).catch(function(e){$("list").innerHTML='<div class="empty">网络异常</div>';});
}
function go(){
  var v=($("q").value||"").trim();
  if(!v){toast("说你要买什么");return;}
  location.href="nearby.html?q="+encodeURIComponent(v);
}
load();
</script>
</body>
</html>
