<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>绑定物业 · 我的物业</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<style>
:root{--pri:#4f46e5;--pri-hover:#4338ca;--pri-light:#818cf8;--pri-bg:#eef2ff;--pri-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);--gold:#f59e0b;--gold-bg:#fffbeb;--success:#10b981;--success-bg:#ecfdf5;--danger:#ef4444;--danger-bg:#fef2f2;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;--bg:#f8fafc;--surface:#ffffff;--border:#e2e8f0;--divider:#f1f5f9;--shadow-card:0 2px 12px rgba(0,0,0,.04);--shadow-float:0 8px 30px rgba(0,0,0,.08);--r-md:14px;--r-lg:20px;--r-xl:24px;--r-full:999px;--safe-bottom:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.4,0,.2,1);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;}
body{min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.page-content>*{animation:fadeInUp .4s var(--ease) backwards;}
.page-content>*:nth-child(1){animation-delay:0s;}
.page-content>*:nth-child(2){animation-delay:.05s;}
.page-content>*:nth-child(3){animation-delay:.1s;}
.page-content>*:nth-child(4){animation-delay:.15s;}

.app-shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);}
.page-content{padding:20px 20px calc(80px + var(--safe-bottom));}

.hero{background:var(--pri-grad);color:#fff;padding:36px 20px 28px;position:relative;overflow:hidden;border-radius:0 0 var(--r-xl) var(--r-xl);}
.hero::before{content:"";position:absolute;top:-60px;right:-40px;width:180px;height:180px;background:rgba(255,255,255,.08);border-radius:50%;}
.hero h1{font-size:20px;font-weight:700;position:relative;z-index:1;}
.hero .sub{font-size:13px;opacity:.8;margin-top:4px;position:relative;z-index:1;}

.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-card);border:none;margin-bottom:16px;}

.scan-placeholder{width:100%;height:120px;border:2px dashed var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);font-size:13px;margin-bottom:16px;gap:8px;transition:all .2s;}
.scan-placeholder .emoji{font-size:32px;}

.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;}
input{width:100%;padding:14px 16px;border:none;border-radius:var(--r-md);background:var(--bg);font-size:15px;color:var(--text);outline:none;transition:box-shadow .2s;box-sizing:border-box;}
input:focus{box-shadow:0 0 0 2px var(--pri),inset 0 0 0 1px var(--pri);}
input::placeholder{color:var(--text-3);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-xl{height:60px;padding:0 40px;font-size:18px;border-radius:14px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 14px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
/* FAB */
.fab{position:fixed;bottom:calc(88px + var(--safe-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(79,70,229,.4);z-index:40;border:none;cursor:pointer;transition:transform .15s;}
.fab:active{transform:scale(.9);}
/* CTA full-width */
.btn-cta{width:100%;height:56px;font-size:17px;font-weight:700;border-radius:16px;letter-spacing:.3px;}

.sec-title{font-size:18px;font-weight:700;color:var(--text);margin:24px 0 14px;display:flex;align-items:center;justify-content:space-between;}
.sec-title .count{font-size:13px;color:var(--text-3);font-weight:500;}

.binding-item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-card);transition:all .2s var(--ease);}
.binding-item .ic{width:42px;height:42px;border-radius:var(--r-md);background:var(--pri-bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 42px;}
.binding-item .main{flex:1;min-width:0;}
.binding-item .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.binding-item .s{font-size:12px;color:var(--text-3);margin-top:4px;}

.status-badge{display:inline-flex;padding:4px 12px;border-radius:var(--r-full);font-size:11px;font-weight:700;letter-spacing:.3px;}
.status-badge.approved{background:var(--success-bg);color:var(--success);}
.status-badge.pending{background:var(--gold-bg);color:var(--gold);}
.status-badge.rejected{background:var(--danger-bg);color:var(--danger);}



.empty{text-align:center;padding:32px 16px;color:var(--text-3);font-size:13px;}
.empty .emoji{font-size:36px;display:block;margin-bottom:8px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:24px 20px calc(24px + var(--safe-bottom));box-shadow:var(--shadow-float);animation:sheetUp .3s var(--ease);}
@keyframes sheetUp{from{transform:translateX(-50%) translateY(100%);}to{transform:translateX(-50%) translateY(0);}}
.modal-sheet .d-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.modal-sheet .d-msg{font-size:14px;color:var(--text-2);margin-bottom:20px;line-height:1.5;}
.modal-sheet .d-btns{display:flex;gap:10px;}
.modal-sheet .d-btns button{flex:1;height:48px;border-radius:var(--r-md);font-size:15px;font-weight:700;cursor:pointer;border:none;transition:all .2s var(--ease);}
.modal-sheet .d-cancel{background:var(--bg);color:var(--text-2);}
.modal-sheet .d-confirm{background:var(--danger);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.35);}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid rgba(0,0,0,.06);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + var(--safe-bottom));z-index:50;}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text-3);text-decoration:none;transition:color .2s;}
.bottom-nav a.active{color:var(--pri);}
.bottom-nav a.active::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--pri);margin-top:2px;}
.bottom-nav a.active .icon{transform:translateY(-2px);}
.bottom-nav a .icon{font-size:24px;line-height:1;transition:transform .2s var(--ease);}
.bottom-nav a.active .icon{transform:scale(1.1);}

.toast-host{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:400px;}
.toast{padding:12px 20px;border-radius:var(--r-full);background:rgba(30,41,59,.92);backdrop-filter:blur(10px);color:#fff;font-size:13px;font-weight:500;text-align:center;opacity:0;transform:translateY(-12px);transition:all .3s var(--ease);box-shadow:0 4px 20px rgba(0,0,0,.15);}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--success);}
.toast.warning{background:var(--gold);}
.toast.danger{background:var(--danger);}
</style>
</head>
<body>
<div class="app-shell">
<div class="hero">
  <h1>绑定物业</h1>
  <div class="sub">扫码或输入公司ID绑定物业公司</div>
</div>

<div class="page-content">
  <div class="card">
    <div class="scan-placeholder" id="scanArea">
      <span class="emoji">📷</span>
      <span>点击扫码绑定（暂用手动输入）</span>
    </div>
    <div class="form-group">
      <label>物业公司 ID</label>
      <input id="companyId" type="text" placeholder="请输入物业公司ID">
    </div>
    <button id="btnBind" class="btn btn-md btn-primary btn-block">绑 定</button>
  </div>

  <div class="sec-title">🏢 已绑定物业 <span class="count" id="bindCount"></span></div>
  <div id="bindingList"></div>
</div>
</div>

<!-- Confirm Dialog as Bottom Sheet -->
<div class="modal-overlay" id="confirmMask">
  <div class="modal-sheet">
    <div class="d-title">确认解绑</div>
    <div class="d-msg" id="confirmMsg">确定要解绑该物业公司吗？</div>
    <div class="d-btns">
      <button class="d-cancel" id="btnCancelUnbind">取消</button>
      <button class="d-confirm" id="btnConfirmUnbind">确认解绑</button>
    </div>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<nav class="bottom-nav">
  <a href="index.html"><span class="icon">🏠</span><span>首页</span></a>
  <a href="access.html"><span class="icon">🚪</span><span>门禁</span></a>
  <a href="reservation.html"><span class="icon">🏟️</span><span>预约</span></a>
  <a href="bills.html"><span class="icon">📋</span><span>账单</span></a>
  <a href="bind.html" class="active"><span class="icon">👤</span><span>我的</span></a>
</nav>

<script>
const $=id=>document.getElementById(id);
const API="/api/property/owner";
function toast(m,t){const h=$("toastHost");if(!h)return;const e=document.createElement("div");e.className="toast "+(t||"");e.textContent=m;h.appendChild(e);requestAnimationFrame(()=>e.classList.add("show"));setTimeout(()=>{e.classList.remove("show");setTimeout(()=>e.remove(),220)},2400)}

const tk=localStorage.getItem("property_owner_token");
if(!tk){location.href="login.html"}

async function req(path,method,body){
  const p=new URLSearchParams();
  if(body)Object.keys(body).forEach(k=>{const v=body[k];if(v!=null&&v!=="")p.append(k,v)});
  const h={};const token=localStorage.getItem("property_owner_token");
  if(token)h["X-Owner-Token"]=token;
  if(token)h["Authorization"]="Bearer "+token;
  const o={method:method||"GET",headers:h};
  if(method==="POST"||method==="PUT"||method==="DELETE"){h["Content-Type"]="application/x-www-form-urlencoded";o.body=p.toString()}
  try{
    const r=await fetch(API+path,o).then(r=>r.json());
    if(r.code===401){localStorage.removeItem("property_owner_token");toast("登录已过期，请重新登录","warning");setTimeout(()=>{location.href="login.html"},1500)}
    return r;
  }catch(e){return{code:-1,msg:e.message}}
}
const get=p=>req(p,"GET");
const post=(p,b)=>req(p,"POST",b);
const del=p=>req(p,"DELETE");

function emptyBox(emoji,text){return '<div class="empty"><span class="emoji">'+emoji+'</span>'+text+'</div>'}
function fmtTime(s){return s?s.replace("T"," ").slice(0,16):""}

function statusBadge(status){
  const map={
    "approved":{cls:"approved",text:"已通过"},
    "pending":{cls:"pending",text:"待审核"},
    "rejected":{cls:"rejected",text:"已拒绝"},
    "1":{cls:"approved",text:"已通过"},
    "0":{cls:"pending",text:"待审核"},
    "2":{cls:"rejected",text:"已拒绝"},
    "active":{cls:"approved",text:"已通过"}
  };
  const s=map[status]||map[String(status)]||{cls:"pending",text:String(status||"待审核")};
  return '<span class="status-badge '+s.cls+'">'+s.text+'</span>';
}

$("btnBind").addEventListener("click",async function(){
  const cid=($("companyId").value||"").trim();
  if(!cid){toast("请输入物业公司ID","warning");$("companyId").focus();return}
  $("btnBind").disabled=true;$("btnBind").textContent="绑定中...";
  try{
    const r=await post("/bind?companyId="+encodeURIComponent(cid));
    if(r.code===0){
      toast("绑定请求已提交","success");
      $("companyId").value="";
      loadBindings();
    }else{
      toast(r.msg||"绑定失败","danger");
    }
  }catch(e){
    toast("网络异常："+(e.message||"请稍后再试"),"danger");
  }
  $("btnBind").disabled=false;$("btnBind").textContent="绑 定";
});

async function loadBindings(){
  const r=await get("/bindings");
  if(r.code===0&&r.data&&r.data.length){
    const list=r.data;
    $("bindCount").textContent="共 "+list.length+" 个";
    $("bindingList").innerHTML=list.map(function(b){
      const st=b.status||b.bindStatus||"approved";
      const canUnbind=(st==="approved"||st==="active"||st==="1");
      return '<div class="binding-item">'
        +'<div class="ic">🏢</div>'
        +'<div class="main"><div class="t">'+(b.companyName||b.name||"物业公司")+' '+statusBadge(st)+'</div>'
        +'<div class="s">绑定时间：'+fmtTime(b.bindTime||b.createTime)+(b.rejectReason?' · 原因：'+b.rejectReason:'')+'</div></div>'
        +(canUnbind?'<button class="btn btn-xs btn-danger" onclick="confirmUnbind('+b.id+',\''+(b.companyName||b.name||"").replace(/'/g,"\\'")+'\')">解绑</button>':'')
        +'</div>';
    }).join("");
  }else{
    $("bindCount").textContent="";
    $("bindingList").innerHTML=emptyBox("🏢","暂无绑定物业，请先绑定");
  }
}

let _unbindId=null;
window.confirmUnbind=function(id,name){
  _unbindId=id;
  $("confirmMsg").textContent="确定要解绑「"+name+"」吗？解绑后将无法查看相关账单。";
  $("confirmMask").classList.add("show");
};
$("btnCancelUnbind").addEventListener("click",()=>{
  $("confirmMask").classList.remove("show");_unbindId=null;
});
$("btnConfirmUnbind").addEventListener("click",async()=>{
  if(!_unbindId)return;
  $("btnConfirmUnbind").disabled=true;$("btnConfirmUnbind").textContent="解绑中...";
  try{
    const r=await del("/bindings/"+_unbindId);
    if(r.code===0){
      toast("解绑成功","success");
      loadBindings();
    }else{
      toast(r.msg||"解绑失败","danger");
    }
  }catch(e){
    toast("网络异常："+(e.message||"请稍后再试"),"danger");
  }
  $("confirmMask").classList.remove("show");_unbindId=null;
  $("btnConfirmUnbind").disabled=false;$("btnConfirmUnbind").textContent="确认解绑";
});

loadBindings();
</script>
</body>
</html>
