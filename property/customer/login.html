<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>业主登录 · 我的物业</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<style>
:root{--pri:#4f46e5;--pri-hover:#4338ca;--pri-light:#818cf8;--pri-bg:#eef2ff;--pri-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);--gold:#f59e0b;--gold-bg:#fffbeb;--success:#10b981;--success-bg:#ecfdf5;--danger:#ef4444;--danger-bg:#fef2f2;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;--bg:#f8fafc;--surface:#ffffff;--border:#e2e8f0;--divider:#f1f5f9;--shadow-card:0 2px 12px rgba(0,0,0,.04);--shadow-float:0 8px 30px rgba(0,0,0,.08);--r-md:14px;--r-lg:20px;--r-xl:24px;--r-full:999px;--safe-bottom:env(safe-area-inset-bottom,0px);--ease:cubic-bezier(.4,0,.2,1);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--pri-grad);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

.login-wrap{max-width:480px;margin:0 auto;width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px calc(40px + var(--safe-bottom));}

.hero-area{text-align:center;margin-bottom:36px;animation:fadeInUp .5s var(--ease) backwards;}
.hero-area .emoji{font-size:56px;line-height:1;margin-bottom:16px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.15));}
.hero-area h1{font-size:26px;font-weight:800;color:#fff;margin-bottom:8px;letter-spacing:-.5px;}
.hero-area p{font-size:14px;color:rgba(255,255,255,.8);line-height:1.5;}

.form-card{background:var(--surface);border-radius:var(--r-xl);padding:32px 24px;width:100%;box-shadow:var(--shadow-float);animation:fadeInUp .5s var(--ease) .1s backwards;}

.tabs{display:flex;background:var(--bg);border-radius:var(--r-full);padding:4px;margin-bottom:24px;}
.tabs button{flex:1;padding:12px 4px;font-size:14px;color:var(--text-2);border-radius:var(--r-full);cursor:pointer;font-weight:600;transition:all .25s var(--ease);}
.tabs button.active{background:var(--surface);color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.06);}

.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;}

input{width:100%;padding:14px 16px;border:none;border-radius:var(--r-md);background:var(--bg);font-size:15px;color:var(--text);outline:none;transition:box-shadow .2s;box-sizing:border-box;}
input:focus{box-shadow:0 0 0 2px var(--pri),inset 0 0 0 1px var(--pri);}
input::placeholder{color:var(--text-3);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-xl{height:60px;padding:0 40px;font-size:18px;border-radius:14px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 14px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
/* FAB */
.fab{position:fixed;bottom:calc(88px + var(--safe-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(79,70,229,.4);z-index:40;border:none;cursor:pointer;transition:transform .15s;}
.fab:active{transform:scale(.9);}
/* CTA full-width */
.btn-cta{width:100%;height:56px;font-size:17px;font-weight:700;border-radius:16px;letter-spacing:.3px;}

.toast-host{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:400px;}
.toast{padding:12px 20px;border-radius:var(--r-full);background:rgba(30,41,59,.92);backdrop-filter:blur(10px);color:#fff;font-size:13px;font-weight:500;text-align:center;opacity:0;transform:translateY(-12px);transition:all .3s var(--ease);box-shadow:0 4px 20px rgba(0,0,0,.15);}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--success);}
.toast.warning{background:var(--gold);}
.toast.danger{background:var(--danger);}
</style>
</head>
<body>
<div class="toast-host" id="toastHost"></div>
<div class="login-wrap">
  <div class="hero-area">
    <div class="emoji">🏠</div>
    <h1>业主服务平台</h1>
    <p>登录后查看余额、开门、账单等物业服务</p>
  </div>
  <div class="form-card">
    <div class="tabs" id="authTabs">
      <button class="active" data-tab="login">登录</button>
      <button data-tab="register">注册</button>
    </div>
    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label>手机号</label>
        <input id="loginPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input id="loginPwd" type="password" placeholder="请输入密码">
      </div>
      <button id="btnLogin" class="btn btn-md btn-primary btn-block">登 录</button>
    </div>
    <!-- Register Form -->
    <div id="registerForm" style="display:none;">
      <div class="form-group">
        <label>姓名</label>
        <input id="regName" type="text" placeholder="请输入您的姓名">
      </div>
      <div class="form-group">
        <label>手机号</label>
        <input id="regPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input id="regPwd" type="password" placeholder="请设置密码（至少6位）">
      </div>
      <button id="btnRegister" class="btn btn-md btn-primary btn-block">注 册</button>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function toast(m,t){const h=$("toastHost");if(!h)return;const e=document.createElement("div");e.className="toast "+(t||"");e.textContent=m;h.appendChild(e);requestAnimationFrame(()=>e.classList.add("show"));setTimeout(()=>{e.classList.remove("show");setTimeout(()=>e.remove(),220)},2600)}
function validPhone(v){return /^1[3-9]\d{9}$/.test(v)}

// Tab switch
document.querySelectorAll("#authTabs button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll("#authTabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    const tab=b.dataset.tab;
    $("loginForm").style.display=tab==="login"?"block":"none";
    $("registerForm").style.display=tab==="register"?"block":"none";
  });
});

// Login
$("btnLogin").addEventListener("click",async function(){
  const phone=($("loginPhone").value||"").trim();
  const pwd=($("loginPwd").value||"").trim();
  if(!validPhone(phone)){toast("请输入正确的 11 位手机号","warning");$("loginPhone").focus();return}
  if(!pwd){toast("请输入密码","warning");$("loginPwd").focus();return}
  $("btnLogin").disabled=true;$("btnLogin").textContent="登录中...";
  try{
    const resp=await fetch("/api/property/owner/login",{
      method:"POST",
      body:"ownerPhone="+encodeURIComponent(phone)+"&password="+encodeURIComponent(pwd),
      headers:{"Content-Type":"application/x-www-form-urlencoded"}
    });
    const r=await resp.json();
    if(r.code===0&&r.data){
      localStorage.setItem("property_owner_token",r.data.token||r.data);
      localStorage.setItem("property_owner_phone",phone);
      toast("登录成功","success");
      setTimeout(()=>{location.href="index.html"},400);
    }else{
      toast(r.msg||"登录失败","danger");
      $("btnLogin").disabled=false;$("btnLogin").textContent="登 录";
    }
  }catch(e){
    toast("网络异常："+(e.message||"请稍后再试"),"danger");
    $("btnLogin").disabled=false;$("btnLogin").textContent="登 录";
  }
});

// Register
$("btnRegister").addEventListener("click",async function(){
  const name=($("regName").value||"").trim();
  const phone=($("regPhone").value||"").trim();
  const pwd=($("regPwd").value||"").trim();
  if(!name){toast("请输入姓名","warning");$("regName").focus();return}
  if(!validPhone(phone)){toast("请输入正确的 11 位手机号","warning");$("regPhone").focus();return}
  if(!pwd||pwd.length<6){toast("密码至少 6 位","warning");$("regPwd").focus();return}
  $("btnRegister").disabled=true;$("btnRegister").textContent="注册中...";
  try{
    const resp=await fetch("/api/property/owner/register",{
      method:"POST",
      body:"ownerName="+encodeURIComponent(name)+"&ownerPhone="+encodeURIComponent(phone)+"&password="+encodeURIComponent(pwd),
      headers:{"Content-Type":"application/x-www-form-urlencoded"}
    });
    const r=await resp.json();
    if(r.code===0){
      toast("注册成功，请登录","success");
      // Switch to login tab
      document.querySelectorAll("#authTabs button").forEach(x=>x.classList.remove("active"));
      document.querySelector('#authTabs button[data-tab="login"]').classList.add("active");
      $("loginForm").style.display="block";
      $("registerForm").style.display="none";
      $("loginPhone").value=phone;
      $("btnRegister").disabled=false;$("btnRegister").textContent="注 册";
    }else{
      toast(r.msg||"注册失败","danger");
      $("btnRegister").disabled=false;$("btnRegister").textContent="注 册";
    }
  }catch(e){
    toast("网络异常："+(e.message||"请稍后再试"),"danger");
    $("btnRegister").disabled=false;$("btnRegister").textContent="注 册";
  }
});

// If already logged in, redirect
if(localStorage.getItem("property_owner_token")){location.href="index.html"}
</script>
</body>
</html>
