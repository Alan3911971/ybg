<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>小区商城 · 我的物业</title>
<style>
:root{--pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5,#7c3aed);--pri-bg:#eef2ff;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--shadow-card:0 2px 12px rgba(0,0,0,.04);--r-md:14px;--r-lg:20px;--r-full:999px;--safe-bottom:env(safe-area-inset-bottom,0px);--success:#16a34a;--success-bg:#ecfdf5;--warning:#f59e0b;--warning-bg:#fffbeb;--danger:#dc2626;--danger-bg:#fef2f2;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;}
body{min-height:100vh;padding-bottom:calc(74px + var(--safe-bottom));max-width:480px;margin:0 auto;}
a{color:inherit;text-decoration:none;}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.hd{background:var(--pri-grad);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 20px;border-radius:0 0 var(--r-lg) var(--r-lg);position:relative;overflow:hidden;}
.hd::after{content:"";position:absolute;top:-60px;right:-40px;width:170px;height:170px;background:rgba(255,255,255,.08);border-radius:50%;}
.hd .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.hd .back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:17px;}
.hd h1{font-size:18px;font-weight:700;flex:1;}
.hd .meta{font-size:11.5px;opacity:.85;margin-top:7px;position:relative;z-index:1;}
.walletbar{margin:12px 16px 0;background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:13px 15px;display:flex;align-items:center;gap:12px;}
.walletbar .lab{font-size:12px;color:var(--text-2);}
.walletbar .num{font-size:22px;font-weight:800;color:var(--pri);font-family:ui-monospace,Menlo,Consolas,monospace;}
.walletbar .tip{font-size:11px;color:var(--text-3);line-height:1.55;flex:1;}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.mtab{flex:0 0 auto;padding:7px 15px;border-radius:var(--r-full);font-size:12.5px;font-weight:500;background:#fff;color:var(--text-2);white-space:nowrap;box-shadow:var(--shadow-card);}
.mtab.active{background:var(--pri-grad);color:#fff;font-weight:600;}
.wrap{padding:0 16px;}
.gcard{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-card);margin-top:10px;padding:13px 14px;display:flex;gap:12px;align-items:center;}
.gcard .ph{width:56px;height:56px;border-radius:10px;background:var(--pri-bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 56px;}
.gcard .info{flex:1;min-width:0;}
.gcard .nm{font-size:14px;font-weight:600;line-height:1.35;}
.gcard .mch{font-size:11.5px;color:var(--text-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gcard .bt{display:flex;align-items:baseline;gap:8px;margin-top:6px;}
.gcard .pr{font-size:17px;font-weight:800;color:var(--pri);}
.gcard .sp{font-size:11px;color:var(--success);background:var(--success-bg);padding:2px 8px;border-radius:var(--r-full);font-weight:600;}
.card{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-card);margin-top:12px;padding:14px;}
.card .ct{font-size:14px;font-weight:700;margin-bottom:10px;}
.compare{display:flex;gap:10px;}
.compare .col{flex:1;border-radius:10px;padding:10px;font-size:12px;line-height:1.55;}
.compare .col.bad{background:var(--danger-bg);color:#b91c1c;}
.compare .col.good{background:var(--success-bg);color:#15803d;}
.compare .col b{display:block;font-size:13.5px;margin-bottom:3px;}
.note{font-size:12.5px;color:var(--text-2);line-height:1.7;margin-top:10px;}
.empty{text-align:center;padding:44px 20px;color:var(--text-3);font-size:13px;line-height:1.7;}
.empty .big{font-size:34px;margin-bottom:10px;}
.ask{margin:12px 16px 0;display:flex;gap:8px;align-items:center;background:#fff;border-radius:var(--r-full);box-shadow:var(--shadow-card);padding:6px 6px 6px 16px;}
.ask input{flex:1;border:none;outline:none;font-size:13.5px;background:transparent;height:34px;}
.ask button{height:34px;padding:0 16px;border-radius:var(--r-full);background:var(--pri-grad);color:#fff;font-size:13px;font-weight:600;}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;padding:7px 0 calc(7px + var(--safe-bottom));z-index:50;}
.tabbar a{flex:1;text-align:center;font-size:11px;color:var(--text-3);}
.tabbar a .ic{font-size:19px;display:block;margin-bottom:2px;}
.tabbar a.on{color:var(--pri);font-weight:600;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:rgba(17,24,39,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:var(--r-full);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:78%;text-align:center;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="hd">
  <div class="row"><a class="back" href="index.html">‹</a><h1>宜必购 · 小区商城</h1></div>
  <div class="meta" id="meta">加载中…</div>
</div>

<div class="walletbar">
  <div>
    <div class="lab">物业钱包</div>
    <div class="num" id="walletNum">￥0.00</div>
  </div>
  <div class="tip">只能抵物业费，不抵商城消费——这里买东西是微信付，付完 8% 回到上面这个数，下月自动抵物业费。</div>
</div>

<div class="tabs" id="mtabs"></div>

<div class="wrap" id="goodsList"><div class="empty">加载中…</div></div>

<div class="wrap">
  <div class="card">
    <div class="ct">同一笔钱，走哪条路不一样</div>
    <div class="compare">
      <div class="col bad"><b>美团抽走 20%</b>一分不回来</div>
      <div class="col good"><b>这里只让利 8%</b>8% 回到你自己小区的物业费里</div>
    </div>
    <div class="note">一单 ￥39 的蛋糕，你多拿 1 次抽盒，物业费少缴 ￥3.12。你没多花钱，钱只是换了个方向。</div>
  </div>
</div>

<div class="ask">
  <input id="q" placeholder="说一句，比如「有没有低糖的」…">
  <button onclick="search()">找</button>
</div>

<div class="tabbar">
  <a href="index.html"><span class="ic">🏠</span>首页</a>
  <a href="mall.html" class="on"><span class="ic">🛒</span>商城</a>
  <a href="group.html"><span class="ic">💬</span>消息</a>
  <a href="mine.html"><span class="ic">👤</span>我的</a>
</div>
<div class="toast" id="toast"></div>

<script>
var $=function(id){return document.getElementById(id);};
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200);}
var TOKEN=localStorage.getItem("property_owner_token")||"";
var ALL=[],CUR="";
function api(p){return fetch(p,{headers:{"X-Owner-Token":TOKEN}}).then(function(r){return r.json();});}
function money(v){return "￥"+(Number(v||0)).toFixed(2);}

function load(){
  if(!TOKEN){toast("请先登录");setTimeout(function(){location.href="login.html"},900);return;}
  api("/api/property/mall/goods").then(function(r){
    if(r.code!==0){$("goodsList").innerHTML='<div class="empty">'+(r.msg||"加载失败")+'</div>';return;}
    var d=r.data;ALL=d.list||[];
    $("walletNum").textContent=money(d.wallet&&d.wallet.balance);
    $("meta").textContent=d.merchantCount+" 家 · "+d.goodsCount+" 件在售";
    renderTabs();renderList();
  }).catch(function(e){$("goodsList").innerHTML='<div class="empty">网络异常</div>';});
}
function renderTabs(){
  var names={};ALL.forEach(function(g){names[g.merchantName||"本小区商户"]=(names[g.merchantName||"本小区商户"]||0)+1;});
  var h='<button class="mtab active" data-m="" onclick="pick(\'\')">全部 '+Object.keys(names).length+' 家</button>';
  Object.keys(names).forEach(function(n){h+='<button class="mtab" data-m="'+n+'" onclick="pick(\''+n+'\')">'+n+' '+names[n]+'</button>';});
  $("mtabs").innerHTML=h;
}
function pick(n){
  CUR=n;
  Array.prototype.forEach.call(document.querySelectorAll(".mtab"),function(b){
    b.classList.toggle("active", b.dataset.m===n);
  });
  renderList();
}
function renderList(){
  var l=ALL.filter(function(g){return !CUR||(g.merchantName||"")===CUR;});
  if(!l.length){$("goodsList").innerHTML='<div class="empty"><div class="big">🛒</div>本小区还没有商户上架商品<br>业主邀一家店入驻后这里就有货了</div>';return;}
  var h="";
  l.forEach(function(g){
    h+='<div class="gcard" onclick="location.href=\'checkout.html?items='+g.goodsId+':1\'"><div class="ph">🛍️</div><div class="info">'
      +'<div class="nm">'+esc(g.goodsName)+'</div>'
      +'<div class="mch">'+esc(g.merchantName||"")+(g.description?(" · "+esc(g.description)):"")+'</div>'
      +'<div class="bt"><span class="pr">'+money(g.price)+'</span>'
      +'<span class="sp">抽 '+(g.drawTimes||1)+' 次 · 分账 '+money(g.splitAmount)+'</span></div>'
      +'</div></div>';
  });
  $("goodsList").innerHTML=h;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function search(){
  var v=($("q").value||"").trim();
  if(!v){toast("说点什么，比如「草莓」");return;}
  location.href="nearby.html?q="+encodeURIComponent(v);
}
load();
</script>
</body>
</html>
