<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>人脸识别 · 我的物业</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E🏠%3C/text%3E%3C/svg%3E">
<style>
:root{--pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5,#7c3aed);--pri-bg:#eef2ff;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--shadow-card:0 2px 12px rgba(0,0,0,.04);--r-md:14px;--r-lg:20px;--r-full:999px;--safe-bottom:env(safe-area-inset-bottom,0px);--success:#16a34a;--success-bg:#ecfdf5;--warning:#f59e0b;--warning-bg:#fffbeb;--danger:#dc2626;--danger-bg:#fef2f2;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;}
body{min-height:100vh;padding-bottom:calc(72px + var(--safe-bottom));max-width:480px;margin:0 auto;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.anim-in{animation:fadeInUp .45s cubic-bezier(.22,1,.36,1) both;}
.anim-d1{animation-delay:.05s;}.anim-d2{animation-delay:.1s;}.anim-d3{animation-delay:.15s;}.anim-d4{animation-delay:.2s;}

.hero{background:var(--pri-grad);color:#fff;padding:48px 24px 32px;position:relative;overflow:hidden;border-radius:0 0 var(--r-lg) var(--r-lg);}
.hero::before{content:"";position:absolute;top:-60px;right:-40px;width:200px;height:200px;background:rgba(255,255,255,.08);border-radius:50%;}
.hero::after{content:"";position:absolute;bottom:-30px;left:-20px;width:120px;height:120px;background:rgba(255,255,255,.06);border-radius:50%;}
.hero h1{font-size:22px;font-weight:700;position:relative;z-index:1;letter-spacing:-.3px;}
.hero .sub{font-size:13px;opacity:.85;margin-top:6px;position:relative;z-index:1;font-weight:400;}

.wrap{padding:0 16px;}

.status-card{background:var(--surface);border-radius:var(--r-lg);padding:28px 20px;margin-top:20px;text-align:center;box-shadow:var(--shadow-card);border:none;}
.status-icon{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 14px;transition:all .3s ease;}
.status-icon.pending{background:var(--warning-bg);color:var(--warning);}
.status-icon.approved{background:var(--success-bg);color:var(--success);}
.status-icon.rejected{background:var(--danger-bg);color:var(--danger);}
.status-icon.none{background:var(--bg);color:var(--text-3);}
.status-text{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--text);}
.status-desc{font-size:13px;color:var(--text-2);line-height:1.6;}
.face-preview{width:100px;height:100px;border-radius:50%;object-fit:cover;margin:0 auto 14px;border:3px solid var(--border);display:none;box-shadow:0 4px 16px rgba(0,0,0,.08);}

.upload-section{background:var(--surface);border-radius:var(--r-lg);padding:24px 20px;margin-top:16px;box-shadow:var(--shadow-card);border:none;}
.upload-section-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text);}
.upload-area{width:100%;height:160px;border:2px dashed var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:13px;cursor:pointer;transition:all .2s ease;margin-bottom:16px;position:relative;overflow:hidden;background:var(--bg);}
.upload-area:active{border-color:var(--pri);color:var(--pri);background:var(--pri-bg);}
.upload-area .emoji{font-size:42px;}
.upload-area.has-file{border-style:solid;border-color:var(--success);background:var(--success-bg);color:var(--success);}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-area .preview-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-xl{height:60px;padding:0 40px;font-size:18px;border-radius:14px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 14px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
/* FAB */
.fab{position:fixed;bottom:calc(88px + var(--safe-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(79,70,229,.4);z-index:40;border:none;cursor:pointer;transition:transform .15s;}
.fab:active{transform:scale(.9);}
/* CTA full-width */
.btn-cta{width:100%;height:56px;font-size:17px;font-weight:700;border-radius:16px;letter-spacing:.3px;}

.note{margin-top:20px;padding:16px;background:var(--pri-bg);border-radius:var(--r-md);font-size:12px;color:var(--text-2);line-height:1.7;display:flex;align-items:flex-start;gap:10px;}
.note .ic{font-size:16px;flex:0 0 16px;margin-top:2px;}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;height:calc(64px + var(--safe-bottom));background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;border-top:1px solid rgba(226,232,240,.6);padding-bottom:var(--safe-bottom);}
.nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:10px;font-weight:500;transition:color .2s ease;cursor:pointer;}
.nav .tab .ic{font-size:22px;transition:transform .2s ease;}
.nav .tab.active{color:var(--pri);font-weight:600;}
.nav .tab.active::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--pri);margin-top:2px;}
.nav .tab.active .ic{transform:translateY(-2px);}

.toast-host{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
.toast{background:rgba(30,41,59,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:10px 20px;border-radius:var(--r-full);font-size:13px;font-weight:500;max-width:90%;text-align:center;opacity:0;transform:translateY(-10px);transition:all .25s cubic-bezier(.22,1,.36,1);box-shadow:0 8px 24px rgba(0,0,0,.12);}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:rgba(22,163,74,.92);}
.toast.warning{background:rgba(245,158,11,.92);}
.toast.danger{background:rgba(220,38,38,.92);}

.pill-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:var(--r-full);font-size:11px;font-weight:600;letter-spacing:.2px;}
.pill-badge.pending{background:var(--warning-bg);color:var(--warning);}
.pill-badge.approved{background:var(--success-bg);color:var(--success);}
.pill-badge.rejected{background:var(--danger-bg);color:var(--danger);}
.pill-badge.none{background:var(--bg);color:var(--text-3);}
</style>
</head>
<body>
<div class="hero anim-in">
  <h1>😊 人脸识别</h1>
  <div class="sub">上传人脸照片，审核通过后可刷脸开门</div>
</div>

<div class="wrap">
  <!-- Status Card -->
  <div class="status-card anim-in anim-d1" id="statusCard">
    <img class="face-preview" id="facePreview" alt="人脸照片">
    <div class="status-icon none" id="statusIcon">📷</div>
    <div class="status-text" id="statusText">加载中...</div>
    <div class="status-desc" id="statusDesc"></div>
  </div>

  <!-- Upload Section -->
  <div class="upload-section anim-in anim-d2" id="uploadSection">
    <div class="upload-area" id="uploadArea">
      <span class="emoji">📷</span>
      <span>点击上传人脸照片</span>
      <span style="font-size:11px;">支持 JPG/PNG，正面免冠照</span>
      <input type="file" id="faceFileInput" accept="image/jpeg,image/png,image/jpg">
    </div>
    <button id="btnUpload" class="btn btn-md btn-primary btn-block">上传人脸照片</button>
  </div>

  <!-- Re-upload (shown when rejected or already uploaded) -->
  <div class="upload-section anim-in anim-d3" id="reuploadSection" style="display:none;">
    <div class="upload-section-title">重新上传</div>
    <div class="upload-area" id="reuploadArea">
      <span class="emoji">🔄</span>
      <span>点击重新上传人脸照片</span>
      <span style="font-size:11px;">支持 JPG/PNG，正面免冠照</span>
      <input type="file" id="reuploadFileInput" accept="image/jpeg,image/png,image/jpg">
    </div>
    <button id="btnReupload" class="btn btn-md btn-ghost btn-block">重新上传</button>
  </div>

  <!-- Note -->
  <div class="note anim-in anim-d4">
    <span class="ic">💡</span>
    <span>人脸信息经物业审核通过后，可用于刷脸开门。请上传本人正面免冠照片，光线充足、背景简洁，审核通常在1-3个工作日内完成。</span>
  </div>
</div>

<div class="toast-host" id="toastHost"></div>

<nav class="nav">
  <div class="tab" data-go="index.html"><span class="ic">🏠</span><span>首页</span></div>
  <div class="tab" data-go="access.html"><span class="ic">🚪</span><span>门禁</span></div>
  <div class="tab" data-go="bills.html"><span class="ic">📋</span><span>账单</span></div>
  <div class="tab active" data-go="bind.html"><span class="ic">👤</span><span>我的</span></div>
</nav>

<script>
const $=id=>document.getElementById(id);
const API="/api/property/owner";
function toast(m,t){const h=$("toastHost");if(!h)return;const e=document.createElement("div");e.className="toast "+(t||"");e.textContent=m;h.appendChild(e);requestAnimationFrame(()=>e.classList.add("show"));setTimeout(()=>{e.classList.remove("show");setTimeout(()=>e.remove(),220)},2400)}

const tk=localStorage.getItem("property_owner_token");
if(!tk){location.href="login.html"}

async function req(path,method,body,isFormData){
  const h={};const token=localStorage.getItem("property_owner_token");
  if(token)h["X-Owner-Token"]=token;
  const o={method:method||"GET",headers:h};
  if(isFormData){
    o.body=body;
  }else if(body&&method!=="GET"){
    h["Content-Type"]="application/x-www-form-urlencoded";
    const sp=new URLSearchParams();
    Object.keys(body).forEach(function(k){ const v=body[k]; if(v!=null) sp.append(k,v); });
    o.body=sp.toString();
  }
  try{
    const r=await fetch(API+path,o).then(r=>r.json());
    if(r.code===401){localStorage.removeItem("property_owner_token");toast("登录已过期，请重新登录","warning");setTimeout(()=>{location.href="login.html"},1500)}
    return r;
  }catch(e){return{code:-1,msg:e.message}}
}
const get=p=>req(p,"GET");
const postFormData=(p,fd)=>req(p,"POST",fd,true);

let _selectedFile=null;
let _reuploadFile=null;

// File input handlers
$("faceFileInput").addEventListener("change",function(){
  const file=this.files[0];
  if(!file)return;
  _selectedFile=file;
  const area=$("uploadArea");
  area.classList.add("has-file");
  // Show preview
  const reader=new FileReader();
  reader.onload=function(e){
    area.innerHTML='<img class="preview-img" src="'+e.target.result+'" alt="preview"><input type="file" id="faceFileInput" accept="image/jpeg,image/png,image/jpg">';
    $("faceFileInput").addEventListener("change",arguments.callee);
  };
  reader.readAsDataURL(file);
  toast("照片已选择","success");
});

$("reuploadFileInput").addEventListener("change",function(){
  const file=this.files[0];
  if(!file)return;
  _reuploadFile=file;
  const area=$("reuploadArea");
  area.classList.add("has-file");
  const reader=new FileReader();
  reader.onload=function(e){
    area.innerHTML='<img class="preview-img" src="'+e.target.result+'" alt="preview"><input type="file" id="reuploadFileInput" accept="image/jpeg,image/png,image/jpg">';
    $("reuploadFileInput").addEventListener("change",arguments.callee);
  };
  reader.readAsDataURL(file);
  toast("照片已选择","success");
});

// Upload handler using FormData
async function doUpload(btnId,isReupload){
  const file=isReupload?_reuploadFile:_selectedFile;
  if(!file){toast("请先选择照片","warning");return}
  const btn=$(btnId);
  btn.disabled=true;btn.textContent="上传中...";
  try{
    const fd=new FormData();
    fd.append("file",file);
    const r=await postFormData("/p1/face/upload",fd);
    if(r.code===0){
      toast("上传成功，等待审核","success");
      _selectedFile=null;_reuploadFile=null;
      loadFaceStatus();
    }else{
      toast(r.msg||"上传失败","danger");
    }
  }catch(e){
    toast("网络异常："+(e.message||"请稍后再试"),"danger");
  }
  btn.disabled=false;btn.textContent=isReupload?"重新上传":"上传人脸照片";
}

$("btnUpload").addEventListener("click",function(){doUpload("btnUpload",false)});
$("btnReupload").addEventListener("click",function(){doUpload("btnReupload",true)});

// Load face status
async function loadFaceStatus(){
  const r=await get("/p1/face/status");
  const icon=$("statusIcon");
  const text=$("statusText");
  const desc=$("statusDesc");
  const preview=$("facePreview");

  if(r.code===0&&r.data){
    const d=r.data;
    const st=d.status||d.auditStatus||"none";

    // Show face image if available
    if(d.faceUrl||d.imageUrl||d.photoUrl){
      preview.src=d.faceUrl||d.imageUrl||d.photoUrl;
      preview.style.display="block";
      icon.style.display="none";
    }else{
      preview.style.display="none";
      icon.style.display="flex";
    }

    if(st==="pending"||st==="auditing"){
      icon.className="status-icon pending";icon.textContent="⏳";
      text.textContent="待审核";
      desc.textContent="您的人脸照片已提交，物业正在审核中，请耐心等待。";
      $("uploadSection").style.display="none";
      $("reuploadSection").style.display="none";
    }else if(st==="approved"||st==="passed"){
      icon.className="status-icon approved";icon.textContent="✅";
      text.textContent="已通过";
      desc.textContent="人脸信息审核已通过，您可以使用刷脸开门功能。";
      $("uploadSection").style.display="none";
      $("reuploadSection").style.display="block";
      resetReuploadArea();
    }else if(st==="rejected"||st==="failed"){
      icon.className="status-icon rejected";icon.textContent="❌";
      text.textContent="已驳回";
      desc.textContent="人脸照片未通过审核，原因："+(d.reason||d.rejectReason||"照片不清晰或非本人")+"。请重新上传。";
      $("uploadSection").style.display="block";
      $("reuploadSection").style.display="none";
      resetUploadArea();
    }else{
      icon.className="status-icon none";icon.textContent="📷";
      text.textContent="未上传";
      desc.textContent="您尚未上传人脸照片，上传审核通过后可刷脸开门。";
      $("uploadSection").style.display="block";
      $("reuploadSection").style.display="none";
    }
  }else{
    preview.style.display="none";
    icon.style.display="flex";
    icon.className="status-icon none";icon.textContent="📷";
    text.textContent="未上传";
    desc.textContent="您尚未上传人脸照片，上传审核通过后可刷脸开门。";
    $("uploadSection").style.display="block";
    $("reuploadSection").style.display="none";
  }
}

function resetUploadArea(){
  _selectedFile=null;
  $("uploadArea").classList.remove("has-file");
  $("uploadArea").innerHTML='<span class="emoji">📷</span><span>点击上传人脸照片</span><span style="font-size:11px;">支持 JPG/PNG，正面免冠照</span><input type="file" id="faceFileInput" accept="image/jpeg,image/png,image/jpg">';
  $("faceFileInput").addEventListener("change",function(){
    const file=this.files[0];if(!file)return;_selectedFile=file;
    const area=$("uploadArea");area.classList.add("has-file");
    const reader=new FileReader();
    reader.onload=function(e){area.innerHTML='<img class="preview-img" src="'+e.target.result+'" alt="preview"><input type="file" id="faceFileInput" accept="image/jpeg,image/png,image/jpg">';};
    reader.readAsDataURL(file);toast("照片已选择","success");
  });
}

function resetReuploadArea(){
  _reuploadFile=null;
  $("reuploadArea").classList.remove("has-file");
  $("reuploadArea").innerHTML='<span class="emoji">🔄</span><span>点击重新上传人脸照片</span><span style="font-size:11px;">支持 JPG/PNG，正面免冠照</span><input type="file" id="reuploadFileInput" accept="image/jpeg,image/png,image/jpg">';
  $("reuploadFileInput").addEventListener("change",function(){
    const file=this.files[0];if(!file)return;_reuploadFile=file;
    const area=$("reuploadArea");area.classList.add("has-file");
    const reader=new FileReader();
    reader.onload=function(e){area.innerHTML='<img class="preview-img" src="'+e.target.result+'" alt="preview"><input type="file" id="reuploadFileInput" accept="image/jpeg,image/png,image/jpg">';};
    reader.readAsDataURL(file);toast("照片已选择","success");
  });
}

// Nav
document.querySelectorAll(".nav .tab").forEach(el=>el.addEventListener("click",()=>{
  const h=el.dataset.go;if(h)location.href=h;
}));

loadFaceStatus();
</script>
</body>
</html>
