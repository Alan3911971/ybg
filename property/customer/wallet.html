<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>我的钱包 · 我的物业</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E💰%3C/text%3E%3C/svg%3E">
<style>
:root{
  --pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5,#7c3aed);--pri-bg:#eef2ff;
  --text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
  --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;
  --shadow-card:0 2px 12px rgba(0,0,0,.04);
  --r-md:14px;--r-lg:20px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --success:#10b981;--ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);font-size:15px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.app-shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);}
.hero{background:var(--pri-grad);color:#fff;padding:44px 24px 28px;position:relative;overflow:hidden;border-radius:0 0 var(--r-lg) var(--r-lg);}
.hero::before{content:"";position:absolute;top:-60px;right:-40px;width:200px;height:200px;background:rgba(255,255,255,.08);border-radius:50%;}
.hero h1{font-size:22px;font-weight:800;position:relative;z-index:1;}
.hero .sub{font-size:13px;opacity:.85;margin-top:6px;position:relative;z-index:1;}
.content{padding:16px 20px calc(40px + var(--safe-bottom));}
.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-card);margin-bottom:16px;animation:fadeInUp .35s var(--ease) both;}
.balance-card{text-align:center;padding:30px 20px;background:var(--pri-grad);color:#fff;border-radius:var(--r-lg);margin-bottom:16px;box-shadow:0 8px 24px rgba(79,70,229,.25);}
.balance-label{font-size:13px;opacity:.85;}
.balance-num{font-size:42px;font-weight:800;margin-top:8px;}
.balance-unit{font-size:18px;font-weight:600;margin-left:4px;opacity:.9;}
.tip-box{font-size:13px;color:var(--text-2);line-height:1.7;padding:12px;background:var(--bg);border-radius:var(--r-md);}
.form-label{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;}
.form-input{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:15px;background:#fff;transition:border-color .2s;margin-bottom:14px;}
.form-input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
.btn{width:100%;height:48px;border-radius:var(--r-md);font-size:15px;font-weight:700;transition:all .2s var(--ease);}
.btn:active{transform:scale(.98);}
.btn-pri{background:var(--pri-grad);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3);}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="hero">
    <h1>💰 我的钱包</h1>
    <div class="sub">物业钱包余额 · 缴费自动抵扣</div>
  </div>
  <div class="content">

    <div class="card" id="stepPhone">
      <span class="form-label">请输入业主手机号</span>
      <input class="form-input" id="phone" type="tel" maxlength="11" placeholder="查询您的物业钱包余额">
      <button class="btn btn-pri" onclick="loadWallet()">查询余额</button>
    </div>

    <div class="hidden" id="stepResult">
      <div class="balance-card">
        <div class="balance-label">当前可用余额</div>
        <div class="balance-num">¥<span id="balanceNum">0.00</span></div>
      </div>
      <div class="card">
        <div class="form-label">分账待结算</div>
        <div class="tip-box">
          商家消费分账待结算：¥<span id="pendingNum">0.00</span><br>
          <span style="color:var(--text-3);">商家消费分账定期结算后自动转入可用余额</span>
        </div>
      </div>
      <div class="card">
        <div class="form-label">分账明细</div>
        <div id="splitRecords" style="font-size:13px;color:var(--text-2);">加载中...</div>
      </div>
      <div class="card">
        <div class="form-label">余额说明</div>
        <div class="tip-box">
          ✅ 余额来自开盲盒抽奖中奖<br>
          ✅ 缴费时自动抵扣，无需手动操作<br>
          ✅ 余额仅限本物业公司使用<br>
          ✅ 余额不可提现、不可转让
        </div>
      </div>
    </div>

  </div>
</div>
<script>
var params=new URLSearchParams(location.search);
var companyId=params.get('companyId')||1;

function api(path){
  return fetch(path).then(function(r){return r.json();});
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function loadWallet(){
  var phone=document.getElementById('phone').value.trim();
  if(!/^1\d{10}$/.test(phone)){alert('请输入正确的 11 位手机号');return;}
  api('/api/property/pay-qr/wallet?companyId='+companyId+'&phone='+phone).then(function(res){
    if(res.code!==0){alert(res.msg||'查询失败');return;}
    document.getElementById('balanceNum').textContent=Number(res.data.balance).toFixed(2);
    document.getElementById('pendingNum').textContent=Number(res.data.pendingSplit||0).toFixed(2);
    document.getElementById('stepPhone').classList.add('hidden');
    document.getElementById('stepResult').classList.remove('hidden');
    // 加载分账明细
    api('/api/property/pay-qr/wallet/records?companyId='+companyId+'&phone='+phone).then(function(r){
      if(r.code!==0){document.getElementById('splitRecords').textContent='暂无记录';return;}
      var list=r.data||[];
      if(!list.length){document.getElementById('splitRecords').textContent='暂无分账记录';return;}
      var html='';
      list.forEach(function(rec){
        var statusText=rec.splitStatus===1?'已结算':(rec.splitStatus===3?'已退款':'待结算');
        html+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">'+
          '<div><div style="font-weight:600;">'+esc(rec.merchantNo||'商家')+'</div>'+
          '<div style="font-size:12px;color:var(--text-3);">'+(rec.createTime||'').substring(0,10)+' · 订单 ¥'+Number(rec.orderAmount||0).toFixed(2)+'</div></div>'+
          '<div style="text-align:right;"><div style="font-weight:700;color:var(--success);">+¥'+Number(rec.splitAmount||0).toFixed(2)+'</div>'+
          '<div style="font-size:12px;color:var(--text-3);">'+statusText+'</div></div></div>';
      });
      document.getElementById('splitRecords').innerHTML=html;
    });
  }).catch(function(){alert('网络异常');});
}
</script>
</body>
</html>
