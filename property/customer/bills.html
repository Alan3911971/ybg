<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>缴费 · 我的物业</title>
<style>
:root{--pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5,#7c3aed);--pri-bg:#eef2ff;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--shadow-card:0 2px 12px rgba(0,0,0,.04);--r-md:14px;--r-lg:20px;--r-full:999px;--safe-bottom:env(safe-area-inset-bottom,0px);--success:#16a34a;--success-bg:#ecfdf5;--warning:#f59e0b;--warning-bg:#fffbeb;--danger:#dc2626;--danger-bg:#fef2f2;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;}
body{min-height:100vh;padding-bottom:calc(112px + var(--safe-bottom));max-width:480px;margin:0 auto;}
a{color:inherit;text-decoration:none;}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.hd{background:var(--pri-grad);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 20px;border-radius:0 0 var(--r-lg) var(--r-lg);position:relative;overflow:hidden;}
.hd::after{content:"";position:absolute;top:-60px;right:-40px;width:170px;height:170px;background:rgba(255,255,255,.08);border-radius:50%;}
.hd .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
.hd .back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:17px;}
.hd h1{font-size:18px;font-weight:700;flex:1;}
.hd .tag{font-size:11px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:var(--r-full);}
.hd .meta{font-size:11.5px;opacity:.85;margin-top:7px;position:relative;z-index:1;}
.wrap{padding:0 16px;}
.card{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow-card);margin-top:12px;padding:14px;}
.card .ct{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.billbox{margin:-18px 16px 0;background:#fff;border-radius:var(--r-md);box-shadow:0 6px 20px rgba(79,70,229,.12);padding:18px 16px;position:relative;z-index:2;}
.billbox .due{display:inline-block;font-size:11px;background:var(--warning-bg);color:#b45309;padding:4px 10px;border-radius:var(--r-full);font-weight:600;}
.billbox .nm{font-size:14px;font-weight:600;margin-top:10px;line-height:1.5;}
.billbox .amt{font-size:34px;font-weight:800;color:var(--pri);font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:-1px;margin-top:4px;}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
.rowline:last-child{border-bottom:none;}
.rowline .k{color:var(--text-2);}
.rowline .v{font-weight:600;font-variant-numeric:tabular-nums;}
.rowline .v.cut{color:var(--success);}
.rowline .v.off{color:var(--text-3);font-weight:500;}
.rowline .v.big{font-size:19px;font-weight:800;color:var(--pri);}
.rowline .why{display:block;font-size:11px;color:var(--text-3);margin-top:3px;font-weight:400;}
.sub{font-size:11px;color:var(--text-3);padding:7px 0 0;line-height:1.6;}
.drawrow{display:flex;align-items:center;gap:10px;background:var(--pri-bg);border-radius:12px;padding:12px;margin-top:10px;}
.drawrow .ic{width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 36px;}
.drawrow .info{flex:1;min-width:0;}
.drawrow .tt{font-size:13.5px;font-weight:700;color:#4338ca;}
.drawrow .dd{font-size:11.5px;color:#6366f1;margin-top:2px;line-height:1.5;}
.drawrow .btn{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#fff;background:var(--pri-grad);padding:8px 14px;border-radius:var(--r-full);}
.won{display:flex;align-items:center;gap:10px;background:var(--success-bg);border-radius:12px;padding:12px;margin-top:10px;}
.won .ic{width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 36px;}
.won .info{flex:1;min-width:0;}
.won .tt{font-size:13.5px;font-weight:700;color:#15803d;}
.won .dd{font-size:11.5px;color:#166534;margin-top:2px;}
.won .amt{font-size:17px;font-weight:800;color:#15803d;font-family:ui-monospace,Menlo,Consolas,monospace;flex:0 0 auto;}
.note{font-size:12.5px;color:var(--text-2);line-height:1.7;margin-top:10px;}
.empty{text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px;line-height:1.7;}
.empty .big{font-size:34px;margin-bottom:10px;}
.paybar{position:fixed;left:0;right:0;bottom:calc(58px + var(--safe-bottom));max-width:480px;margin:0 auto;padding:10px 16px;background:rgba(255,255,255,.96);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:40;}
.paybar .amt{font-size:20px;font-weight:800;color:var(--pri);font-family:ui-monospace,Menlo,Consolas,monospace;}
.paybar .amt small{font-size:11px;color:var(--text-3);font-weight:500;display:block;font-family:inherit;}
.paybar .btn{flex:1;height:44px;border-radius:var(--r-full);background:var(--pri-grad);color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 16px rgba(79,70,229,.28);}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;padding:7px 0 calc(7px + var(--safe-bottom));z-index:50;}
.tabbar a{flex:1;text-align:center;font-size:11px;color:var(--text-3);}
.tabbar a .ic{font-size:19px;display:block;margin-bottom:2px;}
.tabbar a.on{color:var(--pri);font-weight:600;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:rgba(17,24,39,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:var(--r-full);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:78%;text-align:center;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="hd">
  <div class="row"><a class="back" href="index.html">‹</a><h1 id="h1">缴费</h1><span class="tag">平台代收</span></div>
  <div class="meta" id="meta">加载中…</div>
</div>

<div id="main">
  <div class="billbox" style="display:none" id="billBox">
    <span class="due" id="dueTag">—</span>
    <div class="nm" id="billNm">加载中…</div>
    <div class="amt" id="billAmt">￥0.00</div>
  </div>

  <div class="wrap">
    <div class="card" id="cutCard" style="display:none">
      <div class="ct">💰 钱包余额抵扣 · 自动</div>
      <div id="cutRows"></div>
      <div class="sub" id="cutSub"></div>
    </div>

    <div class="card" id="drawCard" style="display:none">
      <div class="ct">🎁 缴费前抽一次 · 小区商户出奖</div>
      <div class="drawrow" id="drawRow">
        <div class="ic">🎁</div>
        <div class="info"><div class="tt">还有抽奖机会</div><div class="dd">中奖直接抵进本单，不用先付后返</div></div>
        <button class="btn" id="btnDraw" onclick="drawOnce()">抽一次</button>
      </div>
      <div id="wonBox"></div>
      <div class="note" id="drawNote">这一种是<b>立减</b>（当场少付现金），不是钱包里的抵扣券——两种奖走两个口袋。</div>
    </div>

    <div class="card" id="sumCard" style="display:none">
      <div class="ct">🧾 实付怎么算出来的</div>
      <div id="sumRows"></div>
      <div class="note">微信 / 支付宝 / 前台现金 · 平台代收、物业月结 · 缴完在「我的」看凭证。</div>
    </div>

    <div class="card">
      <div class="ct">❓ 余额怎么来的</div>
      <div class="note">小区商户分账（你每单消费的 8%）+ 抽盒中奖 + 推荐商家奖励。这些钱<b>只能抵物业费</b>，不能提现、不能转赠、不能拿去买东西——两个口袋分开记，账才对得上。</div>
    </div>
  </div>
</div>

<div class="paybar" id="paybar" style="display:none">
  <div class="amt" id="barAmt">￥0.00<small id="barSub">实付</small></div>
  <button class="btn" id="btnPay">确认支付</button>
</div>

<div class="tabbar">
  <a href="index.html"><span class="ic">🏠</span>首页</a>
  <a href="mall.html"><span class="ic">🛒</span>商城</a>
  <a href="group.html"><span class="ic">💬</span>消息</a>
  <a href="mine.html" class="on"><span class="ic">👤</span>我的</a>
</div>
<div class="toast" id="toast"></div>

<script>
var TOKEN = localStorage.getItem("property_owner_token") || "";
function $(id){return document.getElementById(id)}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200)}
function money(n){return "￥" + (Number(n||0)).toFixed(2)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({"X-Owner-Token":TOKEN},opt.headers||{});return fetch(path,opt).then(function(r){return r.json()})}

var BILL = null, WALLET = null, DRAW_CUT = 0, BUSY = false;

function load(){
  api("/api/property/owner/bills").then(function(r){
    if(r.code !== 0){ toast(r.msg||"加载失败"); $("meta").textContent = r.msg||"加载失败"; return }
    var list = (r.data||[]).filter(function(b){ return b.status === 0 || b.status == null });
    if(!list.length){
      list = (r.data||[]).slice().sort(function(a,b){ return String(a.dueDate||"").localeCompare(String(b.dueDate||"")) });
    }
    if(!list.length){
      $("main").innerHTML = '<div class="empty"><div class="big">🧾</div>当前没有待缴账单<br>缴物业费还能得 1 次抽奖机会</div>';
      $("meta").textContent = "暂无待缴账单";
      return;
    }
    BILL = list[0];
    render();
    return api("/api/property/mall/mine");
  }).then(function(r){
    if(!r || r.code !== 0) return;
    WALLET = (r.data && r.data.propertyWallet) || {balance:0, usableNow:0, nextMonth:0};
    render();
  }).catch(function(){ toast("网络异常") });
}

function render(){
  if(!BILL) return;
  var period = BILL.billPeriod || "";
  $("h1").textContent = "缴费 " + period;
  $("meta").textContent = (BILL.billNo ? BILL.billNo + " · " : "") + "阳光花园 · 平台代收";
  $("billBox").style.display = "";
  $("dueTag").textContent = BILL.dueDate ? (BILL.dueDate + " 到期") : "待缴";
  $("billNm").textContent = period.replace("-", " 年 ").replace(/-$/,"") + " 月物业费 · " + (BILL.roomId || "");
  var amount = Number(BILL.amount||0) - Number(BILL.paid||0);
  amount = Math.max(0, amount);
  $("billAmt").textContent = money(amount);

  var usable = WALLET ? Number(WALLET.usableNow||0) : 0;
  var cut = Math.min(usable, amount);
  $("cutCard").style.display = "";
  var h = "";
  h += '<div class="rowline"><span class="k">钱包余额（本月可用）<span class="why">分账 / 抽奖 / 推荐奖励累计</span></span><span class="v">' + money(usable) + '</span></div>';
  if(WALLET && Number(WALLET.nextMonth||0) > 0){
    h += '<div class="rowline"><span class="k">次月才生效<span class="why">当月新进的钱，次月账单才能抵</span></span><span class="v off">' + money(WALLET.nextMonth) + '</span></div>';
  }
  h += '<div class="rowline"><span class="k">本次抵扣</span><span class="v cut">-' + money(cut) + '</span></div>';
  $("cutRows").innerHTML = h;
  $("cutSub").textContent = usable > amount
    ? "本月可用额度 " + money(usable) + "，本单只需抵 " + money(cut) + "，剩下的留到下次账单。"
    : "本月可用额度 " + money(usable) + "；另有 " + money(WALLET ? WALLET.nextMonth : 0) + " 是当月刚进的，次月账单才能抵。";

  $("drawCard").style.display = "";
  $("sumCard").style.display = "";

  var s = "";
  s += '<div class="rowline"><span class="k">账单金额</span><span class="v">' + money(amount) + '</span></div>';
  s += '<div class="rowline"><span class="k">钱包抵扣</span><span class="v cut">-' + money(cut) + '</span></div>';
  if(DRAW_CUT > 0){
    s += '<div class="rowline"><span class="k">抽盒立减</span><span class="v cut">-' + money(DRAW_CUT) + '</span></div>';
  }
  var pay = Math.max(0, amount - cut - DRAW_CUT);
  s += '<div class="rowline"><span class="k">实付（' + money(amount) + ' − ' + money(cut) + (DRAW_CUT>0 ? ' − ' + money(DRAW_CUT) : '') + '）</span><span class="v big">' + money(pay) + '</span></div>';
  $("sumRows").innerHTML = s;
  $("paybar").style.display = "";
  $("barAmt").innerHTML = money(pay) + '<small>实付</small>';
  $("btnPay").textContent = "确认支付 " + money(pay);
  $("btnPay").onclick = function(){ toast("支付链路接微信商户号后开放，当前为演示态") };
}

function drawOnce(){
  if(BUSY) return;
  BUSY = true; $("btnDraw").textContent = "抽奖中…";
  api("/api/property/draw/run?count=1", {method:"POST"}).then(function(r){
    BUSY = false; $("btnDraw").textContent = "再抽一次";
    if(r.code !== 0){ toast(r.msg || "没有可抽次数了"); return }
    var res = (r.data.results||[])[0] || {};
    if(Number(res.value) > 0 && !res.toWallet){
      DRAW_CUT = Number(res.value);
      $("wonBox").innerHTML = '<div class="won"><div class="ic">' + (res.emoji||"🎉") + '</div>'
        + '<div class="info"><div class="tt">已抽中 · 立减 ' + money(res.value) + '</div>'
        + '<div class="dd">' + esc(res.typeName) + ' · 券号 ' + esc(res.couponNo||"—") + ' · 已直接抵进本单</div></div>'
        + '<div class="amt">已抵</div></div>';
      $("drawRow").style.display = "none";
      render();
    } else if(res.toWallet){
      toast("抽中 " + money(res.value) + " 抵扣券，已进钱包——下月账单抵，本单不减");
    } else {
      toast("这次没中，本单金额不变");
    }
  }).catch(function(){ BUSY=false; $("btnDraw").textContent="抽一次"; toast("网络异常") });
}

load();
</script>
</body>
</html>
