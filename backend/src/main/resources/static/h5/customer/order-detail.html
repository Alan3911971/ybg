<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>订单详情</title>
<style>
:root{
  --c-primary:#e85d3a;--c-primary-light:#fff0ea;
  --c-accent:#f7a072;--c-gold:#e8a838;
  --c-success:#2d8a4e;--c-success-light:#e8f5ec;
  --c-text:#1a1a2e;--c-text-2:#4a4a68;--c-text-3:#9b9bb0;
  --c-bg:#f0f0f5;--c-surface:#fff;
  --c-border:#e4e4ec;--c-divider:#ededf2;
  --sh-card:0 4px 16px rgba(30,30,60,.06);
  --sh-hover:0 8px 24px rgba(30,30,60,.1);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--c-text);background:var(--c-bg);
  -webkit-font-smoothing:antialiased;font-size:15px;
}
body{min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom));}

/* 顶部导航 */
.nav-bar{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(145deg,#1a1a2e 0%,#16213e 40%,#0f3460 100%);
  padding:calc(12px + env(safe-area-inset-top)) 16px 14px;
  display:flex;align-items:center;gap:12px;
  color:#fff;
}
.nav-bar .back{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;transition:background .2s;
}
.nav-bar .back:active{background:rgba(255,255,255,.2);}
.nav-bar .title{font-size:17px;font-weight:700;letter-spacing:.5px;}

/* 状态头部 */
.status-header{
  background:linear-gradient(145deg,#1a1a2e 0%,#16213e 40%,#0f3460 100%);
  color:#fff;padding:8px 20px 32px;position:relative;overflow:hidden;
}
.status-header::before{
  content:"";position:absolute;top:-60px;right:-40px;
  width:180px;height:180px;
  background:radial-gradient(circle,rgba(232,93,58,.25) 0%,transparent 70%);
  border-radius:50%;
}
.status-header .status-icon{
  width:56px;height:56px;border-radius:50%;
  background:rgba(45,138,78,.2);border:2px solid rgba(45,138,78,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:12px;position:relative;z-index:1;
}
.status-header .status-text{font-size:22px;font-weight:800;position:relative;z-index:1;}
.status-header .order-no{
  margin-top:6px;font-size:12px;color:rgba(255,255,255,.55);
  position:relative;z-index:1;letter-spacing:.3px;
}

/* 内容容器 */
.container{max-width:560px;margin:0 auto;padding:0 14px;margin-top:-18px;position:relative;z-index:2;}

/* 卡片 */
.card{
  background:var(--c-surface);border-radius:var(--radius);
  box-shadow:var(--sh-card);padding:18px 16px;margin-bottom:12px;
}
.card-title{
  font-size:14px;font-weight:700;color:var(--c-text);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.card-title::before{
  content:"";width:4px;height:16px;border-radius:2px;
  background:linear-gradient(180deg,var(--c-primary),var(--c-accent));
}

/* 金额展示 */
.amount-hero{
  text-align:center;padding:8px 0 16px;
}
.amount-hero .label{font-size:13px;color:var(--c-text-3);margin-bottom:6px;}
.amount-hero .value{
  font-size:36px;font-weight:800;color:var(--c-primary);
  letter-spacing:-1px;
}
.amount-hero .value .symbol{font-size:20px;margin-right:2px;}

/* 明细行 */
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;font-size:14px;
}
.detail-row + .detail-row{border-top:1px dashed var(--c-divider);}
.detail-row .label{color:var(--c-text-3);}
.detail-row .value{color:var(--c-text);font-weight:500;}
.detail-row .value.highlight{color:var(--c-primary);font-weight:700;}
.detail-row .value.success{color:var(--c-success);font-weight:600;}

/* 标签 */
.tag{
  display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:600;
}
.tag.success{background:var(--c-success-light);color:var(--c-success);}
.tag.primary{background:var(--c-primary-light);color:var(--c-primary);}
.tag.gray{background:#f0f0f5;color:var(--c-text-3);}

/* 底部操作栏 */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--c-surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 16px rgba(30,30,60,.06);
  display:flex;gap:10px;
}
.btn{
  flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;
  border:none;cursor:pointer;transition:all .2s;
}
.btn:active{transform:scale(.98);}
.btn-outline{
  background:#fff;color:var(--c-primary);
  border:1.5px solid var(--c-primary);
}
.btn-primary{
  background:linear-gradient(135deg,var(--c-primary),var(--c-accent));
  color:#fff;box-shadow:0 4px 12px rgba(232,93,58,.3);
}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* 空状态 */
.empty{
  text-align:center;padding:60px 20px;color:var(--c-text-3);
}
.empty .icon{font-size:48px;margin-bottom:16px;opacity:.4;}
.empty .text{font-size:14px;}

/* toast */
.toast-host{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:10px 18px;border-radius:999px;
  background:rgba(26,26,46,.9);color:#fff;font-size:13px;
  opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;
  font-weight:500;
}
.toast.show{opacity:1;transform:none;}
.toast.success{background:#2d8a4e;}
.toast.danger{background:#c4483a;}
</style>
</head>
<body>

<div class="toast-host" id="toastHost"></div>

<!-- 顶部导航 -->
<div class="nav-bar">
  <div class="back" onclick="history.back()">‹</div>
  <div class="title">订单详情</div>
</div>

<!-- 状态头部 -->
<div class="status-header" id="statusHeader">
  <div class="status-icon" id="statusIcon">✓</div>
  <div class="status-text" id="statusText">已完成</div>
  <div class="order-no" id="orderNo">订单号：--</div>
</div>

<!-- 内容 -->
<div class="container" id="content">
  <div class="empty" id="emptyState">
    <div class="icon">📦</div>
    <div class="text">加载中...</div>
  </div>
</div>

<!-- 底部操作栏 -->
<div class="bottom-bar" id="bottomBar" style="display:none;">
  <button class="btn btn-primary" id="btnRefund" onclick="doRefund()">申请退款</button>
</div>

<script>
function $(id){return document.getElementById(id)}
function toast(msg,type){
  var host=$("toastHost");
  var t=document.createElement("div");
  t.className="toast "+(type||"");
  t.textContent=msg;
  host.appendChild(t);
  requestAnimationFrame(function(){t.classList.add("show")});
  setTimeout(function(){t.classList.remove("show");setTimeout(function(){t.remove()},200)},2000);
}

function getQuery(name){
  var m=location.search.match(new RegExp("[?&]"+name+"=([^&]*)"));
  return m?decodeURIComponent(m[1]):"";
}

async function loadOrderDetail(){
  var orderNo=getQuery("orderNo");
  if(!orderNo){$("emptyState").querySelector(".text").textContent="缺少订单号";return}
  
  var tk=localStorage.getItem("ibigou_user_token");
  var ph=localStorage.getItem("ibigou_phone");
  if(!tk||!ph){$("emptyState").querySelector(".text").textContent="请先登录";return}
  
  try{
    var resp=await fetch("/api/customer/ibigou/orders/"+ph,{headers:{"X-User-Token":tk}});
    var r=await resp.json();
    if(r.code!==0||!r.data){$("emptyState").querySelector(".text").textContent="加载失败";return}
    
    var order=r.data.find(function(o){return o.ibigouOrderNo===orderNo});
    if(!order){$("emptyState").querySelector(".text").textContent="订单不存在";return}
    
    renderDetail(order);
  }catch(e){
    $("emptyState").querySelector(".text").textContent="网络错误";
  }
}

function renderDetail(o){
  $("emptyState").style.display="none";
  
  // 状态
  var statusText,statusIcon,statusColor;
  if(o.refundStatus===1){statusText="已退款";statusIcon="↩";statusColor="rgba(155,155,176,.2)";borderColor="rgba(155,155,176,.4)"}
  else if(o.refundStatus===2){statusText="部分退款";statusIcon="↩";statusColor="rgba(232,168,56,.2)";borderColor="rgba(232,168,56,.4)"}
  else{statusText="已完成";statusIcon="✓";statusColor="rgba(45,138,78,.2)";borderColor="rgba(45,138,78,.4)"}
  
  $("statusText").textContent=statusText;
  $("statusIcon").textContent=statusIcon;
  $("statusIcon").style.background=statusColor;
  $("statusIcon").style.borderColor=borderColor;
  $("orderNo").textContent="订单号："+o.ibigouOrderNo;
  
  // 金额卡片
  var amountCard='<div class="card"><div class="amount-hero">'
    +'<div class="label">实付金额</div>'
    +'<div class="value"><span class="symbol">¥</span>'+(o.payAmount||0).toFixed(2)+'</div>'
    +'</div></div>';
  
  // 订单信息卡片
  var infoCard='<div class="card"><div class="card-title">订单信息</div>'
    +'<div class="detail-row"><span class="label">订单金额</span><span class="value">¥'+o.orderAmount.toFixed(2)+'</span></div>'
    +'<div class="detail-row"><span class="label">实付金额</span><span class="value highlight">¥'+(o.payAmount||0).toFixed(2)+'</span></div>'
    +'<div class="detail-row"><span class="label">余额抵扣</span><span class="value">¥'+(o.deductBalance||0).toFixed(2)+'</span></div>'
    +'<div class="detail-row"><span class="label">优惠券</span><span class="value">'+(o.couponId?'已使用':'未使用')+'</span></div>'
    +'</div>';
  
  // 时间信息卡片
  var timeCard='<div class="card"><div class="card-title">时间信息</div>'
    +'<div class="detail-row"><span class="label">下单时间</span><span class="value">'+((o.createTime||"").replace("T"," ").slice(0,16))+'</span></div>'
    +(o.payTime?'<div class="detail-row"><span class="label">支付时间</span><span class="value">'+((o.payTime||"").replace("T"," ").slice(0,16))+'</span></div>':'')
    +(o.refundTime?'<div class="detail-row"><span class="label">退款时间</span><span class="value">'+((o.refundTime||"").replace("T"," ").slice(0,16))+'</span></div>':'')
    +'</div>';
  
  // 退款信息卡片
  var refundCard="";
  if(o.refundStatus>0){
    refundCard='<div class="card"><div class="card-title">退款信息</div>'
      +'<div class="detail-row"><span class="label">退款状态</span><span class="value"><span class="tag '+(o.refundStatus===1?"success":"primary")+'">'+(o.refundStatus===1?"已退款":"部分退款")+'</span></span></div>'
      +'<div class="detail-row"><span class="label">退款金额</span><span class="value success">¥'+(o.refundAmount||o.payAmount).toFixed(2)+'</span></div>'
      +'</div>';
  }
  
  $("content").innerHTML=amountCard+infoCard+timeCard+refundCard;
  
  // 底部操作栏
  if(o.refundStatus===0){
    $("bottomBar").style.display="flex";
    $("btnRefund").dataset.orderNo=o.ibigouOrderNo;
  }
}

async function doRefund(){
  var orderNo=$("btnRefund").dataset.orderNo;
  if(!confirm("确认对订单 "+orderNo+" 发起全额退款？"))return;
  
  var tk=localStorage.getItem("ibigou_user_token");
  var ph=localStorage.getItem("ibigou_phone");
  $("btnRefund").disabled=true;
  $("btnRefund").textContent="处理中...";
  
  try{
    var resp=await fetch("/api/customer/ibigou/order/"+orderNo+"/refund?userPhone="+ph,{method:"POST",headers:{"X-User-Token":tk}});
    var r=await resp.json();
    if(r.code===0){
      toast("退款成功","success");
      setTimeout(function(){loadOrderDetail()},1000);
    }else{
      toast(r.msg||"退款失败","danger");
      $("btnRefund").disabled=false;
      $("btnRefund").textContent="申请退款";
    }
  }catch(e){
    toast("退款失败","danger");
    $("btnRefund").disabled=false;
    $("btnRefund").textContent="申请退款";
  }
}

loadOrderDetail();
</script>
</body>
</html>
