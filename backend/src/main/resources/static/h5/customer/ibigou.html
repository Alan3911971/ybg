<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>宜必购商城</title>
<style>
:root{
  --c-primary:#e85d3a;--c-primary-light:#fff0ea;
  --c-accent:#f7a072;--c-gold:#e8a838;
  --c-text:#1a1a2e;--c-text-2:#4a4a68;--c-text-3:#9b9bb0;
  --c-bg:#f0f0f5;--c-surface:#fff;
  --c-border:#e4e4ec;--c-divider:#ededf2;
  --sh-card:0 4px 16px rgba(30,30,60,.06);
  --sh-hover:0 8px 24px rgba(30,30,60,.1);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--c-text);background:var(--c-bg);
  -webkit-font-smoothing:antialiased;font-size:15px;
}
body{min-height:100vh;padding-bottom:calc(60px + env(safe-area-inset-bottom));}
input,select,button{font-size:16px;}
button{font-family:inherit;}

.hero{
  background:linear-gradient(145deg,#1a1a2e 0%,#16213e 40%,#0f3460 100%);
  color:#fff;padding:36px 22px 52px;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;top:-80px;right:-60px;
  width:220px;height:220px;
  background:radial-gradient(circle,rgba(232,93,58,.3) 0%,transparent 70%);
  border-radius:50%;
}
.hero h1{font-size:22px;font-weight:800;position:relative;z-index:1;letter-spacing:.5px;}
.hero .sub{margin-top:6px;font-size:12px;color:rgba(255,255,255,.6);position:relative;z-index:1;letter-spacing:.5px;}
.hero .sub .dot{display:inline-block;width:4px;height:4px;background:var(--c-gold);border-radius:50%;vertical-align:middle;margin:0 6px;}

.container{max-width:560px;margin:0 auto;padding:0 10px;position:relative;z-index:2;}

.goods-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-top:-32px;
}
.pcard{
  background:var(--c-surface);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--sh-card);
  display:flex;flex-direction:column;
  transition:box-shadow .2s,transform .15s;
}
.pcard:active{transform:scale(.985);box-shadow:var(--sh-hover);}

.pcard .img-wrap{
  width:100%;aspect-ratio:1;
  background:linear-gradient(135deg,#f8f8fc,#ececf2);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.pcard .img-wrap img{width:100%;height:100%;object-fit:cover;}
.pcard .img-wrap .placeholder{
  font-size:40px;opacity:.35;
  filter:grayscale(.3);
}
.pcard .shop-badge{
  position:absolute;bottom:6px;left:6px;
  background:rgba(26,26,46,.75);color:#fff;
  font-size:10px;padding:3px 10px;border-radius:999px;
  max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  backdrop-filter:blur(8px);font-weight:500;
}

.pcard .body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;}
.pcard .name{
  font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:2px;min-height:36px;color:var(--c-text);
}
.pcard .desc{
  font-size:11px;color:var(--c-text-3);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:6px;
}
.pcard .price-row{
  display:flex;align-items:baseline;gap:4px;margin-bottom:8px;
}
.pcard .price{
  font-size:18px;font-weight:800;color:var(--c-primary);letter-spacing:-.5px;
}
.pcard .price .sym{font-size:12px;font-weight:600;}
.pcard .sales{
  font-size:10px;color:var(--c-text-3);
  margin-left:auto;align-self:center;
}

.pcard .buy-btn{
  margin-top:auto;width:100%;height:32px;
  border:none;border-radius:9px;
  background:var(--c-primary);color:#fff;
  font-size:13px;font-weight:600;cursor:pointer;
  transition:opacity .15s;letter-spacing:.5px;
}
.pcard .buy-btn:active{opacity:.8;}

.sec-title{
  font-size:15px;font-weight:700;
  margin:18px 0 10px;
  display:flex;align-items:center;gap:8px;
  color:var(--c-text);
}
.sec-title .bar{width:3px;height:14px;background:var(--c-primary);border-radius:2px;}

.empty{text-align:center;padding:48px 16px;color:var(--c-text-3);font-size:14px;}

.modal-bg{
  position:fixed;inset:0;background:rgba(15,15,30,.45);
  z-index:200;display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(3px);
}
.modal-bg.show{display:flex;}
.modal{
  background:#fff;width:100%;max-width:560px;
  border-radius:20px 20px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal h3{font-size:18px;font-weight:800;margin-bottom:16px;letter-spacing:.3px;}
.modal .field{margin-bottom:12px;}
.modal .field label{font-size:13px;color:var(--c-text-2);display:block;margin-bottom:4px;}
.modal .field input{
  width:100%;height:44px;padding:0 14px;
  border:1px solid var(--c-border);border-radius:10px;
  font-size:15px;background:#fff;transition:border-color .15s;
}
.modal .field input:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(232,93,58,.1);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:46px;padding:0 18px;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .12s;letter-spacing:.5px;
}
.btn:active{transform:scale(.97);}
.btn--primary{background:var(--c-primary);color:#fff;}
.btn--block{width:100%;}

.order{
  border:1px solid var(--c-border);border-radius:var(--radius);
  padding:14px;margin-bottom:8px;background:#fff;
}
.order .top{display:flex;align-items:center;gap:8px;font-size:13px;}
.order .no{font-weight:600;}
.order .line{font-size:12px;color:var(--c-text-2);margin-top:4px;line-height:1.5;}
.order--expandable{cursor:pointer;}
.order .order-expand{margin-left:6px;font-size:10px;color:var(--c-text-3);transition:transform .15s;}
.order-detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--c-divider);display:none;}
.detail-line{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--c-text-2);}
.detail-label{color:var(--c-text-3);}
.detail-val{font-weight:500;text-align:right;max-width:60%;}
.order .actions{margin-top:10px;display:flex;gap:8px;}
.refund-btn{flex:1;padding:8px;border:1px solid var(--c-danger);color:var(--c-danger);background:#fff;border-radius:8px;font-size:12px;cursor:pointer;}


.toast-host{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:10px 18px;border-radius:999px;
  background:rgba(26,26,46,.9);color:#fff;font-size:13px;
  opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;
  font-weight:500;
}
.toast.show{opacity:1;transform:none;}
.toast.success{background:#2d8a4e;}
.toast.warning{background:#d4942a;}
.toast.danger{background:#c4483a;}

.nav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(56px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);backdrop-filter:blur(12px);
  display:flex;border-top:1px solid var(--c-divider);
  z-index:100;padding-bottom:env(safe-area-inset-bottom);
}
.nav .tab{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  color:var(--c-text-3);font-size:10px;cursor:pointer;
  transition:color .15s;
}
.nav .tab .ic{font-size:20px;transition:transform .15s;}
.nav .tab.active{color:var(--c-primary);font-weight:600;}
.nav .tab.active .ic{transform:translateY(-1px);}
</style>
</head>
<body>
<div class="hero">
<h1>宜必购商城</h1>
<div class="sub">跨店好物<span class="dot"></span>余额直购<span class="dot"></span>盲盒专属</div>
</div>
<div class="container">
<div class="goods-grid" id="goodsGrid"></div>

</div>
<div class="modal-bg" id="orderModal">
<div class="modal" id="orderModalContent"></div>
</div>
<nav class="nav">
<div class="tab" data-go="/h5/customer/index.html"><span class="ic">🎯</span><span>抽盒</span></div>
<div class="tab active" data-go="/h5/customer/ibigou.html"><span class="ic">🛒</span><span>商城</span></div>
<div class="tab" data-go="/h5/customer/my-orders.html"><span class="ic">📋</span><span>订单</span></div>
<div class="tab" data-go="/h5/customer/wallet.html"><span class="ic">👤</span><span>我的</span></div>
</nav>
<div class="toast-host" id="toastHost"></div>
<script>
var $=function(id){return document.getElementById(id);};
function toast(m,t){var h=$("toastHost");if(!h)return;var e=document.createElement("div");e.className="toast "+(t||"");e.textContent=m;h.appendChild(e);requestAnimationFrame(function(){e.classList.add("show")});setTimeout(function(){e.classList.remove("show");setTimeout(function(){e.remove()},220)},2600)}
document.querySelectorAll(".nav .tab").forEach(function(el){el.addEventListener("click",function(){var h=el.getAttribute("data-go");if(h&&location.pathname.indexOf(h)===-1)location.href=h})});

var tk=localStorage.getItem("ibigou_user_token");
var ph=localStorage.getItem("ibigou_phone");
var mno=localStorage.getItem("ibigou_merchant_no")||"";
if(!tk||!ph){location.href="/h5/customer/login.html?merchantNo="+mno;}

var _selectedGoods=null;

async function loadGoods(){
  try{
    var resp=await fetch("/api/customer/ibigou/goods");
    var r=await resp.json();
    if(r.code===0&&r.data){renderGoods(r.data)}
    else{$("goodsGrid").innerHTML='<div class="empty" style="grid-column:1/3;">暂无商品</div>'}
  }catch(e){$("goodsGrid").innerHTML='<div class="empty" style="grid-column:1/3;">加载失败，请刷新</div>'}
}

function renderGoods(goods){
  if(!goods.length){$("goodsGrid").innerHTML='<div class="empty" style="grid-column:1/3;">暂无商品，敬请期待</div>';return}
  var html="";
  goods.forEach(function(g){
    var img=g.images?'<img src="'+g.images+'" alt="'+(g.goodsName||"")+'">':'<span class="placeholder">📦</span>';
    var shopName=g.merchantName||g.merchantNo||"";
    var salesText=g.salesCount>0?"已售"+g.salesCount:"新品";
    var desc=g.description||"";
    html+='<div class="pcard">'
      +'<div class="img-wrap">'+img
      +'<div class="shop-badge">'+shopName+'</div>'
      +'</div>'
      +'<div class="body">'
      +'<div class="name">'+(g.goodsName||"")+'</div>'
      +(desc?'<div class="desc">'+desc+'</div>':'')
      +'<div class="price-row"><div class="price"><span class="sym">¥</span>'+(g.price||0)+'</div><div class="sales">'+salesText+'</div></div>'
      +'<button class="buy-btn" data-goods-id="'+g.goodsId+'">立即购买</button>'
      +'</div></div>';
  });
  $("goodsGrid").innerHTML=html;
}

$("goodsGrid").addEventListener("click",function(e){
  if(e.target.classList.contains("buy-btn")){openOrderModal(e.target.dataset.goodsId)}
});

async function openOrderModal(goodsId){
  try{
    var resp=await fetch("/api/customer/ibigou/goods");
    var r=await resp.json();
    var goods=(r.data||[]).find(function(g){return String(g.goodsId)===String(goodsId)});
    if(!goods){toast("商品不存在","danger");return}
    _selectedGoods=goods;
    showOrderModal();
  }catch(e){toast("加载失败","danger")}
}

async function showOrderModal(){
  var g=_selectedGoods;
  var shopName=g.merchantName||g.merchantNo||"";
  var m=$("orderModalContent");
  m.innerHTML='<h3>确认订单</h3>'
    +'<div style="display:flex;gap:12px;align-items:center;margin-bottom:20px;">'
    +'<div style="width:64px;height:64px;border-radius:12px;overflow:hidden;background:#f0f0f4;flex-shrink:0;">'+(g.images?'<img src="'+g.images+'" style="width:100%;height:100%;object-fit:cover;">':'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;">📦</div>')+'</div>'
    +'<div style="flex:1;"><div style="font-weight:600;font-size:15px;">'+(g.goodsName||"")+'</div><div style="font-size:12px;color:var(--c-text-3);margin-top:2px;">'+shopName+'</div><div style="color:var(--c-primary);font-weight:800;font-size:20px;margin-top:4px;">¥'+(g.price||0)+'</div></div>'
    +'</div>'
    +'<div id="orderForm"><div style="text-align:center;padding:20px;color:var(--c-text-3);">加载中...</div></div>';
  $("orderModal").classList.add("show");
  await loadAssetsAndRender(g);
}

async function loadAssetsAndRender(g){
  try{
    var resp=await fetch("/api/customer/ibigou/assets/"+ph,{headers:{"X-User-Token":tk}});
    var r=await resp.json();
    if(r.code!==0){$("orderForm").innerHTML='<div style="color:var(--c-text-3);text-align:center;padding:16px;">'+(r.msg||"加载失败")+'</div>';return}
    var assets=r.data;
    var bal=assets.balance||0;
    var rate=assets.balanceDeductRate||0;
    var maxDeduct=Math.min(bal,(g.price||0));
    $("orderForm").innerHTML='<div style="background:#f8f8fc;border-radius:12px;padding:14px;margin:8px 0;">'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;"><span style="color:var(--c-text-3);">商品金额</span><span style="font-weight:600;">¥'+(g.price||0)+'</span></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;"><span style="color:var(--c-text-3);">可用余额</span><span style="font-weight:600;">¥'+bal+'</span></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;"><span style="color:var(--c-text-3);">余额抵扣率</span><span style="font-weight:600;">'+rate+'%</span></div>'
      +'</div>'
      +'<div class="field"><label>使用余额抵扣（最多 ¥'+maxDeduct.toFixed(2)+'）</label><input id="inpDeduct" type="number" step="0.01" min="0" max="'+maxDeduct+'" value="'+maxDeduct+'" placeholder="0.00"></div>'
      +'<div style="background:#f8f8fc;border-radius:12px;padding:14px;margin:8px 0;">'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;"><span style="color:var(--c-text-3);">余额抵扣</span><span>-¥<span id="deductShow">'+maxDeduct.toFixed(2)+'</span></span></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800;"><span>实付金额</span><span style="color:var(--c-primary);">¥<span id="payShow">'+Math.max(0,(g.price||0)-maxDeduct).toFixed(2)+'</span></span></div>'
      +'</div>'
      +'<button class="btn btn--primary btn--block" id="btnConfirmOrder">确认下单</button>';
    function calcPay(){var d=parseFloat($("inpDeduct").value||0);var pay=Math.max(0,(g.price||0)-d);$("deductShow").textContent=d.toFixed(2);$("payShow").textContent=pay.toFixed(2)}
    $("inpDeduct").addEventListener("input",calcPay);
    $("btnConfirmOrder").onclick=async function(){
      var deduct=$("inpDeduct").value||"0";
      try{
        var params=new URLSearchParams();params.append("userPhone",ph);params.append("deductBalance",deduct);params.append("orderAmount",g.price);
        var resp=await fetch("/api/customer/ibigou/order?"+params.toString(),{method:"POST",headers:{"X-User-Token":tk}});
        var r=await resp.json();
        if(r.code===0){toast("下单成功！","success");$("orderModal").classList.remove("show");loadOrders()}
        else{toast(r.msg||"下单失败","danger")}
      }catch(e){toast("下单失败","danger")}
    };
  }catch(e){$("orderForm").innerHTML='<div style="color:var(--c-text-3);text-align:center;padding:16px;">加载失败</div>'}
}



$("orderModal").addEventListener("click",function(e){if(e.target===$("orderModal")){$("orderModal").classList.remove("show")}});
loadGoods();
</script>
</body>
</html>
