<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#ff5b3e"><title>付款结算</title><style>:root{--c-primary:#ff5b3e;--c-text:#1a1d29;--c-text-2:#5f6478;--c-text-3:#9095a8;--c-bg:#f7f8fb;--c-border:#eceef3;--c-success:#16a34a;}.m{padding:14px 16px;max-width:560px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f7f8fb;color:#1a1d29;min-height:100vh}.tb{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #eceef3;position:sticky;top:0;z-index:10}.pc{background:linear-gradient(135deg,#fff1ee 0%,#fff5f2 100%);border:1px solid #ffd0c4;border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;margin:14px 0}.pc .em{font-size:44px}.pc .t1{font-size:11px;color:#ff5b3e;font-weight:600;letter-spacing:1px}.pc .t2{font-size:18px;font-weight:800;margin-top:2px}.bk{background:#fff;border:1px solid #eceef3;border-radius:14px;padding:16px 14px;margin-bottom:12px}.bt{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:12px}.ai{width:100%;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#fff7ed 0%,#fff 100%);border:2px solid #ffd0c4;border-radius:12px;padding:12px 16px}.ai .ipt{flex:1;border:none;outline:none;background:transparent;font-size:28px;font-weight:800}.cb{margin-top:12px;padding:14px;border-radius:10px;background:linear-gradient(135deg,#fff7ed 0%,#fff 100%);border:1px solid #ffe0d0;font-size:13px;line-height:2;display:none}.cb.show{display:block}.cb .r{display:flex;justify-content:space-between}.cb .t{font-size:18px;font-weight:800;color:#ff5b3e;margin-top:4px}.cb .s{color:#16a34a;font-size:12px;text-align:right}.pr{background:linear-gradient(135deg,#fff1ee 0%,#fff 100%);border:1.5px solid #ffd0c4;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}.pr.nr{background:linear-gradient(135deg,#f3f4f6 0%,#fff 100%);border-color:#e5e7eb}.pe{width:44px;height:44px;border-radius:12px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:28px}.pt{font-size:10px;color:#fff;background:#ff5b3e;padding:3px 8px;border-radius:999px;font-weight:600}.btn{width:100%;height:50px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;background:linear-gradient(135deg,#ff7150 0%,#ff5b3e 100%);color:#fff;box-shadow:0 8px 20px rgba(255,91,62,.35)}.btn[disabled]{opacity:.5;box-shadow:none}.tp{font-size:12px;color:#9095a8;line-height:1.7;background:#fff7ed;padding:10px 12px;border-radius:8px;border:1px solid #ffe7d6;margin-top:8px}.mk{position:fixed;inset:0;background:rgba(15,17,30,.55);z-index:90;display:none;align-items:flex-end;justify-content:center}.mk.show{display:flex}.sh{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:su .22s ease}@keyframes su{from{transform:translateY(100%);}to{transform:none}}.sh h3{font-size:17px;margin-bottom:6px}.sh .sub{font-size:12px;color:#9095a8;line-height:1.6;margin-bottom:14px}.pa{text-align:center;margin:6px 0 12px}.pa .v{font-size:40px;font-weight:800;line-height:1.2}.pa .l{font-size:12px;color:#9095a8;margin-top:4px}.qb{background:linear-gradient(135deg,#fff7ed,#fff);border:1.5px dashed #ffb347;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}.qb .ei{font-size:36px;margin-bottom:6px}.qb .et{font-size:14px;font-weight:700}.qb .eh{font-size:11px;color:#9095a8;margin-top:6px;line-height:1.5}.qb .re{display:flex;flex-direction:column;align-items:center;gap:6px}.qb .ri{width:170px;height:170px;background:#fff;border:1px solid #eceef3;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#9095a8}.qb .rt{font-size:13px;font-weight:600}.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.pc2{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid #eceef3;border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer}.pc2.w{border-color:#1aad19}.pc2.a{border-color:#1677ff}.pc2.u{border-color:#e60012}.pc2.o{border-color:#9095a8}.pi{width:48px;height:48px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex-shrink:0}.pn{font-size:15px;font-weight:700}.pd{font-size:11px;color:#9095a8;margin-top:3px}.ph{font-size:12px;color:#9095a8;text-align:center;margin-top:8px}@media(max-width:380px){.pg{grid-template-columns:1fr}}</style></head><body><div class="tb"><div>付款结算</div></div><div class="m"><div class="pc"><div class="em" id="em">🎁</div><div><div class="t1">CONGRATULATIONS</div><div class="t2" id="pn">--</div></div></div><div class="bk"><div class="bt">💰 请输入本单金额</div><div class="ai"><span>¥</span><input class="ipt" id="ai" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" /><span>元</span></div><div class="cb" id="cb"></div></div><div class="bk"><div class="bt">🧮 本次中奖</div><div class="pr" id="pr"><div class="pe" id="pe">🎁</div><div><div class="pn" id="prn">--</div><div class="pd" id="prr">--</div></div><div class="pt" id="pt">自动使用</div></div></div><div class="tp">余额仅可用于本店消费抵扣</div><button class="btn" id="bo" disabled>💳 请先输入金额</button></div><div class="mk" id="mk"><div class="sh"><h3>💳 请选择付款方式</h3><div class="sub">选择支付方式后长按二维码识别完成支付</div><div class="pa"><div class="v" id="pav">¥0.00</div><div class="l">本单应付金额</div></div><div class="qb" id="qb"><div id="qe"><div class="ei">👇</div><div class="et">点击下方支付方式</div><div class="eh">系统将生成聚合收款码</div></div></div><div class="pg"><div class="pc2 w" data-c="wechat" type="button"><div class="pi" style="background:#1aad19;">💚</div><div><div class="pn">微信支付</div><div class="pd">打开微信扫一扫</div></div></div><div class="pc2 a" data-c="alipay" type="button"><div class="pi" style="background:#1677ff;">💙</div><div><div class="pn">支付宝</div><div class="pd">打开支付宝扫一扫</div></div></div><div class="pc2 u" data-c="unionpay" type="button"><div class="pi" style="background:#e60012;">💜</div><div><div class="pn">银联/云闪付</div><div class="pd">打开云闪付扫一扫</div></div></div><div class="pc2 o" data-c="other" type="button"><div class="pi" style="background:#9095a8;">❓</div><div><div class="pn">其他</div><div class="pd">显示商家聚合收款码</div></div></div></div><div class="ph">👆 选定后将在上方显示二维码</div></div></div><script>(function(){function qs(n){var s=location.search.substring(1).split("&");for(var i=0;i<s.length;i++){var p=s[i].split("=");if(p[0]===n)return decodeURIComponent(p[1]||"");}return"";}function $(i){return document.getElementById(i);}var pn=qs("prizeName")||"神秘礼品",pe=qs("prizeEmoji")||"🎁";var pr=null;try{var r=qs("rule");if(r)pr=JSON.parse(r);}catch(e){pr=null;}if(!pr)pr={type:"none",amount:0};$("em").textContent=pe;$("pn").textContent=pn;$("pe").textContent=pe;$("prn").textContent=pn;var t=pr.type,label="不可用",muted=false,rule="实物礼品";if(t==="discount"){rule="比例折扣 "+(pr.rate*10).toFixed(1)+" 折";label="自动使用";}else if(t==="minus"){rule="立减 ¥"+pr.amount;label="自动使用";}else if(t==="threshold"){rule="满"+pr.threshold+"减"+pr.minus;label="自动使用";}else if(t==="balance"){rule="¥"+pr.amount+" 余额入账";label="自动使用";}else if(t==="free"){rule="免单一次";label="自动使用";}else if(t==="half_cap"){rule="幸运加倍 最多抵 ¥"+pr.cap;label="自动使用";}else{muted=true;}$("prr").textContent=rule;$("pt").textContent=label;if(muted)$("pr").classList.add("nr");function calc(a,r){if(!r||r.type==="none"||!a||a<=0)return{pay:a||0,save:0};var p=a,s=0;if(r.type==="free"){s=a;p=0;}else if(r.type==="discount"){s=+(a*(1-r.rate)).toFixed(2);p=+(a-s).toFixed(2);}else if(r.type==="minus"){s=Math.min(r.amount,a);p=+(a-s).toFixed(2);}else if(r.type==="threshold"){if(a>=r.threshold){s=r.minus;p=+(a-s).toFixed(2);}}else if(r.type==="half_cap"){s=Math.min(a/2,r.cap||0);p=+(a-s).toFixed(2);}return{pay:Math.max(0,p),save:s};}var ai=$("ai");ai.addEventListener("input",function(){var v=parseFloat(ai.value);var box=$("cb");if(!v||v<=0){box.innerHTML="<div class=\"r\"><span>请输入金额</span><span>—</span></div>";box.classList.add("show");$("bo").disabled=true;$("bo").textContent="💳 请先输入金额";return;}var res=calc(v,pr);var h="<div class=\"r\"><span>订单金额</span><b>¥"+v.toFixed(2)+"</b></div>";if(res.save>0)h+="<div class=\"r\"><span>使用券</span><b style=\"color:#16a34a\">-¥"+res.save.toFixed(2)+"</b></div>";h+="<div class=\"r t\"><span>应付金额</span><b>¥"+res.pay.toFixed(2)+"</b></div>";if(res.save>0)h+="<div class=\"s\">为你节省 ¥"+res.save.toFixed(2)+"</div>";box.innerHTML=h;box.classList.add("show");$("bo").disabled=false;$("bo").textContent="💳 确认下单 ¥"+res.pay.toFixed(2);$("pav").textContent="¥"+res.pay.toFixed(2);});var lbs={wechat:"微信",alipay:"支付宝",unionpay:"云闪付"};document.querySelectorAll(".pc2").forEach(function(btn){btn.addEventListener("click",function(){var c=btn.getAttribute("data-c");if(c==="other"){$("qb").innerHTML="<div class=\"re\"><div class=\"ri\">[ 商家聚合收款码 ]</div><div class=\"rt\">长按识别付款</div></div>";}else{alert("请打开"+lbs[c]+"扫一扫商家收款码");}});});$("bo").addEventListener("click",function(){if($("bo").disabled)return;var v=parseFloat(ai.value);if(!v||v<=0){alert("请先输入金额");return;}$("mk").classList.add("show");});})();</script></body></html>
