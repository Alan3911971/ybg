<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>我的订单</title>
<style>
:root{
  --c-primary:#e85d3a;--c-primary-light:#fff0ea;
  --c-accent:#f7a072;--c-gold:#e8a838;
  --c-success:#2d8a4e;--c-success-light:#e8f5ec;
  --c-warning:#e8a838;--c-warning-light:#fef7e8;
  --c-text:#1a1a2e;--c-text-2:#4a4a68;--c-text-3:#9b9bb0;
  --c-bg:#f5f5fa;--c-surface:#fff;
  --c-border:#e4e4ec;--c-divider:#f0f0f5;
  --sh-card:0 2px 12px rgba(30,30,60,.05);
  --sh-card-hover:0 6px 20px rgba(30,30,60,.08);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--c-text);background:var(--c-bg);
  -webkit-font-smoothing:antialiased;font-size:15px;
}
body{min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom));}

/* 顶部 */
.page-header{
  background:linear-gradient(145deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  color:#fff;padding:calc(24px + env(safe-area-inset-top)) 20px 36px;
  position:relative;overflow:hidden;
}
.page-header::before{
  content:"";position:absolute;top:-80px;right:-50px;
  width:220px;height:220px;
  background:radial-gradient(circle,rgba(232,93,58,.3) 0%,transparent 70%);
  border-radius:50%;
}
.page-header::after{
  content:"";position:absolute;bottom:-40px;left:-30px;
  width:160px;height:160px;
  background:radial-gradient(circle,rgba(247,160,114,.15) 0%,transparent 70%);
  border-radius:50%;
}
.page-header h1{font-size:26px;font-weight:800;position:relative;z-index:1;letter-spacing:.5px;}
.page-header .sub{margin-top:8px;font-size:13px;color:rgba(255,255,255,.55);position:relative;z-index:1;letter-spacing:.3px;}
.page-header .stats{
  margin-top:18px;display:flex;gap:12px;position:relative;z-index:1;
}
.page-header .stat-item{
  flex:1;background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;
  backdrop-filter:blur(10px);
}
.page-header .stat-item .num{font-size:20px;font-weight:700;color:#fff;}
.page-header .stat-item .label{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px;}

.container{max-width:560px;margin:0 auto;padding:0 14px;position:relative;z-index:2;margin-top:-20px;}

/* 订单卡片 */
.order-card{
  background:var(--c-surface);border-radius:var(--radius);
  box-shadow:var(--sh-card);margin-bottom:14px;
  overflow:hidden;cursor:pointer;
  transition:box-shadow .2s,transform .15s;
}
.order-card:active{transform:scale(.985);box-shadow:var(--sh-card-hover);}

.order-card .card-head{
  display:flex;align-items:center;padding:16px 16px 12px;
  border-bottom:1px solid var(--c-divider);
}
.order-card .order-icon{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-right:12px;flex-shrink:0;
}
.order-card .order-icon.done{background:var(--c-success-light);}
.order-card .order-icon.refunded{background:#f0f0f5;}
.order-card .order-icon.partial{background:var(--c-warning-light);}
.order-card .order-info{flex:1;min-width:0;}
.order-card .order-no{
  font-size:13px;font-weight:600;color:var(--c-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.order-card .order-time{font-size:11px;color:var(--c-text-3);margin-top:3px;}
.order-card .status-badge{
  padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;
  flex-shrink:0;margin-left:8px;
}
.order-card .status-badge.done{background:var(--c-success-light);color:var(--c-success);}
.order-card .status-badge.refunded{background:#f0f0f5;color:var(--c-text-3);}
.order-card .status-badge.partial{background:var(--c-warning-light);color:var(--c-warning);}
.order-card .arrow{color:var(--c-text-3);font-size:16px;margin-left:6px;flex-shrink:0;}

.order-card .card-body{padding:14px 16px;}
.order-card .amount-row{
  display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;
}
.order-card .amount-label{font-size:12px;color:var(--c-text-3);}
.order-card .amount-value{
  font-size:22px;font-weight:800;color:var(--c-primary);
  letter-spacing:-.5px;
}
.order-card .amount-value .symbol{font-size:14px;margin-right:1px;font-weight:600;}
.order-card .detail-row{
  display:flex;justify-content:space-between;font-size:12px;
  padding:4px 0;color:var(--c-text-2);
}
.order-card .detail-row .label{color:var(--c-text-3);}
.order-card .detail-row .val{font-weight:500;}

/* 空状态 */
.empty{
  text-align:center;padding:80px 20px 60px;
}
.empty .icon{
  width:80px;height:80px;border-radius:50%;
  background:var(--c-surface);box-shadow:var(--sh-card);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;margin:0 auto 20px;
}
.empty .text{font-size:15px;font-weight:600;color:var(--c-text-2);}
.empty .sub{font-size:12px;color:var(--c-text-3);margin-top:6px;}
.empty .btn-go{
  margin-top:24px;display:inline-block;
  padding:10px 28px;border-radius:999px;
  background:linear-gradient(135deg,var(--c-primary),var(--c-accent));
  color:#fff;font-size:13px;font-weight:600;
  box-shadow:0 4px 12px rgba(232,93,58,.25);
  cursor:pointer;
}

/* 底部导航 */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(60px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);backdrop-filter:blur(12px);
  display:flex;border-top:1px solid var(--c-divider);
  z-index:100;padding-bottom:env(safe-area-inset-bottom);
}
.nav .tab{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  color:var(--c-text-3);font-size:10px;cursor:pointer;
  transition:color .15s;
}
.nav .tab .ic{font-size:22px;transition:transform .15s;}
.nav .tab.active{color:var(--c-primary);font-weight:600;}
.nav .tab.active .ic{transform:translateY(-1px);}

/* toast */
.toast-host{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:10px 18px;border-radius:999px;
  background:rgba(26,26,46,.9);color:#fff;font-size:13px;
  opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;
  font-weight:500;
}
.toast.show{opacity:1;transform:none;}
.toast.success{background:#2d8a4e;}
.toast.danger{background:#c4483a;}
</style>
</head>
<body>

<div class="toast-host" id="toastHost"></div>

<div class="page-header">
  <h1>我的订单</h1>
  <div class="sub">查看您的商城购买记录</div>
  <div class="stats" id="statsBar" style="display:none;">
    <div class="stat-item"><div class="num" id="statTotal">0</div><div class="label">全部订单</div></div>
    <div class="stat-item"><div class="num" id="statAmount">¥0</div><div class="label">累计消费</div></div>
  </div>
</div>

<div class="container">
  <div id="ordersList">
    <div class="empty">
      <div class="icon">📦</div>
      <div class="text">加载中...</div>
    </div>
  </div>
</div>

<nav class="nav">
  <div class="tab" data-go="/h5/customer/index.html"><span class="ic">🎯</span><span>抽盒</span></div>
  <div class="tab" data-go="/h5/customer/ibigou.html"><span class="ic">🛒</span><span>商城</span></div>
  <div class="tab active"><span class="ic">📋</span><span>订单</span></div>
  <div class="tab" data-go="/h5/customer/wallet.html"><span class="ic">👤</span><span>我的</span></div>
</nav>

<script>
var $=function(id){return document.getElementById(id);};
function toast(m,t){var h=$("toastHost");if(!h)return;var e=document.createElement("div");e.className="toast "+(t||"");e.textContent=m;h.appendChild(e);requestAnimationFrame(function(){e.classList.add("show")});setTimeout(function(){e.classList.remove("show");setTimeout(function(){e.remove()},220)},2600)}

document.querySelectorAll(".nav .tab").forEach(function(el){
  el.addEventListener("click",function(){
    var h=el.getAttribute("data-go");
    if(h&&location.pathname.indexOf(h)===-1)location.href=h;
  });
});

var tk=localStorage.getItem("ibigou_user_token");
var ph=localStorage.getItem("ibigou_phone");
var mno=localStorage.getItem("ibigou_merchant_no")||"";
if(!tk||!ph){location.href="/h5/customer/login.html?merchantNo="+mno;}

async function loadOrders(){
  if(!tk||!ph){$("ordersList").innerHTML="";return}
  try{
    var resp=await fetch("/api/customer/ibigou/orders/"+ph,{headers:{"X-User-Token":tk}});
    var r=await resp.json();
    if(r.code===0&&r.data){renderOrders(r.data)}
    else{$("ordersList").innerHTML='<div class="empty"><div class="icon">⚠️</div><div class="text">加载失败</div></div>'}
  }catch(e){$("ordersList").innerHTML='<div class="empty"><div class="icon">📡</div><div class="text">网络错误</div></div>'}
}

function renderOrders(orders){
  if(!orders.length){
    $("ordersList").innerHTML='<div class="empty"><div class="icon">🛒</div><div class="text">暂无订单</div><div class="sub">还没有购买记录，去商城看看吧</div><div class="btn-go" onclick="location.href=\'/h5/customer/ibigou.html\'">去逛逛</div></div>';
    return;
  }
  
  // 统计
  var totalAmount=0;
  orders.forEach(function(o){if(o.refundStatus===0)totalAmount+=parseFloat(o.payAmount||0)});
  $("statsBar").style.display="flex";
  $("statTotal").textContent=orders.length;
  $("statAmount").textContent="¥"+totalAmount.toFixed(2);
  
  var html="";
  orders.forEach(function(o){
    var statusClass,statusText,iconText;
    if(o.refundStatus===1){statusClass="refunded";statusText="已退款";iconText="↩"}
    else if(o.refundStatus===2){statusClass="partial";statusText="部分退款";iconText="↩"}
    else{statusClass="done";statusText="已完成";iconText="✓"}
    
    html+='<div class="order-card" onclick="location.href=\'/h5/customer/order-detail.html?orderNo='+o.ibigouOrderNo+'\'">'
      +'<div class="card-head">'
      +'<div class="order-icon '+statusClass+'">'+iconText+'</div>'
      +'<div class="order-info">'
      +'<div class="order-no">'+o.ibigouOrderNo+'</div>'
      +'<div class="order-time">下单时间：'+((o.createTime||"").replace("T"," ").slice(0,16))+'</div>'
      +'</div>'
      +'<span class="status-badge '+statusClass+'">'+statusText+'</span>'
      +'<span class="arrow">›</span>'
      +'</div>'
      +'<div class="card-body">'
      +'<div class="amount-row"><span class="amount-label">实付金额</span><span class="amount-value"><span class="symbol">¥</span>'+(o.payAmount||0).toFixed(2)+'</span></div>'
      +'<div class="detail-row"><span class="label">订单金额</span><span class="val">¥'+o.orderAmount.toFixed(2)+'</span></div>'
      +'<div class="detail-row"><span class="label">余额抵扣</span><span class="val">¥'+(o.deductBalance||0).toFixed(2)+'</span></div>'
      +'<div class="detail-row"><span class="label">优惠券</span><span class="val">'+(o.couponId?'已使用':'未使用')+'</span></div>'
      +'</div>'
      +'</div>';
  });
  $("ordersList").innerHTML=html;
}

loadOrders();
</script>
</body>
</html>
