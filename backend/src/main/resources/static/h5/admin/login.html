<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>平台后台登录 · 宜必购</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --c-primary:#4338ca; --c-primary-600:#3730a3; --c-primary-100:#e0e7ff;
    --c-accent:#06b6d4; --c-success:#16a34a; --c-warning:#f59e0b; --c-danger:#dc2626;
    --c-text:#1a2233; --c-text-2:#4d556a; --c-text-3:#8089a0;
    --c-bg:#f5f7fb; --c-surface:#fff; --c-border:#e6e8ef;
    --c-grad-1:linear-gradient(135deg,#4338ca 0%,#6d28d9 100%);
    --c-grad-bg:linear-gradient(160deg,#312e81 0%,#4338ca 60%,#06b6d4 100%);
    --r-md:10px; --r-lg:14px;
    --sh-2:0 8px 24px rgba(67,56,202,.22);
    --sh-press:0 0 0 4px rgba(67,56,202,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--c-text);background:var(--c-grad-bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{background:var(--c-surface);border-radius:var(--r-lg);padding:32px 28px;width:100%;max-width:380px;box-shadow:var(--sh-2);}
  .brand{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;}
  .brand .logo{width:56px;height:56px;border-radius:16px;background:var(--c-grad-1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:10px;box-shadow:0 6px 14px rgba(67,56,202,.40);}
  .brand h1{font-size:18px;font-weight:600;}
  .brand .sub{font-size:12px;color:var(--c-text-3);margin-top:4px;}
  .err{color:var(--c-danger);background:#fde8e8;border:1px solid #f5b3b3;border-radius:8px;font-size:13px;padding:8px 10px;margin-bottom:12px;min-height:18px;display:none;}
  .err.show{display:block;}
  .field{margin-bottom:14px;}
  .field input{width:100%;padding:13px 14px;border:1px solid var(--c-border);border-radius:var(--r-md);font-size:16px;color:var(--c-text);background:#fff;transition:border-color .15s,box-shadow .15s;}
  .field input:focus{outline:none;border-color:var(--c-primary);box-shadow:var(--sh-press);}
  .field input::placeholder{color:var(--c-text-3);}
  .btn{width:100%;padding:14px;border:none;border-radius:var(--r-md);background:var(--c-grad-1);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 14px rgba(67,56,202,.38);transition:transform .12s,box-shadow .15s;}
  .btn:active{transform:scale(.98);}
  .hint{margin-top:18px;font-size:12px;color:var(--c-text-3);text-align:center;line-height:1.8;}
  .hint code{background:#eef0f4;padding:2px 6px;border-radius:4px;font-size:12px;color:var(--c-text-2);}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">🛡️</div><h1>平台后台 · 宜必购</h1><div class="sub">商家管理 · 全局配置 · 审计告警</div></div>
  <div class="err" id="err"></div>
  <div class="field"><input id="account" placeholder="管理员账号" autocomplete="username"></div>
  <div class="field"><input id="pwd" type="password" placeholder="管理员密码" autocomplete="current-password"></div>
  <button class="btn" id="btnLogin">登 录</button>
  <div class="hint">测试账号：<code>admin</code> / 密码 <code>Admin@2026</code></div>
</div>
<script>
const $ = id => document.getElementById(id);
$("btnLogin").onclick = async function(){
  $("err").style.display = "none";
  var acct = $("account").value.trim();
  var pwdVal = $("pwd").value;
  if (!acct || !pwdVal) { $("err").textContent = "请输入账号和密码"; $("err").style.display = "block"; return; }
  $("btnLogin").disabled = true;
  $("btnLogin").textContent = "登录中...";
  try {
    var resp = await fetch("/api/admin/auth/login", {
      method: "POST",
      body: "account=" + encodeURIComponent(acct) + "&password=" + encodeURIComponent(pwdVal),
      headers: { "Content-Type": "application/x-www-form-urlencoded" }
    });
    var r = await resp.json();
    if (r.code === 0 && r.data) {
      localStorage.setItem("ibigou_admin_token", r.data);
      location.href = "index.html";
    } else {
      $("err").textContent = r.msg || "登录失败";
      $("err").style.display = "block";
    }
  } catch (e) {
    $("err").textContent = "网络异常：" + (e.message || "请稍后再试");
    $("err").style.display = "block";
  }
  finally { $("btnLogin").disabled = false; $("btnLogin").textContent = "登 录"; }
};
$("pwd").addEventListener("keydown", function(e){ if (e.key === "Enter") $("btnLogin").onclick(); });
</script>
</body>
</html>
