server:
  port: 8085

spring:
  application:
    name: ibigou-blindbox
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ibigou_blindbox?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${IBIGOU_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    hibernate:
      # 表结构由 db/schema.sql 统一管理，禁止 Hibernate 自动改表
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        connection:
          isolation: 2  # READ_COMMITTED（全局，防丢失更新）
        jdbc:
          time_zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ibigou.blindbox: info

# 产品域名（ybgtc.com）：二维码、H5 链接生成统一走这里，禁止硬编码
admin:
  init:
    password: ${IBIGOU_ADMIN_INIT_PWD:Admin@2026}  # 默认管理员初始密码（生产必须环境变量注入）

app:
  domain: https://ybgtc.com
  qr-base-path: /qr        # 盲盒二维码解析入口
  customer-path: /h5/customer
  merchant-path: /h5/merchant
  admin-path: /h5/admin
  upload-dir: ./uploads        # 商家收款码等上传文件目录（生产挂载持久卷）
  # V19 AI Agent：enabled=false 或未配置 api-key 时自动降级为本地规则引擎，功能照常可用
  ai:
    enabled: ${AI_ENABLED:false}   # 生产用环境变量开启，改 .env 重启即可，无需重新打包
    base-url: ${AI_BASE_URL:}      # OpenAI 兼容地址，如 https://dashscope.aliyuncs.com/compatible-mode
    api-key: ${AI_API_KEY:}        # 建议生产用环境变量注入，勿写死在配置文件
    model: ${AI_MODEL:qwen-plus}
    timeout-ms: 15000
  # V20 运营数据中台接口（/api/ops/**）：给大屏 / 广告机 / AI 日志页用
  ops:
    token: ${OPS_TOKEN:}                  # 空=不校验；配了则 /api/ops/** 需带 X-Ops-Token 或 ?token=
    source: ${OPS_SOURCE:realtime}        # realtime=直查业务表实时聚合（V20 未上线也能出数）
                                          # mart=读 V20 汇总表 v_ops_day/channel_daily（需先建表并跑 ETL）
    default-merchant: ${OPS_MERCHANT:}    # 请求不传 merchantNo 时的兜底商家
    rebuild-enabled: ${OPS_REBUILD:false} # ETL 定时开关，默认关（多实例部署只能开一个，或用外部 crontab）
spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 10MB
