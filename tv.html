<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电视叫号屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#fff;overflow:hidden;height:100vh;}
/* 整体布局：顶部条56 + 主区(1080-56-56) + 底部字幕56，比例协调 */
.header{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;background:#1e293b;}
.header h1{font-size:22px;font-weight:700;}
.header .time{font-size:15px;color:#94a3b8;}
.main{display:flex;height:calc(100vh - 56px - 56px);}
/* 底部字幕：56px细条 + 22px小字，静态居中（4.4不依赖动画） */
.ticker{position:fixed;bottom:0;left:0;right:0;height:56px;background:#1e293b;display:flex;align-items:center;justify-content:center;overflow:hidden;border-top:1px solid #334155;z-index:60;}
.ticker-inner{white-space:nowrap;font-size:22px;color:#e2e8f0;font-weight:500;}
.left{width:33%;display:flex;flex-direction:column;background:#1e293b;}
.left .qr-area{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0 40px 0;}
.left .call-area{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px 0 14px 0;}
.left .call-area .label{font-size:18px;color:#94a3b8;margin-bottom:14px;letter-spacing:4px;}
.left .call-area .ticket{font-size:110px;font-weight:900;background:linear-gradient(135deg,#4f46e5,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;-webkit-animation:breathe 2s ease-in-out infinite;animation:breathe 2s ease-in-out infinite;}
@-webkit-keyframes breathe{0%,100%{-webkit-transform:scale(1);opacity:1;}50%{-webkit-transform:scale(1.05);opacity:0.9;}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.05);opacity:0.9;}}
.left .call-area .call-info{font-size:20px;color:#e2e8f0;margin-top:10px;text-align:center;}
.left .call-area .waiting-count{font-size:15px;color:#94a3b8;margin-top:6px;}
.left .queue-area{flex:1;background:#0f172a;padding:12px;overflow:hidden;position:relative;border-top:1px solid #334155;}
.queue-header{display:flex;margin-bottom:10px;}
.queue-header .col-label{flex:1;text-align:center;font-size:14px;color:#94a3b8;background:#1e293b;padding:6px 0;border-radius:6px;margin-right:10px;}
.queue-header .col-label:last-child{margin-right:0;}
.queue-cols{display:flex;height:calc(100% - 40px);}
.queue-col{flex:1;overflow:hidden;position:relative;margin-right:10px;}
.queue-col:last-child{margin-right:0;}
.queue-col-inner{-webkit-animation:scrollUp 10s linear infinite;animation:scrollUp 10s linear infinite;}
@-webkit-keyframes scrollUp{0%{-webkit-transform:translateY(0);}100%{-webkit-transform:translateY(-50%);}}
@keyframes scrollUp{0%{transform:translateY(0);}100%{transform:translateY(-50%);}}
.queue-col .ticket-item{font-size:16px;padding:5px 10px;background:#334155;border-radius:6px;text-align:center;margin-bottom:6px;}
.right{width:67%;background:#0f172a;position:relative;display:flex;align-items:center;justify-content:center;border-left:2px solid #334155;}
.right img{width:100%;height:100%;object-fit:cover;transition:opacity 0.5s;}
.right video{max-width:100%;max-height:100%;object-fit:contain;}
.ad-fade{opacity:0;}
.ad-show{opacity:1;-webkit-transition:opacity 0.5s;transition:opacity 0.5s;}
.queue .label{font-size:20px;color:#94a3b8;width:80px;flex-shrink:0;}
.queue .tickets{display:flex;gap:16px;flex-wrap:wrap;}
.queue .ticket-item{font-size:22px;padding:6px 16px;background:#334155;border-radius:8px;}
.no-call{color:#475569;font-size:120px;}
.win-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:9999;}
.win-overlay.show{display:flex;-webkit-animation:fadeIn 0.5s;animation:fadeIn 0.5s;}
.win-box{text-align:center;color:#fff;}
.win-box .trophy{font-size:120px;margin-bottom:20px;-webkit-animation:bounce 1s infinite;animation:bounce 1s infinite;}
.win-box .title{font-size:48px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;}
.win-box .desc{font-size:24px;color:#e2e8f0;}
@-webkit-keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@-webkit-keyframes bounce{0%,100%{-webkit-transform:translateY(0);}50%{-webkit-transform:translateY(-20px);}}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
</style>
</head>
<body>
<div class="header">
  <h1 id="merchantName">加载中...</h1>
  <div style="display:flex;align-items:center;">
    <button onclick="toggleMute()" id="muteBtn" style="background:rgba(0,0,0,0.5);color:#fff;padding:5px 12px;border:none;border-radius:6px;font-size:13px;cursor:pointer;margin-right:12px;">🔊 声音开</button>
    <button onclick="enterFullscreen()" style="background:rgba(0,0,0,0.5);color:#fff;padding:5px 12px;border:none;border-radius:6px;font-size:13px;cursor:pointer;margin-right:12px;">📺 全屏</button>
    <div class="time" id="clock"></div>
  </div>
</div>
<div class="main">
  <div class="left">
    <div class="call-area">
      <div class="label">当前叫号</div>
      <div id="callingTicket" class="no-call">--</div>
      <div id="callingInfo" class="call-info"></div>
      <div id="waitingCount" class="waiting-count"></div>
    </div>
    <div class="queue-area" id="queueArea"></div>
  </div>
  <div class="right" id="adArea">
    <div style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.5);color:#94a3b8;padding:4px 10px;border-radius:6px;font-size:12px;z-index:10;">广告</div>
    <div style="color:#475569;font-size:24px;">暂无广告</div>
  </div>
</div>

<!-- 滚动字幕 -->
<div class="ticker">
  <div class="ticker-inner" id="tickerText">欢迎光临鲜果时光·宜必购合作店 · 扫码取号排队 · 我们将竭诚为您服务 ·</div>
</div>

<!-- 音频激活提示 -->
<!-- 音频提示（默认隐藏：电视APK走原生播报无需点击，网页版加载时自动初始化） -->
<div id="audioHint" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:99999;cursor:pointer;" onclick="enableAudio()">
  <div style="text-align:center;color:#fff;">
    <div style="font-size:48px;margin-bottom:20px;">🔊</div>
    <div style="font-size:28px;font-weight:600;">点击任意位置开启声音</div>
    <div style="font-size:18px;color:#94a3b8;margin-top:10px;">开启后叫号语音播报正常播放</div>
  </div>
</div>
<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <div class="trophy">🎉</div>
    <div class="title">恭喜中奖！</div>
    <div class="desc" id="winDesc">恭喜您抽中奖品</div>
  </div>
</div>



<script>
// ===== 老 WebView（Android 4.4）ES5 polyfill：Promise / URLSearchParams / fetch =====
if(!window.Promise){
  (function(){
    var PENDING=0, FULFILLED=1, REJECTED=2;
    function Promise(executor){
      this._state=PENDING; this._value=undefined; this._queue=[];
      var self=this;
      function resolve(v){
        // thenable 展平：resolve 一个 Promise 时等待其完成（原生 Promise 语义）
        if(v && (typeof v==='object' || typeof v==='function') && typeof v.then==='function'){
          var called=false;
          v.then(
            function(val){ if(!called){ called=true; settle(self, FULFILLED, val); } },
            function(err){ if(!called){ called=true; settle(self, REJECTED, err); } }
          );
          return;
        }
        settle(self, FULFILLED, v);
      }
      function reject(r){ settle(self, REJECTED, r); }
      try{ executor(resolve, reject); }catch(e){ reject(e); }
    }
    function settle(p, state, value){
      if(p._state!==PENDING) return;
      p._state=state; p._value=value;
      var q;
      while((q=p._queue.shift())){ asap(q[0], q[1], state, value); }
    }
    function asap(onFulfilled, onRejected, state, value){
      setTimeout(function(){
        var fn = state===FULFILLED ? onFulfilled : onRejected;
        if(typeof fn!=='function') return;
        try{ fn(value); }catch(e){ setTimeout(function(){ throw e; }, 0); }
      }, 0);
    }
    Promise.prototype.then = function(onFulfilled, onRejected){
      var self=this;
      return new Promise(function(resolve, reject){
        self._queue.push([
          function(v){ resolve(onFulfilled ? onFulfilled(v) : v); },
          function(e){ reject(e); }
        ]);
        if(self._state!==PENDING) settle(self, self._state, self._value);
      });
    };
    Promise.prototype['catch'] = function(onRejected){ return this.then(null, onRejected); };
    Promise.resolve = function(v){ return new Promise(function(res){ res(v); }); };
    Promise.reject = function(r){ return new Promise(function(res, rej){ rej(r); }); };
    window.Promise = Promise;
  })();
}
if(!window.URLSearchParams){
  window.URLSearchParams = function(search){
    this._params = {};
    if(typeof search === 'string' && search){
      search.replace(/^\?/, '').split('&').forEach(function(kv){
        var p = kv.split('=');
        this._params[decodeURIComponent(p[0])] = decodeURIComponent((p[1]||'').replace(/\+/g, ' '));
      }, this);
    }
  };
  window.URLSearchParams.prototype.get = function(name){
    return this._params[name] !== undefined ? this._params[name] : null;
  };
}
// fetch polyfill（兼容 Android 4.4 老 WebView：fetch API 不支持，用 XHR 实现）
if(!window.fetch){
  window.fetch = function(url, opts){
    opts = opts || {};
    return new Promise(function(resolve, reject){
      var xhr = new XMLHttpRequest();
      xhr.open(opts.method || 'GET', url, true);
      if(opts.responseType === 'arraybuffer') xhr.responseType = 'arraybuffer';
      xhr.onreadystatechange = function(){
        if(xhr.readyState !== 4) return;
        if(xhr.status >= 200 && xhr.status < 300){
          resolve({
            ok: true,
            status: xhr.status,
            arrayBuffer: function(){ return Promise.resolve(xhr.response || new ArrayBuffer(0)); },
            json: function(){
              try { return Promise.resolve(JSON.parse(xhr.responseText)); }
              catch(e){ return Promise.reject(e); }
            },
            text: function(){ return Promise.resolve(xhr.responseText); }
          });
        } else {
          console.log('[XHR] HTTP ' + xhr.status + ' url=' + url);
          reject(new Error('HTTP ' + xhr.status));
        }
      };
      xhr.onerror = function(){ console.log('[XHR] network error url=' + url); reject(new Error('network error')); };
      xhr.send(opts.body || null);
    });
  };
}
// URL 参数解析（兼容 Android 4.4 老 WebView：URLSearchParams 不支持）
function getQueryParam(name){
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
}
var merchantNo = getQueryParam('merchantNo') || 'M001';
var ads = [];
var adIdx = 0;
var adTimer = null;
var lastCalledNo = null;
var lastWinIds = '';

// 全局音频上下文（必须在用户手势里创建/resume）
var audioCtx = null;
var muted = false;
var debugBox = null;

function dbg(msg){
  if(!debugBox){
    debugBox = document.createElement('div');
    debugBox.style.cssText = 'position:fixed;bottom:90px;right:10px;z-index:99998;background:rgba(0,0,0,0.7);color:#0f0;font:12px/1.4 monospace;padding:6px 10px;border-radius:6px;max-width:360px;white-space:pre-wrap;';
    document.body.appendChild(debugBox);
  }
  debugBox.textContent = msg;
  console.log('[AUDIO]', msg);
}

// 开启音频：电视APK走原生播报桥接（无需点击/手势）；网页版自动初始化 AudioContext
function enableAudio(){
  var hint = document.getElementById('audioHint');
  if(hint) hint.style.display = 'none';
  // 电视 APK：原生 TTS 通道，无需 AudioContext
  if(window.AndroidTV && typeof AndroidTV.isAvailable === 'function' && AndroidTV.isAvailable()){
    dbg('电视原生播报通道已就绪');
    return;
  }
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    dbg('AudioContext state=' + audioCtx.state);
  }catch(e){
    dbg('初始化失败: ' + e.message);
  }
}

// 用 Web Audio API 播放 TTS 音频
function playTts(text){
  if(muted) { dbg('已静音，跳过: ' + text); return; }
  // 电视 APK 原生播报桥接（Android 4.2 WebView 无 Web Audio API，走原生 TTS）
  if(window.AndroidTV && typeof AndroidTV.isAvailable === 'function' && AndroidTV.isAvailable()){
    var tvUrl = '/api/tts?text=' + encodeURIComponent(text) + '&spd=3';
    dbg('原生播报: ' + text);
    AndroidTV.speakUrl(tvUrl);
    return;
  }
  if(!audioCtx){ dbg('AudioContext 未初始化'); return; }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  var url = '/api/tts?text=' + encodeURIComponent(text) + '&spd=3';
  dbg('请求 TTS: ' + text);
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    dbg('收到音频 ' + buf.byteLength + ' 字节，解码中...');
    return audioCtx.decodeAudioData(buf);
  }).then(function(decoded){
    var src = audioCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(audioCtx.destination);
    src.start(0);
    dbg('播放中: ' + text);
  }).catch(function(e){
    dbg('播放失败: ' + e.message + '，回退 speechSynthesis');
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      speechSynthesis.speak(u);
    }catch(e2){}
  });
}

// 叫号语音播报（重复3次，每次间隔8秒）
function speakCall(ticketNo, windowNo, seats, callText){
  var text = '';
  if(seats) text += seats + '人桌，';
  text += '请 ' + ticketNo + ' 号顾客';
  if(callText) text += '，' + callText;
  else if(windowNo) text += '，到 ' + windowNo + ' 号窗口';
  text += '。';
  // 安排3次播报，间隔8秒
  for(var i=0; i<3; i++){
    setTimeout(function(){ playTts(text); }, i * 8000);
  }
}

function clock(){
  var d = new Date();
  var pad = function(n){return n<10?'0'+n:n;};
  document.getElementById('clock').textContent = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
setInterval(clock, 1000); clock();

// 二维码由 APK 原生层显示（页面不再生成，避免双二维码）

function renderAd(){
  var area = document.getElementById('adArea');
  if(!ads.length){ area.innerHTML = '<div style="color:#475569;font-size:24px;">暂无广告</div>'; return; }
  var ad = ads[adIdx % ads.length];
  area.innerHTML = '';
  var el;
  if(ad.type === 'video'){
    // 电视 APK（含原生播放器桥接）：视频广告交给原生 MediaPlayer 播放（http 直连），
    // 网页版/无桥接环境仍用 HTML5 video
    if(window.AndroidTV && typeof AndroidTV.playVideo === 'function'){
      var vurl = ad.url;
      if(vurl.indexOf('/') === 0){ vurl = 'http://ybgtc.com' + vurl; }
      else if(vurl.indexOf('https://') === 0){ vurl = 'http://' + vurl.substring(8); }
      console.log('[ad] native playVideo ' + vurl);
      // 页面加载早期调 JS 接口可能报 NPObject（已由 APK 侧 runOnUiThread 修复），短延迟保险
      setTimeout(function(){ AndroidTV.playVideo(vurl); }, 800);
      var dur2 = (ad.durationSec || 10) * 1000;
      if(adTimer) clearTimeout(adTimer);
      adTimer = setTimeout(function(){ adIdx++; renderAd(); }, dur2);
      return;
    }
    el = document.createElement('video');
    // 电视 APK：4.4 视频由系统 MediaPlayer 独立拉流（不走 WebView SSL 放行），
    // https 证书不被系统信任导致 stalled → 改用 http 直连；网页版仍用原 URL
    var vurl = ad.url;
    if(window.AndroidTV){
      if(vurl.indexOf('/') === 0){ vurl = 'http://ybgtc.com' + vurl; }
      else if(vurl.indexOf('https://') === 0){ vurl = 'http://' + vurl.substring(8); }
    }
    el.src = vurl;
    el.autoplay = true;
    el.loop = true;
    el.muted = true;
    el.playsInline = true;
    el.setAttribute('playsinline','');
    el.preload = 'auto';
    el.controls = false;
    // 4.4 老 WebView 内联视频播放不成熟（inLineVideoEnabled=0），长时间未播放回退静态图
    var fbTimer = null;
    var doFallback = function(){
      if(fbTimer){ clearTimeout(fbTimer); fbTimer = null; }
      var img = document.createElement('img');
      var poster = ad.poster || ad.url.replace(/\.mp4$/i, '.jpg');
      if(window.AndroidTV && poster.indexOf('/') === 0){ poster = 'http://ybgtc.com' + poster; }
      img.src = poster;
      area.innerHTML = '';
      img.className = 'ad-fade';
      area.appendChild(img);
      setTimeout(function(){ img.classList.remove('ad-fade'); img.classList.add('ad-show'); }, 10);
    };
    el.addEventListener('playing', function(){ console.log('[video] playing ' + vurl); if(fbTimer){ clearTimeout(fbTimer); fbTimer = null; } });
    el.addEventListener('error', function(){ console.log('[video] error ' + vurl); doFallback(); });
    el.addEventListener('stalled', function(){ console.log('[video] stalled'); });
    fbTimer = setTimeout(function(){
      if(el.readyState < 3){ console.log('[video] fallback to image (no play in 3s)'); doFallback(); }
    }, 3000);
    el.addEventListener('canplay', function(){
      var p = el.play();
      if(p && typeof p.catch === 'function'){ p.catch(function(e){ console.warn('video play fail', e); }); }
    });
  } else {
    // 图片广告：电视环境先停掉原生视频播放器（同样短延迟保险）
    if(window.AndroidTV && typeof AndroidTV.stopVideo === 'function'){
      setTimeout(function(){ AndroidTV.stopVideo(); }, 800);
    }
    el = document.createElement('img');
    el.src = ad.url;
  }
  el.className = 'ad-fade';
  area.appendChild(el);
  // 淡入
  setTimeout(function(){ el.classList.remove('ad-fade'); el.classList.add('ad-show'); }, 10);
  var dur = (ad.durationSec || 10) * 1000;
  if(adTimer) clearTimeout(adTimer);
  adTimer = setTimeout(function(){ adIdx++; renderAd(); }, dur);
}

var lastCalledNo = null;
// 电视屏数据刷新：用原生 XHR（Android 4.4 WebView 最可靠，绕开 fetch/Promise polyfill 链路）
function refresh(){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/tv/'+merchantNo+'/screen', true);
  xhr.onreadystatechange = function(){
    if(xhr.readyState !== 4) return;
    if(xhr.status !== 200) return;
    var res;
    try { res = JSON.parse(xhr.responseText); } catch(e){ return; }
    if(res.code !== 0) return;
    var d = res.data;
    document.getElementById('merchantName').textContent = d.merchantName || merchantNo;
    var c = d.calling;
    if(c){
      document.getElementById('callingTicket').textContent = c.ticketNo;
      document.getElementById('callingTicket').className = 'ticket';
      var info = '';
      if(c.seats) info += c.seats + '人桌';
      if(c.windowNo) info += ' · ' + c.windowNo + '号窗口';
      document.getElementById('callingInfo').textContent = info;
      // 新叫号才语音播报
      if(lastCalledNo !== c.ticketNo){
        speakCall(c.ticketNo, c.windowNo, c.seats, d.config && d.config.callText);
        lastCalledNo = c.ticketNo;
      }
    } else {
      document.getElementById('callingTicket').textContent = '--';
      document.getElementById('callingTicket').className = 'no-call';
      document.getElementById('callingInfo').textContent = '';
      lastCalledNo = null;
    }
    document.getElementById('waitingCount').textContent = '等待中：' + (d.waiting || []).length + ' 人';
    // 等待队列：顶部固定横排桌型标题，每列往下滚动
    var waiting = d.waiting || [];
    var seatTypes = ['2人桌', '4人桌', '6人桌', '10人桌', '12人桌'];
    var bySeats = {};
    waiting.forEach(function(t){
      var key = t.seats ? t.seats + '人桌' : '普通';
      if(!bySeats[key]) bySeats[key] = [];
      bySeats[key].push(t.ticketNo);
    });
    var html = '<div class="queue-header">';
    seatTypes.forEach(function(st){
      var cnt = (bySeats[st] || []).length;
      var waitMin = cnt * (d.config && d.config.estWaitMin || 10);
      html += '<div class="col-label">'+st+'<div style="font-size:11px;color:#64748b;margin-top:3px;">等待'+cnt+'人</div><div style="font-size:10px;color:#475569;margin-top:2px;">约'+waitMin+'分钟</div></div>';
    });
    html += '</div><div class="queue-cols">';
    seatTypes.forEach(function(st){
      var nos = bySeats[st] || [];
      // 号少（少于5个）静态单份显示，避免滚动复制两份导致看起来像重复数据；号多时复制两份无缝滚动
      var needScroll = nos.length >= 5;
      var renderList = needScroll ? nos.concat(nos) : nos;
      html += '<div class="queue-col"><div class="queue-col-inner"' + (needScroll ? '' : ' style="-webkit-animation:none;animation:none;"') + '>';
      if(renderList.length){
        renderList.forEach(function(no){
          html += '<div class="ticket-item">'+no+'</div>';
        });
      } else {
        html += '<div class="ticket-item" style="opacity:0.3;">--</div>';
      }
      html += '</div></div>';
    });
    html += '</div>';
    document.getElementById('queueArea').innerHTML = html;
    // 广告
    console.log('[ad] check ads=' + ads.length + ' dads=' + ((d.ads||[]).length) + ' typeofPlay=' + (window.AndroidTV ? typeof AndroidTV.playVideo : 'noTV'));
    if(JSON.stringify(ads) !== JSON.stringify(d.ads)){
      ads = d.ads || [];
      adIdx = 0;
      console.log('[ad] renderAd call');
      renderAd();
    }
    // 中奖动画
    var wins = d.recentWins || [];
    var winIds = wins.map(function(w){return w.winId;}).join(',');
    if(wins.length && winIds !== lastWinIds){
      showWin(wins[0]);
      lastWinIds = winIds;
    }
  };
  xhr.send();
}

function showWin(win){
  document.getElementById('winDesc').textContent = win.prizeName || '恭喜您抽中奖品';
  var overlay = document.getElementById('winOverlay');
  overlay.classList.add('show');
  playTts('恭喜中奖，' + (win.prizeName || '大奖'));
  setTimeout(function(){ overlay.classList.remove('show'); }, 5000);
}

function enterFullscreen(){
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
}
var muted = false;
function toggleMute(){
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇 声音关' : '🔊 声音开';
  if(muted && audioCtx) audioCtx.suspend();
  if(!muted && audioCtx) audioCtx.resume();
}
enableAudio();
// 加载后自动播报一次测试音（确认语音通道，仅一次）
setTimeout(function(){ playTts('声音已开启，叫号语音播报正常'); }, 3000);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
