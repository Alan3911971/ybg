<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宜必购共享营销系统 · 电视大屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#0b1220;color:#fff;overflow:hidden;height:100vh;}
/* ===== 整体布局：顶栏56 + 主区 + 底部字幕56 ===== */
.header{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;background:#111c33;border-bottom:2px solid #1e3a5f;}
.header h1{font-size:22px;font-weight:800;color:#38bdf8;}
.header .merchant-no{font-size:13px;color:#64748b;background:#1e293b;border-radius:6px;padding:3px 10px;margin-left:12px;}
.header .right-group{display:flex;align-items:center;}
.header .wait-total{font-size:14px;color:#94a3b8;margin-right:16px;}
.header .time{font-size:18px;font-weight:700;color:#e2e8f0;}
.header .btn{margin-left:12px;}
.main{display:flex;height:calc(100vh - 56px - 56px);}
/* ===== 左区 60%：当前叫号横幅 + 队列 ===== */
.left{width:60%;display:flex;flex-direction:column;padding:12px 0 12px 16px;}
.call-area{flex:0 0 168px;background:linear-gradient(135deg,#7c2d12,#9a3412);border-radius:10px;display:flex;align-items:center;padding:0 26px;margin-bottom:12px;position:relative;overflow:hidden;}
.call-area .call-label{font-size:16px;color:#fed7aa;margin-right:20px;letter-spacing:2px;flex-shrink:0;}
.call-area .ticket{font-size:82px;font-weight:900;color:#fff;line-height:1;letter-spacing:2px;-webkit-animation:breathe 2s ease-in-out infinite;animation:breathe 2s ease-in-out infinite;flex-shrink:0;}
.call-area .call-info{font-size:28px;color:#ffedd5;font-weight:700;margin-left:22px;}
.call-area .no-call{color:#7f1d1d;font-size:64px;flex-shrink:0;}
@-webkit-keyframes breathe{0%,100%{-webkit-transform:scale(1);opacity:1;}50%{-webkit-transform:scale(1.05);opacity:0.92;}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.05);opacity:0.92;}}
.queue-area{flex:1;background:#0f1b2e;border:1px solid #1e3a5f;border-radius:10px;padding:12px;overflow:hidden;position:relative;}
/* 5 列用 inline-block + 百分比宽度（Android 4.4 WebView 对 flex:1 均分不可靠，曾出现只渲染 3 列） */
.queue-header{display:block;margin-bottom:10px;font-size:0;}
.queue-header .col-label{display:inline-block;vertical-align:top;width:19.4%;margin-right:0.75%;text-align:center;font-size:14px;font-weight:800;color:#fff;padding:6px 0;border-radius:6px;}
.queue-header .col-label:last-child{margin-right:0;width:19.4%;}
.queue-cols{display:block;height:calc(100% - 46px);font-size:0;}
.queue-col{display:inline-block;vertical-align:top;width:19.4%;margin-right:0.75%;overflow:hidden;position:relative;font-size:0;}
.queue-col:last-child{margin-right:0;width:19.4%;}
.queue-col-inner{-webkit-animation:scrollUp 12s linear infinite;animation:scrollUp 12s linear infinite;}
@-webkit-keyframes scrollUp{0%{-webkit-transform:translateY(0);}100%{-webkit-transform:translateY(-50%);}}
@keyframes scrollUp{0%{transform:translateY(0);}100%{transform:translateY(-50%);}}
.queue-col .ticket-item{font-size:24px;font-weight:700;padding:6px 10px;background:#16233a;border:1px solid #1e3a5f;border-radius:8px;text-align:center;margin-bottom:8px;}
/* 列头与号码按桌型分色 */
.col-A{background:#1d4ed8;} .ticket-A{color:#93c5fd;}
.col-B{background:#059669;} .ticket-B{color:#6ee7b7;}
.col-C{background:#b45309;} .ticket-C{color:#fcd34d;}
.col-D{background:#7e22ce;} .ticket-D{color:#d8b4fe;}
.col-E{background:#be185d;} .ticket-E{color:#f9a8d4;}
/* ===== 右区 40%：广告 + 最近中奖 ===== */
.right{width:40%;background:#0b1220;position:relative;display:flex;flex-direction:column;padding:12px 16px 12px 12px;}
.ad-wrap{flex:1;background:#0f1b2e;border:1px solid #1e3a5f;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.ad-wrap img{width:100%;height:100%;object-fit:cover;transition:opacity 0.5s;}
.ad-wrap video{max-width:100%;max-height:100%;object-fit:contain;}
.ad-fade{opacity:0;}
.ad-show{opacity:1;-webkit-transition:opacity 0.5s;transition:opacity 0.5s;}
.wins-area{flex:0 0 128px;background:#0f1b2e;border:1px solid #1e3a5f;border-radius:10px;margin-top:12px;padding:10px 14px;overflow:hidden;position:relative;}
.wins-area .wins-title{font-size:13px;color:#f59e0b;font-weight:700;margin-bottom:6px;}
.wins-area .win-line{font-size:15px;color:#e2e8f0;line-height:1.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wins-area .win-line b{color:#fbbf24;}
/* ===== 底部字幕 56px ===== */
.ticker{position:fixed;bottom:0;left:0;right:0;height:56px;background:#1a2744;display:flex;align-items:center;justify-content:center;overflow:hidden;border-top:2px solid #1e3a5f;z-index:60;}
.ticker-inner{white-space:nowrap;font-size:22px;color:#38bdf8;font-weight:700;}
/* ===== 中奖全屏动画 ===== */
.win-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:9999;}
.win-overlay.show{display:flex;-webkit-animation:fadeIn 0.5s;animation:fadeIn 0.5s;}
.win-box{text-align:center;color:#fff;}
.win-box .trophy{font-size:120px;margin-bottom:20px;-webkit-animation:bounce 1s infinite;animation:bounce 1s infinite;}
.win-box .title{font-size:48px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;}
.win-box .desc{font-size:24px;color:#e2e8f0;}
@-webkit-keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@-webkit-keyframes bounce{0%,100%{-webkit-transform:translateY(0);}50%{-webkit-transform:translateY(-20px);}}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;align-items:center;">
    <h1 id="merchantName">加载中...</h1>
    <span class="merchant-no" id="merchantNoLabel"></span>
  </div>
  <div class="right-group">
    <span class="wait-total" id="waitTotal">等待中：--</span>
    <button onclick="toggleMute()" id="muteBtn" style="background:rgba(0,0,0,0.5);color:#fff;padding:5px 12px;border:none;border-radius:6px;font-size:13px;cursor:pointer;">🔊 声音开</button>
    <button onclick="enterFullscreen()" style="background:rgba(0,0,0,0.5);color:#fff;padding:5px 12px;border:none;border-radius:6px;font-size:13px;cursor:pointer;">📺 全屏</button>
    <div class="time" id="clock" style="margin-left:14px;"></div>
  </div>
</div>

<div class="main">
  <!-- 左区：当前叫号横幅 + 队列 -->
  <div class="left">
    <div class="call-area">
      <div class="call-label">当前叫号</div>
      <div id="callingTicket" class="no-call">--</div>
      <div id="callingInfo" class="call-info"></div>
    </div>
    <div class="queue-area" id="queueArea"></div>
  </div>
  <!-- 右区：广告 + 最近中奖（右下角留白，二维码由 APK 原生层显示） -->
  <div class="right">
    <div class="ad-wrap" id="adArea">
      <div style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.5);color:#94a3b8;padding:4px 10px;border-radius:6px;font-size:12px;z-index:10;">广告</div>
      <div style="color:#475569;font-size:24px;">暂无广告</div>
    </div>
    <div class="wins-area">
      <div class="wins-title">🎉 最近中奖</div>
      <div id="winsList"><div class="win-line" style="color:#475569;">暂无中奖记录</div></div>
    </div>
  </div>
</div>

<!-- 滚动字幕 -->
<div class="ticker">
  <div class="ticker-inner" id="tickerText">🎁 排队期间扫码抽盲盒，中奖免单/打折 · 欢迎光临 · 我们将竭诚为您服务 ·</div>
</div>

<!-- 音频提示（电视APK走原生播报，网页版自动初始化） -->
<div id="audioHint" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:99999;cursor:pointer;" onclick="enableAudio()">
  <div style="text-align:center;color:#fff;">
    <div style="font-size:48px;margin-bottom:20px;">🔊</div>
    <div style="font-size:28px;font-weight:600;">点击任意位置开启声音</div>
    <div style="font-size:18px;color:#94a3b8;margin-top:10px;">开启后叫号语音播报正常播放</div>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <div class="trophy">🎉</div>
    <div class="title">恭喜中奖！</div>
    <div class="desc" id="winDesc">恭喜您抽中奖品</div>
  </div>
</div>

<script>
// ===== 老 WebView（Android 4.4）ES5 polyfill：Promise / URLSearchParams / fetch =====
if(!window.Promise){
  (function(){
    var PENDING=0, FULFILLED=1, REJECTED=2;
    function Promise(executor){
      this._state=PENDING; this._value=undefined; this._queue=[];
      var self=this;
      function resolve(v){
        if(v && (typeof v==='object' || typeof v==='function') && typeof v.then==='function'){
          var called=false;
          v.then(
            function(val){ if(!called){ called=true; settle(self, FULFILLED, val); } },
            function(err){ if(!called){ called=true; settle(self, REJECTED, err); } }
          );
          return;
        }
        settle(self, FULFILLED, v);
      }
      function reject(r){ settle(self, REJECTED, r); }
      try{ executor(resolve, reject); }catch(e){ reject(e); }
    }
    function settle(p, state, value){
      if(p._state!==PENDING) return;
      p._state=state; p._value=value;
      var q;
      while((q=p._queue.shift())){ asap(q[0], q[1], state, value); }
    }
    function asap(onFulfilled, onRejected, state, value){
      setTimeout(function(){
        var fn = state===FULFILLED ? onFulfilled : onRejected;
        if(typeof fn!=='function') return;
        try{ fn(value); }catch(e){ setTimeout(function(){ throw e; }, 0); }
      }, 0);
    }
    Promise.prototype.then = function(onFulfilled, onRejected){
      var self=this;
      return new Promise(function(resolve, reject){
        self._queue.push([
          function(v){ resolve(onFulfilled ? onFulfilled(v) : v); },
          function(e){ reject(e); }
        ]);
        if(self._state!==PENDING) settle(self, self._state, self._value);
      });
    };
    Promise.prototype['catch'] = function(onRejected){ return this.then(null, onRejected); };
    Promise.resolve = function(v){ return new Promise(function(res){ res(v); }); };
    Promise.reject = function(r){ return new Promise(function(res, rej){ rej(r); }); };
    window.Promise = Promise;
  })();
}
if(!window.URLSearchParams){
  window.URLSearchParams = function(search){
    this._params = {};
    if(typeof search === 'string' && search){
      search.replace(/^\?/, '').split('&').forEach(function(kv){
        var p = kv.split('=');
        this._params[decodeURIComponent(p[0])] = decodeURIComponent((p[1]||'').replace(/\+/g, ' '));
      }, this);
    }
  };
  window.URLSearchParams.prototype.get = function(name){
    return this._params[name] !== undefined ? this._params[name] : null;
  };
}
if(!window.fetch){
  window.fetch = function(url, opts){
    opts = opts || {};
    return new Promise(function(resolve, reject){
      var xhr = new XMLHttpRequest();
      xhr.open(opts.method || 'GET', url, true);
      if(opts.responseType === 'arraybuffer') xhr.responseType = 'arraybuffer';
      xhr.onreadystatechange = function(){
        if(xhr.readyState !== 4) return;
        if(xhr.status >= 200 && xhr.status < 300){
          resolve({
            ok: true,
            status: xhr.status,
            arrayBuffer: function(){ return Promise.resolve(xhr.response || new ArrayBuffer(0)); },
            json: function(){
              try { return Promise.resolve(JSON.parse(xhr.responseText)); }
              catch(e){ return Promise.reject(e); }
            },
            text: function(){ return Promise.resolve(xhr.responseText); }
          });
        } else {
          console.log('[XHR] HTTP ' + xhr.status + ' url=' + url);
          reject(new Error('HTTP ' + xhr.status));
        }
      };
      xhr.onerror = function(){ console.log('[XHR] network error url=' + url); reject(new Error('network error')); };
      xhr.send(opts.body || null);
    });
  };
}
function getQueryParam(name){
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
}
var merchantNo = getQueryParam('merchantNo') || 'M001';
var ads = [];
var adIdx = 0;
var adTimer = null;
var lastCalledNo = null;
var lastWinIds = '';

var audioCtx = null;
var muted = false;
var debugBox = null;

function dbg(msg){
  if(!debugBox){
    debugBox = document.createElement('div');
    debugBox.style.cssText = 'position:fixed;bottom:90px;right:10px;z-index:99998;background:rgba(0,0,0,0.7);color:#0f0;font:12px/1.4 monospace;padding:6px 10px;border-radius:6px;max-width:360px;white-space:pre-wrap;';
    document.body.appendChild(debugBox);
  }
  debugBox.textContent = msg;
  console.log('[AUDIO]', msg);
}

function enableAudio(){
  var hint = document.getElementById('audioHint');
  if(hint) hint.style.display = 'none';
  if(window.AndroidTV && typeof AndroidTV.isAvailable === 'function' && AndroidTV.isAvailable()){
    dbg('电视原生播报通道已就绪');
    return;
  }
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    dbg('AudioContext state=' + audioCtx.state);
  }catch(e){
    dbg('初始化失败: ' + e.message);
  }
}

function playTts(text){
  if(muted) { dbg('已静音，跳过: ' + text); return; }
  if(window.AndroidTV && typeof AndroidTV.isAvailable === 'function' && AndroidTV.isAvailable()){
    var tvUrl = '/api/tts?text=' + encodeURIComponent(text) + '&spd=3';
    dbg('原生播报: ' + text);
    AndroidTV.speakUrl(tvUrl);
    return;
  }
  if(!audioCtx){ dbg('AudioContext 未初始化'); return; }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  var url = '/api/tts?text=' + encodeURIComponent(text) + '&spd=3';
  dbg('请求 TTS: ' + text);
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    dbg('收到音频 ' + buf.byteLength + ' 字节，解码中...');
    return audioCtx.decodeAudioData(buf);
  }).then(function(decoded){
    var src = audioCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(audioCtx.destination);
    src.start(0);
    dbg('播放中: ' + text);
  }).catch(function(e){
    dbg('播放失败: ' + e.message + '，回退 speechSynthesis');
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      speechSynthesis.speak(u);
    }catch(e2){}
  });
}

function speakCall(ticketNo, windowNo, seats, callText){
  var text = '';
  if(seats) text += seats + '人桌，';
  text += '请 ' + ticketNo + ' 号顾客';
  if(callText) text += '，' + callText;
  else if(windowNo) text += '，到 ' + windowNo + ' 号窗口';
  text += '。';
  for(var i=0; i<3; i++){
    setTimeout(function(){ playTts(text); }, i * 8000);
  }
}

function clock(){
  var d = new Date();
  var pad = function(n){return n<10?'0'+n:n;};
  var el = document.getElementById('clock');
  if(el) el.textContent = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
setInterval(clock, 1000); clock();

// ===== 桌型与号段字母映射（与后端 prefixBySeats 一致）=====
var SEAT_META = [
  {seats:2, prefix:'A', label:'A · 2人桌', colClass:'col-A', ticketClass:'ticket-A'},
  {seats:4, prefix:'B', label:'B · 4人桌', colClass:'col-B', ticketClass:'ticket-B'},
  {seats:6, prefix:'C', label:'C · 6人桌', colClass:'col-C', ticketClass:'ticket-C'},
  {seats:10, prefix:'D', label:'D · 10人桌', colClass:'col-D', ticketClass:'ticket-D'},
  {seats:12, prefix:'E', label:'E · 12人桌', colClass:'col-E', ticketClass:'ticket-E'}
];

// 广告渲染（逻辑不变：原生播放器/HTML5 video/图片 + 淡入 + 定时轮播）
function renderAd(){
  var area = document.getElementById('adArea');
  if(!ads.length){ area.innerHTML = '<div style="color:#475569;font-size:24px;">暂无广告</div>'; return; }
  var ad = ads[adIdx % ads.length];
  area.innerHTML = '';
  var el;
  if(ad.type === 'video'){
    if(window.AndroidTV && typeof AndroidTV.playVideo === 'function'){
      var vurl = ad.url;
      if(vurl.indexOf('/') === 0){ vurl = 'http://ybgtc.com' + vurl; }
      else if(vurl.indexOf('https://') === 0){ vurl = 'http://' + vurl.substring(8); }
      console.log('[ad] native playVideo ' + vurl);
      setTimeout(function(){ AndroidTV.playVideo(vurl); }, 800);
      var dur2 = (ad.durationSec || 10) * 1000;
      if(adTimer) clearTimeout(adTimer);
      adTimer = setTimeout(function(){ adIdx++; renderAd(); }, dur2);
      return;
    }
    el = document.createElement('video');
    var vurl = ad.url;
    if(window.AndroidTV){
      if(vurl.indexOf('/') === 0){ vurl = 'http://ybgtc.com' + vurl; }
      else if(vurl.indexOf('https://') === 0){ vurl = 'http://' + vurl.substring(8); }
    }
    el.src = vurl;
    el.autoplay = true;
    el.loop = true;
    el.muted = true;
    el.playsInline = true;
    el.setAttribute('playsinline','');
    el.preload = 'auto';
    el.controls = false;
    var fbTimer = null;
    var doFallback = function(){
      if(fbTimer){ clearTimeout(fbTimer); fbTimer = null; }
      var img = document.createElement('img');
      var poster = ad.poster || ad.url.replace(/\.mp4$/i, '.jpg');
      if(window.AndroidTV && poster.indexOf('/') === 0){ poster = 'http://ybgtc.com' + poster; }
      img.src = poster;
      area.innerHTML = '';
      img.className = 'ad-fade';
      area.appendChild(img);
      setTimeout(function(){ img.classList.remove('ad-fade'); img.classList.add('ad-show'); }, 10);
    };
    el.addEventListener('playing', function(){ console.log('[video] playing ' + vurl); if(fbTimer){ clearTimeout(fbTimer); fbTimer = null; } });
    el.addEventListener('error', function(){ console.log('[video] error ' + vurl); doFallback(); });
    el.addEventListener('stalled', function(){ console.log('[video] stalled'); });
    fbTimer = setTimeout(function(){
      if(el.readyState < 3){ console.log('[video] fallback to image (no play in 3s)'); doFallback(); }
    }, 3000);
    el.addEventListener('canplay', function(){
      var p = el.play();
      if(p && typeof p.catch === 'function'){ p.catch(function(e){ console.warn('video play fail', e); }); }
    });
  } else {
    if(window.AndroidTV && typeof AndroidTV.stopVideo === 'function'){
      setTimeout(function(){ AndroidTV.stopVideo(); }, 800);
    }
    el = document.createElement('img');
    el.src = ad.url;
  }
  el.className = 'ad-fade';
  area.appendChild(el);
  setTimeout(function(){ el.classList.remove('ad-fade'); el.classList.add('ad-show'); }, 10);
  var dur = (ad.durationSec || 10) * 1000;
  if(adTimer) clearTimeout(adTimer);
  adTimer = setTimeout(function(){ adIdx++; renderAd(); }, dur);
}

// 最近中奖列表渲染（新）
function renderWins(wins){
  var box = document.getElementById('winsList');
  if(!box) return;
  if(!wins || !wins.length){
    box.innerHTML = '<div class="win-line" style="color:#475569;">暂无中奖记录</div>';
    return;
  }
  var html = '';
  for(var i=0; i<Math.min(wins.length, 4); i++){
    var w = wins[i];
    var who = w.ticketNo ? ' ' + w.ticketNo + ' 号' : '';
    html += '<div class="win-line">恭喜' + who + '抽中 <b>' + (w.prizeName || '大奖') + '</b></div>';
  }
  box.innerHTML = html;
}

// 电视屏数据刷新：原生 XHR（Android 4.4 最可靠）
function refresh(){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/tv/'+merchantNo+'/screen', true);
  xhr.onreadystatechange = function(){
    if(xhr.readyState !== 4) return;
    if(xhr.status !== 200) return;
    var res;
    try { res = JSON.parse(xhr.responseText); } catch(e){ return; }
    if(res.code !== 0) return;
    var d = res.data;
    var nameEl = document.getElementById('merchantName');
    if(nameEl) nameEl.textContent = d.merchantName || merchantNo;
    var noEl = document.getElementById('merchantNoLabel');
    if(noEl) noEl.textContent = '商家号 ' + merchantNo;
    // 当前叫号
    var c = d.calling;
    var ct = document.getElementById('callingTicket');
    if(c){
      ct.textContent = c.ticketNo;
      ct.className = 'ticket';
      var info = '';
      if(c.seats) info += c.seats + '人桌';
      if(c.windowNo) info += ' · ' + c.windowNo + '号窗口';
      document.getElementById('callingInfo').textContent = info;
      if(lastCalledNo !== c.ticketNo){
        speakCall(c.ticketNo, c.windowNo, c.seats, d.config && d.config.callText);
        lastCalledNo = c.ticketNo;
      }
    } else {
      ct.textContent = '--';
      ct.className = 'no-call';
      document.getElementById('callingInfo').textContent = '';
      lastCalledNo = null;
    }
    var waiting = d.waiting || [];
    var wt = document.getElementById('waitTotal');
    if(wt) wt.textContent = '等待中：' + waiting.length + ' 桌';
    // 队列：5 列桌型分色渲染
    var bySeats = {};
    waiting.forEach(function(t){
      var key = t.seats ? t.seats : 0;
      if(!bySeats[key]) bySeats[key] = [];
      bySeats[key].push(t.ticketNo);
    });
    var html = '<div class="queue-header">';
    SEAT_META.forEach(function(m){
      var cnt = (bySeats[m.seats] || []).length;
      var waitMin = cnt * (d.config && d.config.estWaitMin || 10);
      html += '<div class="col-label ' + m.colClass + '">' + m.label +
              '<div style="font-size:11px;color:rgba(255,255,255,0.75);margin-top:3px;">等待' + cnt + '桌</div>' +
              '<div style="font-size:10px;color:rgba(255,255,255,0.55);margin-top:2px;">约' + waitMin + '分钟</div></div>';
    });
    html += '</div><div class="queue-cols">';
    SEAT_META.forEach(function(m){
      var nos = bySeats[m.seats] || [];
      var needScroll = nos.length >= 5;
      var renderList = needScroll ? nos.concat(nos) : nos;
      html += '<div class="queue-col"><div class="queue-col-inner"' + (needScroll ? '' : ' style="-webkit-animation:none;animation:none;"') + '>';
      if(renderList.length){
        renderList.forEach(function(no){
          html += '<div class="ticket-item ' + m.ticketClass + '">' + no + '</div>';
        });
      } else {
        html += '<div class="ticket-item" style="opacity:0.3;">--</div>';
      }
      html += '</div></div>';
    });
    html += '</div>';
    document.getElementById('queueArea').innerHTML = html;
    // 广告
    if(JSON.stringify(ads) !== JSON.stringify(d.ads)){
      ads = d.ads || [];
      adIdx = 0;
      renderAd();
    }
    // 中奖：全屏动画（最新一条）+ 右侧最近中奖列表
    var wins = d.recentWins || [];
    var winIds = wins.map(function(w){return w.winId;}).join(',');
    if(wins.length && winIds !== lastWinIds){
      showWin(wins[0]);
      lastWinIds = winIds;
    }
    renderWins(wins);
  };
  xhr.send();
}

function showWin(win){
  var desc = document.getElementById('winDesc');
  if(desc) desc.textContent = win.prizeName || '恭喜您抽中奖品';
  var overlay = document.getElementById('winOverlay');
  overlay.classList.add('show');
  playTts('恭喜中奖，' + (win.prizeName || '大奖'));
  setTimeout(function(){ overlay.classList.remove('show'); }, 5000);
}

function enterFullscreen(){
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
}
function toggleMute(){
  muted = !muted;
  var btn = document.getElementById('muteBtn');
  if(btn) btn.textContent = muted ? '🔇 声音关' : '🔊 声音开';
  if(muted && audioCtx) audioCtx.suspend();
  if(!muted && audioCtx) audioCtx.resume();
}
enableAudio();
setTimeout(function(){ playTts('声音已开启，叫号语音播报正常'); }, 3000);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
