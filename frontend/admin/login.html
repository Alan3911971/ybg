<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>平台后台登录 · 宜必购</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --pri:#4f46e5;--pri-grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --dark:#0f172a;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
  --bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--divider:#f1f5f9;
  --shadow-card:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  --r-sm:8px;--r-md:12px;--r-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--dark);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;position:relative;overflow:hidden;}
body::before{content:'';position:absolute;top:-40%;left:-20%;width:80vw;height:80vw;background:radial-gradient(circle,rgba(79,70,229,.15) 0%,transparent 70%);pointer-events:none;}
body::after{content:'';position:absolute;bottom:-30%;right:-15%;width:70vw;height:70vw;background:radial-gradient(circle,rgba(124,58,237,.12) 0%,transparent 70%);pointer-events:none;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
.card{background:var(--surface);border-radius:var(--r-lg);padding:40px 32px;width:100%;max-width:400px;box-shadow:var(--shadow-card);animation:fadeInUp .5s ease-out;position:relative;z-index:1;}
.brand{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;}
.brand .logo{width:60px;height:60px;border-radius:16px;background:var(--pri-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:14px;box-shadow:0 8px 20px rgba(79,70,229,.35);}
.brand h1{font-size:20px;font-weight:700;color:var(--text);}
.brand .sub{font-size:13px;color:var(--text-3);margin-top:6px;}
.err{color:var(--danger);background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r-sm);font-size:13px;padding:10px 12px;margin-bottom:16px;min-height:18px;display:none;line-height:1.5;}
.err.show{display:block;animation:fadeInUp .2s ease-out;}
.field{margin-bottom:16px;position:relative;}
.field input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--r-md);font-size:15px;color:var(--text);background:#fff;transition:border-color .2s,box-shadow .2s;}
.field input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
.field input::placeholder{color:var(--text-3);}
/* Button System */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;font-weight:600;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);letter-spacing:.2px;white-space:nowrap;}
.btn-xs{height:28px;padding:0 10px;font-size:12px;border-radius:6px;}
.btn-sm{height:36px;padding:0 16px;font-size:13px;border-radius:8px;}
.btn-md{height:44px;padding:0 24px;font-size:14px;border-radius:10px;}
.btn-lg{height:52px;padding:0 32px;font-size:16px;border-radius:12px;}
.btn-xl{height:60px;padding:0 40px;font-size:18px;border-radius:14px;}
.btn-block{width:100%;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:12px;}
.btn-primary{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--pri-bg);color:var(--pri);}
.btn-ghost{background:transparent;color:var(--pri);}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3);}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 14px rgba(245,158,11,.3);}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
.btn:active{transform:scale(.97);filter:brightness(.95);}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important;}
.btn.loading{pointer-events:none;position:relative;color:transparent!important;}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:btn-spin .6s linear infinite;}
@keyframes btn-spin{to{transform:rotate(360deg);}}
.fab{position:fixed;bottom:calc(88px + var(--safe-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(79,70,229,.4);z-index:40;border:none;cursor:pointer;transition:transform .15s;}
.fab:active{transform:scale(.9);}
.btn-cta{width:100%;height:56px;font-size:17px;font-weight:700;border-radius:16px;letter-spacing:.3px;}
.row-actions{display:flex;gap:6px;}
.hint{margin-top:20px;font-size:12px;color:var(--text-3);text-align:center;line-height:1.8;}
.hint code{background:var(--divider);padding:2px 8px;border-radius:4px;font-size:12px;color:var(--text-2);font-family:"SF Mono",Monaco,Consolas,monospace;}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">🛡️</div><h1>宜必购平台管理后台</h1><div class="sub">商家管理 · 全局配置 · 审计告警</div></div>
  <div class="err" id="err"></div>
  <div class="field"><input id="account" placeholder="管理员账号" autocomplete="username"></div>
  <div class="field"><input id="pwd" type="password" placeholder="管理员密码" autocomplete="current-password"></div>
  <button class="btn btn-md btn-primary btn-block" id="btnLogin">登 录</button>
  <div class="hint">测试账号：<code>admin</code> / 密码 <code>Admin@2026</code></div>
</div>
<script>
const $ = id => document.getElementById(id);
$("btnLogin").onclick = async function(){
  $("err").style.display = "none";
  const body = new URLSearchParams({ account: $("account").value.trim(), password: $("pwd").value });
  $("btnLogin").disabled = true;
  try {
    const r = await fetch("http://127.0.0.1:8766/api/admin/auth/login", { method: "POST", body: body.toString() }).then(function(r){ return r.json(); });
    if (r.code === 0) {
      localStorage.setItem("ibigou_admin_token", r.data);
      location.href = "index.html";
    } else {
      $("err").textContent = r.msg || "登录失败";
      $("err").style.display = "block";
    }
  } catch (e) {
    $("err").textContent = "网络异常，请稍后再试";
    $("err").style.display = "block";
  }
  finally { $("btnLogin").disabled = false; }
};
$("pwd").addEventListener("keydown", function(e){ if (e.key === "Enter") $("btnLogin").onclick(); });
</script>
</body>
</html>
