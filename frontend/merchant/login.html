<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>商家后台登录 · 宜必购</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%8F%AA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --c-primary:#2563eb; --c-primary-600:#1d4ed8; --c-primary-100:#dbeafe;
    --c-accent:#10b981; --c-success:#16a34a; --c-warning:#f59e0b; --c-danger:#dc2626;
    --c-text:#1a2233; --c-text-2:#4d556a; --c-text-3:#8089a0;
    --c-bg:#f5f7fb; --c-surface:#fff; --c-border:#e6e8ef;
    --c-grad-1:linear-gradient(135deg,#2563eb 0%,#3b82f6 100%);
    --c-grad-bg:linear-gradient(160deg,#1d4ed8 0%,#2563eb 60%,#10b981 100%);
    --r-md:10px; --r-lg:14px;
    --sh-2:0 8px 24px rgba(29,78,216,.20);
    --sh-press:0 0 0 4px rgba(37,99,235,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--c-text);background:var(--c-grad-bg);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{background:var(--c-surface);border-radius:var(--r-lg);padding:32px 28px;width:100%;max-width:380px;box-shadow:var(--sh-2);}
  .brand{display:flex;flex-direction:column;align-items:center;margin-bottom:18px;}
  .brand .logo{width:56px;height:56px;border-radius:16px;background:var(--c-grad-1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:10px;box-shadow:0 6px 14px rgba(37,99,235,.35);}
  .brand h1{font-size:18px;font-weight:600;}
  .brand .sub{font-size:12px;color:var(--c-text-3);margin-top:4px;}
  .err{color:var(--c-danger);background:#fde8e8;border:1px solid #f5b3b3;border-radius:8px;font-size:13px;padding:8px 10px;margin-bottom:12px;min-height:18px;display:none;}
  .err.show{display:block;}
  .field{margin-bottom:14px;}
  .field input{width:100%;padding:13px 14px;border:1px solid var(--c-border);border-radius:var(--r-md);font-size:16px;color:var(--c-text);background:#fff;transition:border-color .15s,box-shadow .15s;}
  .field input:focus{outline:none;border-color:var(--c-primary);box-shadow:var(--sh-press);}
  .field input::placeholder{color:var(--c-text-3);}
  .btn{width:100%;padding:14px;border:none;border-radius:var(--r-md);background:var(--c-grad-1);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 14px rgba(37,99,235,.35);transition:transform .12s,box-shadow .15s;}
  .btn:active{transform:scale(.98);}
  .hint{margin-top:18px;font-size:12px;color:var(--c-text-3);text-align:center;line-height:1.8;}
  .hint code{background:#eef0f4;padding:2px 6px;border-radius:4px;font-size:12px;color:var(--c-text-2);}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo">🏪</div><h1>商家后台 · 宜必购</h1><div class="sub">门店配置 · 核销 · 报表 · 会员</div></div>
  <div class="err" id="err"></div>
  <div class="field"><input id="account" placeholder="登录账号" autocomplete="username"></div>
  <div class="field"><input id="pwd" type="password" placeholder="登录密码" autocomplete="current-password"></div>
  <button class="btn" id="btnLogin">登 录</button>
  <div class="hint">测试账号：<code>m001</code> / 密码 <code>smoke123</code><br>登录后请在「会员续费」页确认会员状态。</div>
</div>
<script>
const $ = id => document.getElementById(id);
$("btnLogin").onclick = async function(){
  $("err").style.display = "none";
  const body = new URLSearchParams({ account: $("account").value.trim(), password: $("pwd").value });
  $("btnLogin").disabled = true;
  try {
    const r = await fetch("/api/merchant/auth/login", { method: "POST", body: body.toString() }).then(function(r){ return r.json(); });
    if (r.code === 0) {
      localStorage.setItem("ibigou_merchant_token", r.data);
      location.href = "index.html";
    } else {
      $("err").textContent = r.msg || "登录失败";
      $("err").style.display = "block";
    }
  } catch (e) {
    $("err").textContent = "网络异常，请稍后再试";
    $("err").style.display = "block";
  }
  finally { $("btnLogin").disabled = false; }
};
$("pwd").addEventListener("keydown", function(e){ if (e.key === "Enter") $("btnLogin").onclick(); });
</script>
</body>
</html>
